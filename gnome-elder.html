<title>Как гномы выковали молот Тора — дом Дубоборода · Тиввиг</title>
<style>

.spread{position:relative;display:flex;flex-direction:column;flex:1;min-width:0;min-height:0;max-width:1700px;border:clamp(5px,.8vw,10px) double #b68b59;border-radius:clamp(9px,1.5vw,23px);background:repeating-linear-gradient(120deg,#f7e9c9 0 12px,#f4e2b9 12px 13px);box-shadow:inset 0 0 0 3px #fff4d5,0 17px 48px #0009;color:var(--ink);overflow:hidden}
.reader-head{min-height:clamp(51px,8vh,74px);flex:0 0 auto;border-bottom:1px solid #b38a5880;display:flex;align-items:center;justify-content:center;padding:8px 67px 8px 20px}

.cover .rune{font-size:clamp(28px,6vw,68px);line-height:1.1;color:#f1cb88}

.illustration{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;width:100%;height:100%;min-height:0;min-width:0}
.illustration img{display:block;max-width:100%;max-height:calc(100% - 37px);width:auto;height:auto;object-fit:contain;box-shadow:0 6px 17px #42291659;border:3px solid #9a794d;background:#eee0bf}
.illustration figcaption{font-size:clamp(11px,1.15vw,15px);color:#6f543e;text-align:center;line-height:1.25;max-width:95%}

.textleaf::before{content:"❧";position:absolute;top:15px;right:22px;font-size:33px;color:#b18c59}
.textleaf h2{font-size:clamp(26px,3.5vw,53px);line-height:1.14;margin:0;font-weight:normal;color:#684b2e}
.textleaf p{font-size:clamp(20px,2.8vw,39px);line-height:1.35;margin:0;color:#4b3423}
.reader-controls{flex:0 0 auto;min-height:clamp(61px,9vh,89px);display:flex;align-items:center;justify-content:center;gap:clamp(7px,2vw,22px);padding:7px 13px;border-top:1px solid #ac865a70}
.nav-btn{min-height:47px;min-width:clamp(102px,16vw,177px);padding:8px 14px;border:2px solid #9f7648;border-radius:11px;background:linear-gradient(#375b4b,#1f3c32);color:#fff0c5;font-weight:bold;font-size:clamp(14px,1.7vw,21px)}
.nav-btn:disabled{opacity:.35;cursor:default}

@media(max-width:650px){.top{justify-content:center}.top h1{width:100%}.shell{padding:7px}.scene{border-width:3px}.book-hotspot span{font-size:10px;padding:4px 6px}.reader{padding:3px}.reader-head{min-height:53px;padding:5px 53px 5px 8px}.reader-title{font-size:clamp(16px,4vw,22px)}.close{right:4px;top:4px;min-width:42px;min-height:42px}.book-body{padding:6px}.textleaf{padding:18px 14px;gap:14px}.textleaf h2{font-size:clamp(24px,5vw,34px)}.textleaf p{font-size:clamp(20px,4vw,28px)}.reader-controls{min-height:65px;gap:6px}.nav-btn{flex:1;min-width:0;padding:8px 5px;font-size:14px}.counter{min-width:55px}.illustration img{max-height:calc(100% - 48px)}}
@media(max-height:450px){.reader-head{min-height:38px}.reader-controls{min-height:44px}.nav-btn{min-height:36px}.book-body{padding:4px}.textleaf{padding:10px 18px;gap:8px}.textleaf h2{font-size:21px}.textleaf p{font-size:18px;line-height:1.24}}

/* Six true open-book spreads: illustration and the story visible at the same time. */
.book-body{padding:clamp(5px,.75vw,12px);display:flex;align-items:stretch;justify-content:stretch;overflow:hidden}
.open-pages{width:100%;height:100%;min-height:0;display:grid;grid-template-columns:1fr 1fr;position:relative;box-shadow:0 6px 22px #3d291943;border:2px solid #ab875b;border-radius:7px 16px 16px 7px;overflow:hidden;background:#fff0ce}
.open-pages::after{content:"";z-index:2;pointer-events:none;position:absolute;left:50%;top:0;bottom:0;width:14px;transform:translateX(-50%);background:linear-gradient(90deg,#5a3d2470,#e4cba38c 40%,#6b4c3375 55%,#ead5ad5c);box-shadow:0 0 12px #4b301c2d}
.book-left-page,.book-right-page{min-width:0;min-height:0}
.book-left-page{display:flex;align-items:center;justify-content:center;padding:clamp(7px,1.6vw,28px);background:linear-gradient(90deg,#f3dfb9,#ffefc9 85%,#e4ca9e);overflow:hidden}
.book-left-page .illustration{width:100%;height:100%;min-height:0;min-width:0;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.book-left-page .illustration img{width:auto;height:auto;max-width:100%;max-height:calc(100% - 28px);object-fit:contain;flex:0 1 auto;min-height:0;box-shadow:0 5px 15px #452b1c55;background:#e9dab9;border:clamp(2px,.23vw,4px) solid #b08c60}
.book-left-page figcaption{font-size:clamp(11px,1.14vw,15px);line-height:1.17;text-align:center;max-width:100%}
.book-right-page{display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,2.5vh,28px);padding:clamp(12px,3.1vw,62px);background:repeating-linear-gradient(0deg,transparent 0 38px,#8e74420c 39px),linear-gradient(90deg,#e4cca2,#fff2cf 8%,#ffefc7 96%);color:#503625;overflow-y:auto}
.book-right-page .page-ornament{font-size:clamp(18px,2.5vw,29px);text-align:center;color:#a4804a}
.book-right-page h2{font-size:clamp(24px,3.2vw,49px);font-weight:normal;line-height:1.11;margin:0;color:#6a472b}
.book-right-page p{font-size:clamp(19px,2.23vw,35px);line-height:1.37;margin:0;color:#4b3225}
.book-right-page .book-page-number{margin-top:auto;color:#94764c;text-align:right;font-size:clamp(11px,1vw,14px)}
@media(max-width:680px){
 .book-body{padding:3px}
 .book-left-page{padding:4px}
 .book-right-page{padding:10px 7px 7px 11px;gap:7px;justify-content:flex-start}
 .book-right-page h2{font-size:clamp(17px,4.4vw,26px)}
 .book-right-page p{font-size:clamp(14px,3.6vw,20px);line-height:1.31}
 .book-right-page .page-ornament{font-size:17px}
 .book-left-page figcaption{font-size:10px}
 .book-left-page .illustration img{max-height:calc(100% - 27px)}
 .open-pages::after{width:8px}
 .book-right-page .book-page-number{font-size:10px}
}
@media(max-height:470px){.book-right-page{justify-content:flex-start;gap:5px;padding:8px 12px}.book-right-page h2{font-size:clamp(17px,2.4vw,26px)}.book-right-page p{font-size:clamp(13px,1.8vw,21px)}.book-right-page .page-ornament{display:none}}

@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<body>
<main class="shell">
<header class="top"><a class="back" href="gnome-village.html">← Деревня гномов</a><h1>Хижина Дубоборода</h1><span>Старинная книга</span></header>
<div class="scene" aria-label="Хижина старейшины гномов: книги, свитки и древняя легенда">
<img src="images/gnome-elder-house.webp?v=1" width="1440" height="810" alt="Дубобород в своей хижине держит большую старинную книгу" draggable="false" fetchpriority="high">
<button type="button" class="book-hotspot" id="elderSceneBook" aria-label="Открыть легенду о молоте Тора" aria-expanded="false"><span>📖 Открыть книгу</span></button>
</div>
</main>
<section id="reader" class="reader" role="dialog" aria-modal="true" aria-labelledby="readerTitle" hidden>
<div class="spread">
<header class="reader-head"><h1 id="readerTitle" class="reader-title">Как гномы выковали молот Тора</h1><button class="close" type="button" id="elderClose" aria-label="Закрыть книгу">×</button></header>
<div class="book-body" id="elderBody" aria-live="polite"></div>
<nav class="reader-controls" aria-label="Перелистывание">
<button type="button" class="nav-btn" id="elderPrev">← Назад</button>
<span class="counter" id="elderCounter" aria-label="Разворот 1 из 6">1 / 6</span>
<button type="button" class="nav-btn" id="elderNext">Дальше →</button>
</nav>
</div>
</section>
<p id="gameConnection" role="status" aria-live="polite" hidden></p>
<script>
(()=>{
"use strict";
const W="https://commons.wikimedia.org/wiki/File:";
const U="https://upload.wikimedia.org/wikipedia/commons/";
const pictures=[
 {title:"Проделка Локи",src:"images/thor-book-01.webp",original:U+"1/1b/How_loki_wrought_mischief_in_Asgard_by_Willy_Pogany.png",file:"How_loki_wrought_mischief_in_Asgard_by_Willy_Pogany.png",credit:"Вилли Погани, 1920",alt:"Локи срезает золотые волосы Сив, пока она спит"},
 {title:"Золотые волосы Сив",src:U+"5/58/The_Gold_Hair_that_Loki_Made.jpg",file:"The_Gold_Hair_that_Loki_Made.jpg",credit:"Иллюстрация к The Gordon Readers, 1910",alt:"Локи приносит волшебные золотые волосы для Сив"},
 {title:"Локи и подземные мастера",src:U+"f/f4/Loki_and_Dvalin.jpg",file:"Loki_and_Dvalin.jpg",credit:"Локи с гномом Двалином, старинная книжная иллюстрация",alt:"Локи и гном Двалин рассматривают пряди из золотых нитей"},
 {title:"Муха в кузнице",src:"images/thor-book-04.webp",original:U+"f/f3/Once_again_the_buzzing_fly_came_in_at_the_window_%281901%29_by_Arthur_Rackham.jpg",file:"Once_again_the_buzzing_fly_came_in_at_the_window_(1901)_by_Arthur_Rackham.jpg",credit:"Артур Рэкхем, 1901",alt:"Брокк раздувает кузнечные мехи, пока Локи в виде мухи пытается ему помешать"},
 {title:"Последний дар кузнецов",src:"images/thor-book-05.webp",original:U+"4/4c/The_third_gift_%E2%80%94_an_enormous_hammer_by_Elmer_Boyd_Smith.jpg",file:"The_third_gift_—_an_enormous_hammer_by_Elmer_Boyd_Smith.jpg",credit:"Элмер Бойд Смит, 1902",alt:"Подземные кузнецы выковывают могучий молот Мьёльнир"},
 {title:"Молот для Тора",src:"images/thor-book-06.webp",original:U+"5/50/Journeys_through_Bookland_-_a_new_and_original_plan_for_reading_applied_to_the_world%27s_best_literature_for_children_%281922%29_%2814596644918%29.jpg",file:"Journeys_through_Bookland_-_a_new_and_original_plan_for_reading_applied_to_the_world's_best_literature_for_children_(1922)_(14596644918).jpg",credit:"Донн П. Крейн, 1922",alt:"Брокк показывает богам сокровища, в том числе молот для Тора"}
];
const spreads=[
 {picture:0,title:"Проделка Локи",text:"Однажды хитрый Локи отрезал золотые волосы Сив, жены Тора. Тор страшно рассердился и велел ему всё исправить."},
 {picture:1,title:"Золотые волосы",text:"Локи отправился к подземным мастерам. Они сделали новые волосы из тончайших золотых нитей. Ещё они создали чудесный корабль и волшебное копьё."},
 {picture:2,title:"Спор с кузнецами",text:"Локи решил похвастаться сокровищами. Он поспорил с гномом Брокком: смогут ли Брокк и его брат Синдри сделать подарки ещё удивительнее?"},
 {picture:3,title:"Муха в кузнице",text:"Синдри работал у огня, а Брокк раздувал мехи. Локи превратился в муху и стал кусать Брокка. Из-за мухи кузнец на миг остановился."},
 {picture:4,title:"Молот с короткой ручкой",text:"Братья выковали сияющего вепря, волшебное кольцо и молот Мьёльнир. Из-за проделки Локи рукоять молота вышла короткой. Но его сила была огромной!"},
 {picture:5,title:"Дар для Тора",text:"Брокк принёс сокровища богам. Самым ценным подарком они признали молот Тора. Мьёльнир возвращался в руку хозяина и защищал Асгард от великанов."}
];
const ids=id=>document.getElementById(id);
const reader=ids("reader"),body=ids("elderBody"),head=ids("readerTitle"),count=ids("elderCounter"),previous=ids("elderPrev"),next=ids("elderNext"),trigger=ids("elderSceneBook");
const reward="tivvig_reward_gnome_elder_story_v1";
let pos=0,opened=false,finished=false;
function award(){
 if(finished)return;finished=true;
 try{localStorage.setItem(reward,"unlocked")}catch(e){}
 const give=()=>{try{if(window.TivvigRegistry?.byReward?.[reward])window.TivvigRegistry.unlockReward(reward)}catch(e){console.warn("Elder reward",e)}};
 if(window.TivvigRegistry?.byReward?.[reward])give();
 else window.addEventListener("tivvig:registry-ready",give,{once:true});
}
function render(){
 const p=spreads[pos],a=pictures[p.picture];
 body.replaceChildren();head.textContent=p.title;
 count.textContent=(pos+1)+" / "+spreads.length;
 count.setAttribute("aria-label","Разворот "+(pos+1)+" из "+spreads.length);
 previous.disabled=pos===0;next.disabled=pos===spreads.length-1;
 next.textContent=pos===spreads.length-1?"Конец легенды":"Дальше →";
 const book=document.createElement("div");book.className="open-pages";
 const left=document.createElement("section");left.className="book-left-page";left.setAttribute("aria-label","Левая страница — иллюстрация");
 const fig=document.createElement("figure");fig.className="illustration";
 const im=document.createElement("img");im.src=a.src;im.alt=a.alt;im.draggable=false;im.referrerPolicy="no-referrer";im.loading="eager";
 const caption=document.createElement("figcaption"),attribution=document.createElement("a");
 attribution.href=W+encodeURIComponent(a.file);attribution.target="_blank";attribution.rel="noopener noreferrer";
 attribution.textContent=a.credit;caption.append(attribution);
 im.addEventListener("error",()=>{
  if(a.original&&!im.dataset.fallback){im.dataset.fallback="1";im.src=a.original;return;}
  im.hidden=true;
  const note=document.createElement("p");note.className="image-error";note.textContent="Не удалось загрузить историческую иллюстрацию. Оригинал — по ссылке ниже.";
  fig.prepend(note);
 });
 fig.append(im,caption);left.append(fig);
 const right=document.createElement("article");right.className="book-right-page";right.setAttribute("aria-label","Правая страница — история");
 const ornament=document.createElement("div");ornament.className="page-ornament";ornament.setAttribute("aria-hidden","true");ornament.textContent="✦";
 const title=document.createElement("h2");title.textContent=p.title;
 const text=document.createElement("p");text.textContent=p.text;
 const number=document.createElement("small");number.className="book-page-number";number.textContent="Разворот "+(pos+1)+" из "+spreads.length;
 right.append(ornament,title,text,number);
 book.append(left,right);body.append(book);
 if(pos===spreads.length-1)award();
}
function open(){
 if(opened)return;
 opened=true;pos=0;reader.hidden=false;document.body.style.overflow="hidden";trigger.setAttribute("aria-expanded","true");
 render();ids("elderClose").focus({preventScroll:true});
}
function close(){
 if(!opened)return;
 opened=false;reader.hidden=true;document.body.style.overflow="";trigger.setAttribute("aria-expanded","false");trigger.focus({preventScroll:true});
}
function move(delta){
 if(!opened)return;
 const nextPos=Math.max(0,Math.min(spreads.length-1,pos+delta));
 if(pos===nextPos)return;
 pos=nextPos;render();
}
trigger.addEventListener("click",open);
ids("elderClose").addEventListener("click",close);
previous.addEventListener("click",()=>move(-1));
next.addEventListener("click",()=>move(1));
document.addEventListener("keydown",event=>{
 if(!opened)return;
 if(event.key==="Escape"){event.preventDefault();close()}
 else if(event.key==="ArrowRight"){event.preventDefault();move(1)}
 else if(event.key==="ArrowLeft"){event.preventDefault();move(-1)}
});
render();
window.TivvigElderDebug=Object.freeze({state:()=>({opened,position:pos,total:spreads.length,finished}),open,close,next:()=>move(1),previous:()=>move(-1),images:pictures.map(p=>p.src)});
})();
</script>
<script src="game-runtime.js?v=1" defer></script>
