"use strict";
const P=[{x:7,y:83},{x:15,y:79},{x:23,y:76},{x:31,y:72},{x:38,y:69},{x:45,y:65},{x:52,y:62},{x:59,y:59},{x:66,y:55},{x:73,y:52},{x:79,y:48},{x:85,y:44},{x:90,y:41},{x:94,y:37}];
const el=id=>document.getElementById(id),arena=el("arena"),enemy=el("enemy"),lada=el("lada"),choices=el("choices");
const reduced=typeof matchMedia==="function"&&matchMedia("(prefers-reduced-motion: reduce)").matches;
const pause=ms=>new Promise(resolve=>setTimeout(resolve,reduced?Math.min(ms,80):ms));
const LAST=P.length-1,START=3,REWARD="tivvig_reward_charon_angler_friend_v1";
let pL=START,pV=0,busy=false,over=false,turn=0,answer=0,lastSignature="",transformed=false,serial=0;
const stoneHost=el("stones");
P.forEach((p,i)=>{const s=document.createElement("i");s.className="stone"+(i===LAST?" goal":"");s.style.left=p.x+"%";s.style.top=p.y+"%";stoneHost.appendChild(s)});
for(let j=0;j<19;j++){const i=document.createElement("i");i.className="spark";i.style.setProperty("--x",((j*31+7)%92)+"%");i.style.setProperty("--y",((j*17+18)%75)+"%");i.style.setProperty("--t",(2+j%5*.65)+"s");i.style.animationDelay=(-j*.38)+"s";arena.appendChild(i)}
function at(node,n){const p=P[Math.max(0,Math.min(LAST,n))];node.style.left=p.x+"%";node.style.top=p.y+"%"}
function equip(){window.TivvigWardrobe?.equip(el("chaseLada"))}
function sync(){at(lada,pL);at(enemy,pV);const rest=Math.max(0,LAST-pL);el("hud").textContent=("✦ ".repeat(rest)).trim()||"✦";el("hud").setAttribute("aria-label","Осталось "+rest+" шагов");equip()}
const coopSeed=new URLSearchParams(location.search).get("seed")||"tivvig-styx-chase-2026";
let rngState=2166136261;
function seed(){rngState=2166136261;for(const ch of coopSeed)rngState=Math.imul(rngState^ch.charCodeAt(0),16777619)>>>0}
function rnd(){rngState^=rngState<<13;rngState^=rngState>>>17;rngState^=rngState<<5;return (rngState>>>0)/4294967296}
function rand(n){return Math.floor(rnd()*n)}
function makeTask(){
 let a,b,op,value,sig;
 for(let i=0;i<12;i++){if(rnd()<.5){a=rand(10);b=rand(11-a);op="+";value=a+b}else{a=rand(11);b=rand(a+1);op="−";value=a-b}sig=a+op+b;if(sig!==lastSignature)break}
 lastSignature=sig;answer=value;el("equation").textContent=a+" "+op+" "+b+" = ?";
 const opts=new Set([value]);const pool=[value+1,value-1,value+2,value-2,value+3,value-3,rand(11),rand(11)].filter(n=>n>=0&&n<=10&&n!==value);
 while(opts.size<3&&pool.length)opts.add(pool.splice(rand(pool.length),1)[0]);
 while(opts.size<3)opts.add(rand(11));
 const arr=[...opts];for(let i=arr.length-1;i>0;i--){const j=rand(i+1);[arr[i],arr[j]]=[arr[j],arr[i]]}
 choices.replaceChildren();for(const n of arr){const b=document.createElement("button");b.className="answer";b.id="angler-answer-"+n;b.type="button";b.textContent=n;b.dataset.value=String(n);b.setAttribute("aria-label","Ответ "+n);choices.appendChild(b)}
}
function flash(n,char="✧"){const p=P[Math.min(LAST,n)],f=document.createElement("span");f.className="magic";f.textContent=char;f.style.left=p.x+"%";f.style.top=(p.y-11)+"%";arena.appendChild(f);setTimeout(()=>f.remove(),950)}
async function transform(me){
 transformed=true;flash(pL,"✦");flash(pV,"✧");await pause(240);if(me!==serial)return;
 lada.classList.add("changed");enemy.classList.add("mid");el("status").textContent="Лада превратилась!";await pause(550)
}
function show(which){el(which).hidden=false;const b=el(which).querySelector("button");if(b)b.focus({preventScroll:true})}
function hide(){el("lose").hidden=true;el("win").hidden=true}
function winGame(){
 over=true;el("status").textContent="Удильщик стал другом!";flash(LAST,"✦");
 try{window.TivvigRegistry?.unlockReward(REWARD)}catch{}
 try{localStorage.setItem(REWARD,"unlocked")}catch{}
 show("win")
}
async function play(n,button){
 if(busy||over)return;
 busy=true;const token=serial,correct=n===answer;
 button.classList.add(correct?"right":"wrong");
 [...choices.children].forEach(b=>b.disabled=true);
 el("status").textContent=correct?"Верно!":"Удильщик приближается!";
 await pause(230);if(token!==serial)return;
 pL=Math.min(LAST,pL+1);pV=Math.min(LAST,pV+(correct?1:2));sync();
 await pause(800);if(token!==serial)return;
 if(pV>=pL){over=true;show("lose");return}
 if(!transformed&&pL>=START+5){await transform(token);if(token!==serial)return}
 if(pL>=LAST){winGame();return}
 turn++;makeTask();busy=false;el("status").textContent="Уплывай от удильщика!"
}
function reset(){
 ++serial;pL=START;pV=0;turn=0;busy=false;over=false;transformed=false;lastSignature="";
 seed();lada.classList.remove("changed");enemy.classList.remove("mid");hide();sync();makeTask();el("status").textContent="Уплывай от удильщика!"
}
choices.addEventListener("click",e=>{const b=e.target.closest("button[data-value]");if(b)play(Number(b.dataset.value),b)});
el("reset").addEventListener("click",reset);
el("retry").addEventListener("click",reset);
el("again").addEventListener("click",reset);
window.addEventListener("tivvig-outfit-changed",equip);
window.addEventListener("tivvig-inventory-changed",equip);
window.addEventListener("pageshow",equip);
document.addEventListener("DOMContentLoaded",equip);
window.TivvigAnglerDebug=Object.freeze({state:()=>({boat:pL,fish:pV,step:turn,answer,transformed,busy,over}),reset,answer:n=>{const b=choices.querySelector('[data-value="'+n+'"]');if(b)b.click()},skipToMiddle:()=>{pL=START+5;pV=5;transformed=true;lada.classList.add("changed");enemy.classList.add("mid");sync()},win:winGame});
reset();
})();
</script>
<script src="hades-sounds.js?v=1" defer></script>
<script src="game-runtime.js?v=5" defer></script>
</body></html>
