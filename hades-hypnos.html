<meta name="description" content="Лада придумывает сказку для Гипноса. Волшебные предметы помогают рассказывать историю в любом порядке.">
<title>Сад снов Гипноса — Тиввиг</title>
<style>
:root{color-scheme:dark;--cream:#f8efff;--gold:#ead8a2}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#09132e}
body{font:16px Georgia,'Times New Roman',serif;color:var(--cream);background:radial-gradient(ellipse at 45% 20%,#233b6b,#0a1635 65%,#061126)}
a,button{font:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{cursor:pointer}a{text-decoration:none;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid #ffecb2;outline-offset:4px}
main{max-width:1400px;margin:auto;min-height:100dvh;padding:8px 10px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
header{width:100%;max-width:1280px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:43px}
header h1{margin:0;font-weight:normal;font-size:clamp(17px,2.2vw,29px);letter-spacing:.025em;color:#e5e9fe;text-shadow:0 2px 12px #03051c}
.nav{min-height:39px;min-width:45px;display:grid;place-items:center;padding:6px 12px;border:1px solid #6d86ab8a;background:#132b56b5;border-radius:12px;color:#e7eafa;font-size:15px}
.board{width:100%;max-width:1280px;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;border-radius:18px;border:3px solid #496992;box-shadow:0 15px 45px #0009;background:#091d44}
.scene{position:relative;isolation:isolate;aspect-ratio:16/9;min-width:730px;width:100%;overflow:hidden;touch-action:manipulation}
.sky{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.hypnos{position:absolute;z-index:2;right:-1%;top:-5%;width:60%;height:102%;object-fit:cover;object-position:44% 38%;opacity:.9;pointer-events:none;user-select:none;filter:saturate(.87) contrast(1.07) drop-shadow(0 0 28px #7797e72b);mask-image:radial-gradient(ellipse 78% 84% at 61% 43%,#000 38%,#000d 58%,transparent 100%);-webkit-mask-image:radial-gradient(ellipse 78% 84% at 61% 43%,#000 38%,#000d 58%,transparent 100%);transition:filter 1.4s,opacity 1.4s}
.scene[data-glow="2"] .hypnos{filter:saturate(.95) contrast(1.09) drop-shadow(0 0 34px #98b7f75e)}
.scene[data-glow="3"] .hypnos{filter:saturate(1.05) contrast(1.09) drop-shadow(0 0 54px #a9d3ff8a);opacity:.98}
.hypnos-haze{position:absolute;right:4%;top:5%;width:59%;height:85%;z-index:1;border-radius:50%;pointer-events:none;background:radial-gradient(ellipse,#6686d91f,transparent 68%);mix-blend-mode:screen;animation:breathe 8s ease-in-out infinite alternate}
@keyframes breathe{to{opacity:.58;transform:scale(1.09)}}
.scene::after{content:"";position:absolute;z-index:7;inset:0;pointer-events:none;box-shadow:inset 0 0 70px #030b22a0}
.scene-title{position:absolute;z-index:8;left:3%;top:4.5%;max-width:28%;padding:9px 13px 10px;border:1px solid #abb5dc65;border-radius:18px 18px 18px 4px;background:#172c559e;backdrop-filter:blur(3px);color:#f6efff;font-size:clamp(17px,2.3vw,29px);line-height:1.18;text-shadow:0 2px 5px #030b23}
.scene-title small{display:block;margin-top:5px;font:500 clamp(11px,1.2vw,15px)/1.3 system-ui,sans-serif;color:#d1d5e7;letter-spacing:.01em}
.item{position:absolute;z-index:9;width:clamp(62px,8.5%,119px);aspect-ratio:1;border:0;border-radius:50%;padding:5px;background:radial-gradient(circle,#d5e9fa13 13%,#b2d4f610 50%,transparent 76%);filter:drop-shadow(0 9px 8px #030d239c);transition:transform .28s ease,filter .28s ease,background .35s;transform:translate(-50%,-50%);-webkit-tap-highlight-color:transparent;user-select:none}
.item svg{width:100%;height:100%;overflow:visible;pointer-events:none;filter:drop-shadow(0 1px 5px #0008)}
.item:hover{filter:drop-shadow(0 0 13px #b4cafaab);transform:translate(-50%,-54%) scale(1.07)}
.item.chosen{background:radial-gradient(circle,#fff1ac70 2%,#afdffe43 42%,transparent 80%);filter:drop-shadow(0 0 16px #c7effb) drop-shadow(0 5px 8px #080b2b);transform:translate(-50%,-57%) scale(1.09)}
.item.chosen::after{content:"✦";position:absolute;right:-5%;top:-7%;font-size:clamp(19px,2.5vw,30px);color:#fff6c3;text-shadow:0 0 12px #ffe3a4;animation:starwink 2.5s ease-in-out infinite alternate}
@keyframes starwink{to{opacity:.43;transform:scale(.75) rotate(27deg)}}
.item.mirror{left:10%;top:32%}.item.comb{left:29%;top:25%}.item.crown{left:45%;top:31%}.item.book{left:9%;top:56%}.item.key{left:32%;top:50%}.item.flower{left:57%;top:69%}.item.pillow{left:78%;top:78%}.item.lantern{left:52%;top:10%}
/* Keep each original recurring hero as a separate art asset; costumes use the shared wardrobe. */
.party{position:absolute;z-index:6;left:7%;bottom:4%;width:45%;height:31%;display:flex;justify-content:center;align-items:end;gap:0;pointer-events:auto}
.hero{position:relative;flex:0 0 16%;height:82%;border:0;padding:0;background:none;cursor:pointer;filter:drop-shadow(0 5px 5px #000b);transition:transform .32s,filter .32s}
.hero img{width:100%;height:100%;object-fit:contain;object-position:bottom center;pointer-events:none;user-select:none}
.hero:hover,.hero.chosen{transform:translateY(-9px);filter:drop-shadow(0 0 11px #bce4ffbd) drop-shadow(0 5px 3px #0008)}
.hero.lada{flex-basis:19%;height:112%;z-index:2}
.hero.lada img{position:absolute;inset:0}
.hero.lada [data-outfit-layer][hidden]{display:none!important}
.hero.cat{z-index:3}.hero.rabbit{z-index:3;height:70%}.hero.monkey{z-index:2;height:82%}.hero.merchant{z-index:3;height:81%}.hero.bookseller{z-index:2;height:88%}
.particles{position:absolute;inset:0;z-index:11;pointer-events:none;overflow:hidden}
.spark{position:absolute;left:0;top:0;color:#fff3b7;font-family:Georgia,serif;text-shadow:0 0 10px #cde9ff,0 0 17px #86c6ff;animation:drift .9s ease-out forwards;pointer-events:none}
@keyframes drift{from{transform:translate(-50%,-50%) scale(.3);opacity:0}25%{opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.3);opacity:0}}
.dust{position:absolute;z-index:1;width:3px;height:3px;border-radius:50%;background:#d5f4fc;box-shadow:0 0 8px #d9e6fa;opacity:.5;pointer-events:none;animation:twinkle var(--duration) ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.09;transform:scale(.5)}}
.reset{position:absolute;z-index:12;right:2%;bottom:2%;width:43px;height:43px;border:1px solid #8fa9c77a;border-radius:50%;background:#203f639e;color:#fff4cf;font-size:25px;opacity:.76;display:grid;place-items:center}
.reset:hover{opacity:1}

.story-finish{position:absolute;z-index:12;left:50%;bottom:2%;transform:translateX(-50%);min-height:45px;max-width:33%;padding:8px 15px;border:1px solid #c7dfef9c;border-radius:20px;background:linear-gradient(120deg,#496da5d9,#263d82df);color:#fff5df;text-shadow:0 2px 6px #17234b;box-shadow:0 5px 16px #0008;font:600 clamp(14px,1.5vw,20px)/1.1 Georgia,serif;white-space:nowrap}
.story-finish:hover{background:linear-gradient(120deg,#628fbbeb,#324e92ec)}
.reward-overlay{position:fixed;inset:0;z-index:100;display:flex;justify-content:center;align-items:center;padding:10px;background:#071226ee;backdrop-filter:blur(7px)}
.reward-card{display:flex;flex-direction:column;align-items:center;gap:8px;max-height:98dvh;max-width:min(550px,96vw);padding:10px;border:2px solid #a9c9ec;border-radius:17px;background:#142d58;box-shadow:0 20px 50px #000d;text-align:center}
.reward-card h2{margin:0;color:#fff3dc;font:normal clamp(18px,2.5vw,27px)/1.12 Georgia,serif}
.reward-card img{display:block;max-width:100%;width:auto;max-height:min(78dvh,790px);object-fit:contain;border-radius:9px;box-shadow:0 8px 22px #0007}
.reward-actions{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}
.reward-actions button,.reward-actions a{display:inline-grid;place-items:center;min-height:44px;padding:8px 13px;border:1px solid #d4c7a4;border-radius:10px;background:#e6d6ae;color:#332747;font:600 16px Georgia,serif;text-decoration:none}
[hidden]{display:none!important}
@media(max-width:760px){.story-finish{padding:7px 11px}.reward-card img{max-height:72dvh}}
@media(max-width:840px){main{padding:5px}.scene-title{max-width:32%}.party{left:5%;width:48%}.item{width:8.5%;min-width:62px}.board{border-width:2px}.nav{padding:4px 8px}.scene{min-width:730px}}
@media(prefers-reduced-motion:reduce){.hypnos-haze,.dust,.item.chosen::after{animation:none}.item,.hero,.hypnos{transition:none!important}.spark{animation-duration:.1s}}
</style>
</head>

<script>
(()=>{
 'use strict';
 const scene=document.getElementById('hypnosScene'),particles=document.getElementById('dreamParticles');
 const actors=[...scene.querySelectorAll('button[data-dream-item],button.hero')];
 const selected=new Set();
 const REWARD='tivvig_reward_hypnos_story_v1';
 const reward=document.getElementById('hypnosReward');
 function dress(){window.TivvigWardrobe?.equip(document.getElementById('hypnos-friend-lada'))}
 function update(){
   // Glows are optional visual feedback. The story has no order, score, or finish gate.
   scene.dataset.glow=String(selected.size>=5?3:selected.size>=2?2:1);
   for(const b of actors){const active=selected.has(b.id);b.classList.toggle('chosen',active);b.setAttribute('aria-pressed',String(active));}
 }
 let count=0;
 function sparkle(b){
   const parent=scene.getBoundingClientRect(),rect=b.getBoundingClientRect();
   const x=((rect.left+rect.width/2-parent.left)/parent.width)*100,y=((rect.top+rect.height/2-parent.top)/parent.height)*100;
   for(let i=0;i<4;i++){
     const f=document.createElement('span');f.className='spark';f.textContent=i%2?'✧':'✦';
     f.style.left=x+'%';f.style.top=y+'%';f.style.fontSize=(14+i*3)+'px';
     f.style.setProperty('--dx',(-31+i*18)+'px');f.style.setProperty('--dy',(-16-(i%2)*36)+'px');
     f.addEventListener('animationend',()=>f.remove(),{once:true});particles.appendChild(f);
     if(++count>96){particles.firstElementChild?.remove();count=0}
   }
 }
 scene.addEventListener('click',e=>{
   const b=e.target.closest('button[data-dream-item],button.hero');
   if(!b)return;
   if(selected.has(b.id))selected.delete(b.id);else{selected.add(b.id);sparkle(b)}
   update();
 });
 function clearDream(){selected.clear();particles.replaceChildren();update()}
 function showReward(){
   try{
     if(window.TivvigRegistry?.byReward?.[REWARD]){
       window.TivvigRegistry.unlockReward(REWARD);
     }else{
       localStorage.setItem(REWARD,'unlocked');
       window.dispatchEvent(new CustomEvent('tivvig:reward-unlocked',{detail:{key:REWARD}}));
       window.dispatchEvent(new Event('tivvig-inventory-changed'));
     }
   }catch(e){console.warn('Reward persistence unavailable',e)}
   reward.hidden=false;
   document.getElementById('hypnosClose').focus({preventScroll:true});
 }
 function closeReward(){reward.hidden=true;document.getElementById('hypnosFinish').focus({preventScroll:true})}
 document.getElementById('hypnosFinish').addEventListener('click',showReward);
 document.getElementById('hypnosClose').addEventListener('click',closeReward);
 document.getElementById('hypnosAgain').addEventListener('click',()=>{closeReward();clearDream()});
 document.getElementById('hypnosReset').addEventListener('click',clearDream);
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!reward.hidden)closeReward()});
 window.addEventListener('tivvig-outfit-changed',dress);
 window.addEventListener('tivvig-inventory-changed',dress);
 window.addEventListener('pageshow',dress);
 for(let i=0;i<23;i++){
    const s=document.createElement('i');s.className='dust';s.style.left=((i*43+13)%97)+'%';s.style.top=((i*29+11)%83)+'%';s.style.setProperty('--duration',(2.5+(i%5)*.8)+'s');s.style.animationDelay=(-i*.35)+'s';scene.appendChild(s)
 }
 window.TivvigHypnosDebug=Object.freeze({selected:()=>[...selected],reset:()=>{document.getElementById('hypnosReset').click()},finish:showReward,close:closeReward,itemCount:actors.length});
 update();dress();
})();
</script>
<script src="hades-sounds.js?v=1" defer></script>
<script src="game-runtime.js?v=5" defer></script>
</body>
</html>
