<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101a2a">
<meta name="description" content="Пять испытаний во дворце Аида: печати, звуки, мост из слов, часы и песня для Персефоны.">
<title>Дворец Аида — освобождение Персефоны · Тиввиг</title>
<style>
:root{--silver:#deedf1;--glow:#71d7e7;--gold:#e5bb79;--ink:#101526}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:#0b101d}
body{font:16px Georgia,"Times New Roman",serif;color:#eef1ec;background:radial-gradient(ellipse at 50% 1%,#253951,#080f1c 72%)}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation;font:inherit}
button{cursor:pointer;color:inherit}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible{outline:3px solid #d8eaf3;outline-offset:3px}
main{width:min(1430px,100%);margin:auto;min-height:100dvh;padding:7px clamp(5px,1.4vw,16px) 12px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:7px}
header{width:min(100%,1280px);display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:41px}
header h1{margin:0;font-size:clamp(18px,2.5vw,28px);font-weight:normal;letter-spacing:.05em;text-shadow:0 2px 7px #000}
.back{font-size:clamp(13px,1.4vw,16px);color:#edf3ef;border:1px solid #b6b6bb80;background:#34405898;padding:9px 12px;border-radius:10px;min-height:40px;display:inline-grid;place-items:center}
.scene{position:relative;width:min(100%,1280px,calc((100dvh - 90px)*1.777));aspect-ratio:16/9;isolation:isolate;overflow:hidden;border:3px solid #71839a;border-radius:13px;background:#0e1b2b;box-shadow:0 5px 0 #253346,0 14px 35px #0009;touch-action:manipulation;--mist:#87c8cf}
.scene:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(0deg,#06111bd6,transparent 38%,#06122235 90%),radial-gradient(ellipse at center,#0000 43%,#0006 100%)}
.scene:after{content:"";position:absolute;inset:0;z-index:18;pointer-events:none;box-shadow:inset 0 0 46px #0007}
.backdrop{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;transition:opacity .25s,filter .3s}
.scene[data-stage="0"] .backdrop{object-position:center 26%}
.scene[data-stage="1"] .backdrop{object-position:center 58%}
.scene[data-stage="2"] .backdrop{object-position:center 58%}
.scene[data-stage="3"] .backdrop{object-position:center 50%}
.scene[data-stage="4"] .backdrop{object-position:center 58%}
.scene[data-stage="5"] .backdrop{object-position:center 35%}
.scene[data-stage="3"]:before,.scene[data-stage="4"]:before{background:linear-gradient(0deg,#1a090bd9,transparent 49%,#050e2385)}
.mist{position:absolute;inset:auto -10% 0;width:120%;height:30%;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,var(--mist) 0%,transparent 68%);filter:blur(22px);opacity:.11;animation:mist 12s ease-in-out infinite alternate}
@keyframes mist{to{transform:translateX(5%);opacity:.17}}
.ambience{position:absolute;inset:0;z-index:2;pointer-events:none}
.ambience i{position:absolute;width:3px;height:3px;background:#ecffffd9;border-radius:50%;box-shadow:0 0 10px #adfffa;animation:twinkle 3s infinite alternate}
@keyframes twinkle{to{opacity:.2;transform:scale(.5)}}
.chapter{position:absolute;top:3.8%;left:2.8%;z-index:14;max-width:29%;font-size:clamp(13px,1.6vw,21px);text-shadow:0 3px 6px #000c;color:#f6e2c3}
.chapter small{display:block;color:#bed3dc;font:600 clamp(9px,.85vw,12px) system-ui,sans-serif;letter-spacing:.16em;margin-bottom:4px}
.progress{position:absolute;right:2.5%;top:3.5%;z-index:14;display:flex;gap:clamp(6px,.6vw,10px)}
.progress i{display:block;width:clamp(9px,1.18vw,15px);height:clamp(9px,1.18vw,15px);border-radius:50%;background:#9cacc65e;border:1px solid #e4d4b085;box-shadow:0 2px 8px #0009}
.progress i.done{background:#f1c98a;box-shadow:0 0 10px #ffeeb0}
.progress i.now{background:#96eefa;box-shadow:0 0 14px #7debfc}
.party{position:absolute;left:3%;bottom:2.2%;height:30%;width:44%;display:flex;align-items:flex-end;justify-content:center;z-index:13;filter:drop-shadow(2px 8px 5px #000e);pointer-events:none;transition:transform .5s ease,opacity .5s}
.party.is-travelling{transform:translateX(25%) scale(.93);opacity:.2}
.actor{position:relative;flex:0 0 15%;height:79%;min-width:0}
.actor img{width:100%;height:100%;object-fit:contain;object-position:bottom center;user-select:none;pointer-events:none}
.actor.lada{height:100%;flex-basis:21%;z-index:4}
.actor.lada img{position:absolute;inset:0}
.actor.cat{height:78%;z-index:3}
.actor.rabbit{height:69%;z-index:4}
.actor.monkey{height:77%;z-index:3}
.actor.green{height:73%;z-index:3}
.actor.purple{height:82%;z-index:4}
.actor.lada [hidden]{display:none!important}
.scene[data-stage="4"] .party{left:1%;bottom:1%;width:33%}
.hades{position:absolute;z-index:4;right:6%;bottom:11%;height:58%;width:27%;pointer-events:none;filter:drop-shadow(0 0 13px #00a0d982) drop-shadow(0 10px 10px #020916)}
.hades svg{width:100%;height:100%}
.hades .fire{transform-origin:50% 12%;animation:firePulse 2.1s ease-in-out infinite alternate}
@keyframes firePulse{to{filter:brightness(1.7);transform:scaleY(1.07)}}
.hades .hades-smile{transform-origin:center;transition:opacity .5s}
.scene[data-stage="1"] .hades,.scene[data-stage="2"] .hades,.scene[data-stage="3"] .hades{display:none}
.scene[data-stage="4"] .hades{right:21%;height:50%;bottom:13%;opacity:.9}
.scene.is-free .hades{filter:grayscale(.5) drop-shadow(0 7px 6px #060e16)}
.persephone{position:absolute;right:1.6%;bottom:5%;width:19%;height:42%;z-index:5;pointer-events:none;object-fit:cover;object-position:50% 10%;mask-image:radial-gradient(ellipse at 52% 48%,#000 27%,#000c 48%,transparent 74%);-webkit-mask-image:radial-gradient(ellipse at 52% 48%,#000 27%,#000c 48%,transparent 74%);filter:drop-shadow(1px 4px 7px #050812) grayscale(.4)}
.scene[data-stage="0"] .persephone{right:1%;bottom:3.5%;width:15%;height:37%;opacity:.82}
.scene[data-stage="1"] .persephone,.scene[data-stage="2"] .persephone,.scene[data-stage="3"] .persephone{display:none}
.scene[data-stage="4"] .persephone{right:1%;bottom:9%;width:20%;height:43%;filter:brightness(.78) saturate(.75)}
.scene.is-free .persephone{filter:brightness(1.2) saturate(1.3);opacity:1;transition:filter 1s}
.chains{position:absolute;right:16%;top:59%;width:2px;height:21%;z-index:6;border-left:2px solid #9be7fdb5;transform:rotate(22deg);box-shadow:7px 1px 12px #39bde8,21px 3px 9px #39bde8;pointer-events:none;opacity:.75;transition:opacity 1.5s}
.scene[data-stage="1"] .chains,.scene[data-stage="2"] .chains,.scene[data-stage="3"] .chains{display:none}
.scene.is-free .chains{opacity:0}
.panel{position:absolute;z-index:12;inset:0;display:flex;justify-content:center;align-items:flex-start;pointer-events:none;padding-top:12%}
.panel>*{pointer-events:auto}
.control-area{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(7px,1.1vw,15px);max-width:58%;min-height:0}
.prompt{max-width:100%;color:#f3eee5;text-align:center;background:#0b1c29b9;border:1px solid #acbbc258;border-radius:24px;padding:7px 16px;font:500 clamp(13px,1.35vw,19px)/1.24 Georgia,serif;text-shadow:0 2px 5px #0009;box-shadow:0 2px 9px #0004}
.feedback{min-height:1.7em;max-width:90%;color:#f4deae;text-align:center;font:600 clamp(12px,1.3vw,17px)/1.15 Georgia,serif;text-shadow:0 2px 6px #000b}
.seal-area{width:min(100%,610px);max-width:53%;padding-top:11%;gap:12px}
.seals{display:flex;gap:clamp(12px,2.1vw,30px);justify-content:center;width:100%;align-items:center}
.seal{appearance:none;width:31%;min-height:0;aspect-ratio:1;background:transparent;border:0;border-radius:50%;padding:0;filter:drop-shadow(1px 7px 5px #000c);transition:transform .25s,filter .2s;position:relative}
.seal img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}
.seal:hover{transform:translateY(-5px) scale(1.04)}.seal.correct{filter:drop-shadow(0 0 22px #7af7fb);transform:scale(1.1)}.seal.incorrect{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.runes{display:flex;align-items:center;justify-content:center;gap:6px;min-height:22px}
.runes span{display:inline-grid;place-items:center;width:24px;height:23px;border-radius:6px;border:1px solid #cfb9988a;color:#a6cad7;background:#17233282;font:600 16px Georgia,serif}
.runes span.active{color:#f9e0ad;border-color:#ffe0a4;background:#655145a6}
.sound-area{max-width:44%;width:42%;padding-top:9.5%;gap:10px}
.music-slab{display:flex;flex-direction:column;align-items:center;gap:6px;padding:clamp(8px,1.1vw,16px);width:100%;background:#112132ba;border-radius:90px 90px 15px 15px;border:1px solid #7eacbf7d;box-shadow:0 8px 23px #0008,inset 0 0 14px #274b6f60}
.music-slab svg{width:clamp(55px,9vw,120px);height:clamp(56px,9vw,117px);filter:drop-shadow(0 0 12px #6ed4f8)}
.beats{display:flex;justify-content:center;gap:clamp(5px,.6vw,9px);min-height:28px}
.beats i{display:block;min-width:clamp(19px,2.4vw,34px);height:clamp(22px,2.5vw,33px);display:grid;place-items:center;border-radius:50%;border:1px solid #a4cbe4a1;background:#1c3a4bb8;color:#e7faff;font-style:normal;font:600 clamp(13px,1.5vw,20px) Georgia,serif}
.beats i.lit{background:#b2e9f7;color:#233342;box-shadow:0 0 15px #67daf8}
.beats i.done{background:#dbcb9f;color:#392a37}
.music-controls{display:flex;align-items:center;justify-content:center;gap:clamp(6px,.8vw,14px);width:100%}
.music-controls button,.tone{border:2px solid #7793b1;background:linear-gradient(#445b6b,#1c303e);box-shadow:0 3px 0 #111921,inset 0 0 9px #7fbddb36;border-radius:50%;color:#fcf0e0;font:bold clamp(15px,1.7vw,23px) Georgia,serif;min-width:clamp(54px,6vw,84px);min-height:clamp(54px,6vw,84px)}
.music-controls .listen{min-width:clamp(75px,7.5vw,105px);border-radius:20px;color:#2c2439;background:linear-gradient(#f5dfbd,#b69b75);border-color:#b5a179;font-size:clamp(14px,1.45vw,19px)}
.music-controls button:disabled{opacity:.34;cursor:default}
.music-controls .tone.pulse{background:#a4d7dc;color:#172d3d;box-shadow:0 0 18px #9cf4f0}
.sound-hint{position:absolute;z-index:16;bottom:3%;right:2%;padding:3px 6px;border-radius:9px;font-size:clamp(11px,1.1vw,14px);background:#0c2239a6}
.sound-hint button{border:0;background:none;color:#d4f9ff;min-height:34px;min-width:34px}
.word-area{padding-top:15%;width:58%;max-width:58%;gap:8px}
.word-bridge{display:flex;justify-content:center;gap:clamp(5px,1vw,14px);width:100%}
.word-step{flex:1;min-height:clamp(44px,5.8vw,77px);max-width:30%;background:linear-gradient(#132a36ce,#285b70b4);border:2px solid #86d7f67e;border-radius:49% 45% 22% 27%;box-shadow:0 5px 10px #000b,inset 0 0 15px #8cdaf84e;display:grid;place-items:center;font:bold clamp(12px,1.5vw,20px) Georgia,serif;color:#f5fbfa;text-align:center;transform:rotate(-3deg)}
.word-step.filled{background:linear-gradient(#bdd9e2,#48859c);color:#102735;border-color:#e4ffff;box-shadow:0 0 12px #89f6ff}
.word-options{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;width:100%;margin-top:10px}
.word-options button{min-height:clamp(49px,5.5vw,70px);border:2px solid #a0d9df8c;border-radius:40% 39% 28% 27%;color:#ecf8f3;background:linear-gradient(#1c3e53,#1a3043);font:bold clamp(13px,1.4vw,20px) Georgia,serif;text-shadow:0 2px 2px #0008;box-shadow:0 3px 6px #0008;padding:5px 2px}
.word-options button:disabled{opacity:.25}
.word-options button.wrong{animation:shake .3s;box-shadow:0 0 14px #ec7b77}
.bridge-track{position:absolute;z-index:4;left:20%;bottom:20%;width:61%;height:18%;pointer-events:none;display:flex;align-items:center;justify-content:space-between;gap:0}
.bridge-track i{display:block;flex:1;height:44%;border-radius:40%;border:2px solid #8ce4e989;background:#3261728a;box-shadow:inset 0 0 12px #adffff3c,0 5px 5px #0008;transform:rotate(-8deg);opacity:.3}
.bridge-track i.complete{opacity:.95;background:#9ecfd5;box-shadow:0 0 13px #94e7f8;transform:rotate(3deg)}
.clock-area{width:47%;max-width:47%;padding-top:7%}
.clock{position:relative;border:10px ridge #9c715a;aspect-ratio:1;width:clamp(155px,19vw,238px);border-radius:50%;background:radial-gradient(circle at 50% 44%,#2e2532aa,#151d2c 62%,#674b3c 72%,#281c28 86%);display:grid;place-items:center;box-shadow:0 0 22px #f3a46582,inset 0 0 29px #ef9b5b6b}
.clock:before,.clock:after{content:"";position:absolute;inset:12%;border:3px dashed #efa76286;border-radius:50%;transform:rotate(var(--gear,0deg));transition:transform .7s}
.clock:after{inset:27%;border-style:dotted;border-color:#f4d398b0;transform:rotate(calc(var(--gear,0deg) * -1))}
.clock-question{position:relative;z-index:2;white-space:nowrap;font:700 clamp(26px,3.6vw,44px) Georgia,serif;text-shadow:0 2px 7px #000a}
.clock-answer{display:flex;gap:clamp(7px,1.4vw,18px)}
.clock-answer button{min-width:clamp(59px,6.5vw,92px);min-height:clamp(47px,5.1vw,71px);border:2px solid #c69460;background:linear-gradient(#f1d1a0,#b68157);color:#342333;border-radius:9px;font:bold clamp(21px,2.4vw,33px) Georgia,serif;box-shadow:0 4px 0 #58362c}
.clock-answer button:disabled{opacity:.7}
.finale{position:absolute;inset:0;z-index:17;display:grid;place-items:center;background:radial-gradient(ellipse at center,#2a4359e6,#071522ec);text-align:center;padding:12px}
.finale div{display:flex;flex-direction:column;align-items:center;gap:15px}
.finale h2{font:normal clamp(28px,4vw,58px) Georgia,serif;color:#fff0ce;text-shadow:0 3px 15px #4ddde9;margin:0}
.finale a,.finale button{min-height:45px;padding:11px 18px;border-radius:12px;border:1px solid #e5c18a;background:#eadbb9;color:#3d2930;font:bold 17px Georgia,serif}
.message{position:absolute;z-index:14;left:50%;bottom:2%;transform:translateX(-50%);color:#d0e6ea;background:#071a2bc9;border-radius:20px;border:1px solid #718b9a70;padding:6px 14px;max-width:37%;min-width:17%;text-align:center;font:normal clamp(12px,1.25vw,17px) Georgia,serif;pointer-events:none;opacity:.9}
.scene[data-stage="1"] .message,.scene[data-stage="4"] .message{bottom:2%}
@media(max-width:760px){.scene{width:100%;aspect-ratio:4/3;min-height:410px}.scene .backdrop{object-position:center}.control-area{max-width:64%}.chapter{max-width:40%;font-size:15px}.party{width:46%;height:26%}.seal-area{max-width:61%;padding-top:23%}.seal{width:31%}.sound-area{width:56%;max-width:56%;padding-top:21%}.word-area{width:67%;max-width:67%;padding-top:27%}.clock-area{width:58%;max-width:58%;padding-top:17%}.clock{width:164px}.message{max-width:50%}.persephone{right:0;width:18%}.hades{right:2%;height:46%}}
@media(max-height:500px) and (min-width:800px){main{gap:3px}.scene{width:min(100%,calc((100dvh - 68px)*1.777))}.chapter{font-size:15px}.prompt{font-size:14px}}
@media(prefers-reduced-motion:reduce){.mist,.ambience i,.hades .fire{animation:none}.party{transition:none}}

/* Five-scene art direction: gameplay remains in the world, never beneath the crew. */
.party{left:1%;bottom:1.6%;width:32%;height:18.5%;z-index:7;justify-content:flex-start;animation:party-breathe 6s ease-in-out infinite alternate}
.actor{flex-basis:15.5%}.actor.lada{flex-basis:22%}
.panel{z-index:14;padding-top:4.2%}
.control-area{max-width:67%}
.seal-area{max-width:65%;padding-top:4%;gap:10px}
.sound-area{width:43%;max-width:43%;padding-top:4%;gap:7px}
.word-area{width:60%;max-width:60%;padding-top:7%;gap:7px}
.clock-area{width:47%;max-width:47%;padding-top:3%}
.music-slab{padding:7px 10px;gap:3px;border-radius:65px 65px 14px 14px}
.music-slab svg{height:clamp(51px,8vw,100px)}
.message{left:auto;right:2%;bottom:2%;transform:none;max-width:30%;min-width:0}
.hades{right:21%;bottom:11%;width:22%;height:62%;object-fit:contain;object-position:center bottom;clip-path:polygon(48% 0,60% 4%,67% 11%,64% 18%,66% 24%,77% 30%,86% 36%,96% 49%,100% 59%,100% 100%,0 100%,0 59%,8% 42%,18% 32%,31% 28%,39% 21%,41% 9%);filter:drop-shadow(0 0 10px #42c3ef9c);-webkit-mask-image:radial-gradient(ellipse 72% 75% at 50% 56%,#000 28%,#000 58%,transparent 91%);mask-image:radial-gradient(ellipse 72% 75% at 50% 56%,#000 28%,#000 58%,transparent 91%);animation:hades-ascend 4.8s ease-in-out infinite alternate}
.persephone{right:2%;bottom:8%;width:20%;height:45%;opacity:.95;object-fit:cover;object-position:53% 12%;-webkit-mask-image:radial-gradient(ellipse at 52% 47%,#000 31%,#000d 54%,transparent 81%);mask-image:radial-gradient(ellipse at 52% 47%,#000 31%,#000d 54%,transparent 81%)}
.scene[data-stage="0"] .persephone{right:2%;bottom:8%;width:20%;height:45%;opacity:.97}
.scene[data-stage="4"] .persephone{right:2%;bottom:8%;width:20%;height:45%}
.scene[data-stage="4"] .hades{right:14%;bottom:15%;width:15%;height:42%}
.underworld-motion{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.45;mix-blend-mode:screen;animation:light-swell 9s ease-in-out infinite alternate;background:radial-gradient(ellipse at 51% 60%,transparent 21%,#53d8ee0d 63%,transparent 79%)}
.underworld-motion:before{content:'';position:absolute;inset:4% -16%;background:radial-gradient(ellipse 25% 15% at 25% 50%,#4ac8f342,transparent),radial-gradient(ellipse 28% 17% at 75% 40%,#b9eafd29,transparent);filter:blur(26px);animation:deep-fog 13s ease-in-out infinite alternate}
.underworld-motion:after{content:'';position:absolute;inset:18% 0 0;background:repeating-radial-gradient(ellipse at 55% 102%,transparent 0 20px,#9cecf217 23px,transparent 27px);opacity:.4;animation:water-flow 12s linear infinite}
.scene[data-stage="2"] .underworld-motion:before{background:radial-gradient(ellipse at 14% 31%,#d8ffff37,transparent 28%),radial-gradient(ellipse at 82% 48%,#7ecfff29,transparent 26%);animation:ghost-drift 7s ease-in-out infinite alternate}
.scene[data-stage="3"] .underworld-motion,.scene[data-stage="4"] .underworld-motion{background:radial-gradient(ellipse at 73% 91%,#ff5e167b,transparent 58%);animation:lava-pulse 4s ease-in-out infinite alternate}
.scene[data-stage="3"] .underworld-motion:before,.scene[data-stage="4"] .underworld-motion:before{background:radial-gradient(ellipse 31% 18% at 20% 85%,#ff9b3655,transparent),radial-gradient(ellipse at 75% 55%,#e8553355,transparent);animation:deep-fog 6s ease-in-out infinite alternate}
@keyframes party-breathe{to{transform:translateY(-5px)}}
@keyframes hades-ascend{to{transform:translateY(-10px);filter:drop-shadow(0 0 17px #65e5ffb4)}}
@keyframes deep-fog{to{transform:translateX(14%) translateY(-4%);opacity:.72}}
@keyframes ghost-drift{to{transform:translate(-8%,-4%);filter:brightness(1.6)}}
@keyframes light-swell{to{opacity:.9}}
@keyframes water-flow{to{transform:translateY(24px)}}
@keyframes lava-pulse{to{opacity:.84;filter:brightness(1.7)}}
@media(max-width:760px){
 .party{left:1%;bottom:1%;width:36%;height:16%;z-index:7}
 .panel{padding-top:9%}
 .control-area{max-width:69%}
 .sound-area{width:55%;max-width:55%;padding-top:5%}
 .seal-area{max-width:69%;padding-top:12%}
 .word-area{width:69%;max-width:69%;padding-top:13%}
 .clock-area{width:61%;max-width:61%;padding-top:7%}
 .music-slab{padding:5px}
 .music-slab svg{height:56px}

 .persephone,.scene[data-stage="0"] .persephone{right:0;bottom:7%;width:20%;height:37%}

}
@media(prefers-reduced-motion:reduce){.party,.hades,.underworld-motion,.underworld-motion:before,.underworld-motion:after{animation:none}}

/* Definitive scene artwork, integrated control islands and five-stage finale. */
.scene[data-stage="0"] .hades,.scene[data-stage="0"] .persephone,
.scene[data-stage="4"] .hades,.scene[data-stage="4"] .persephone,
.scene[data-stage="0"] .chains,.scene[data-stage="4"] .chains{display:none}
.scene[data-stage="0"] .panel{padding-top:24%;z-index:14}
.scene[data-stage="0"] .seal-area{width:48%;max-width:48%;padding-top:0;gap:7px}
.scene[data-stage="0"] .seals{gap:clamp(5px,1vw,14px)}
.scene[data-stage="0"] .seal{width:28%;max-width:142px}
.scene[data-stage="0"] .chapter{max-width:24%}
.scene[data-stage="1"] .sound-area{width:35%;max-width:35%;padding-top:4%;gap:5px}
.scene[data-stage="1"] .music-slab{padding:6px 8px;gap:2px}
.scene[data-stage="1"] .music-slab svg{width:clamp(49px,6vw,79px);height:clamp(49px,6vw,79px)}
.scene[data-stage="1"] .beats i{min-width:clamp(18px,2vw,27px);height:clamp(19px,2vw,27px)}
.scene[data-stage="1"] .music-controls button{min-width:clamp(51px,5.4vw,72px);min-height:clamp(51px,5.4vw,72px)}
.scene[data-stage="1"] .music-controls .listen{min-width:clamp(65px,6.2vw,85px)}
/* The photographic fire-clock is a freestanding mechanism; only the inner gears rotate. */
.scene[data-stage="3"] .clock-area{max-width:43%;width:43%;padding-top:1%;gap:6px}
.scene[data-stage="3"] .clock{width:clamp(218px,27vw,337px);border:0;border-radius:50%;overflow:visible;background:transparent url("images/hades-fire-clock.webp") center / contain no-repeat;box-shadow:none;filter:drop-shadow(0 0 14px #f274349d)}
.scene[data-stage="3"] .clock::before{inset:26%;border:4px solid #e99e5d;box-shadow:inset 0 0 5px #fa8c31,0 0 9px #ff951b;border-radius:50%;background:repeating-conic-gradient(from 0deg,#cfa375 0deg 3deg,transparent 3deg 30deg);mask:radial-gradient(circle,transparent 0 84%,black 85%);-webkit-mask:radial-gradient(circle,transparent 0 84%,black 85%);transform:rotate(var(--gear,0deg));transition:transform .7s cubic-bezier(.2,.75,.25,1)}
.scene[data-stage="3"] .clock::after{inset:33%;border:3px double #e2b278;background:transparent;box-shadow:0 0 15px #f4a1438c;transform:rotate(calc(var(--gear,0deg) * -1));transition:transform .8s cubic-bezier(.2,.75,.25,1)}
.scene[data-stage="3"] .clock-question{font-size:clamp(24px,3vw,41px);padding:8px 10px;border-radius:45%;background:#200c16b9;box-shadow:0 0 20px #140c1aba;z-index:3}
.clock-fire{position:absolute;z-index:17;width:clamp(10px,2vw,23px);height:clamp(27px,5vw,57px);border-radius:70% 0 70% 70%;background:linear-gradient(90deg,#ff451b,#ffd265 50%,#fff5c2);box-shadow:0 0 18px #ff8c21;pointer-events:none;transform:translate(-50%,-50%) rotate(var(--r,0deg));animation:fire-erupt .8s cubic-bezier(.22,.7,.3,1) forwards}
@keyframes fire-erupt{0%{opacity:0;scale:.2}35%{opacity:1;scale:1}100%{opacity:0;scale:.5;translate:var(--dx,0px) var(--dy,-80px)}}
.word-spirit{position:absolute;z-index:16;width:clamp(33px,5vw,64px);height:clamp(50px,8vw,101px);pointer-events:none;filter:drop-shadow(0 0 11px #b3e5ff);animation:spirit-rise 1.35s ease-out forwards}
.word-spirit svg{width:100%;height:100%}
@keyframes spirit-rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.3)}20%{opacity:1}75%{opacity:.8}100%{opacity:0;transform:translate(calc(-50% + var(--drift,30px)),-220%) scale(1.2)}}
.cry-tear{position:absolute;z-index:11;width:7px;height:21px;border-radius:70% 20% 70% 70%;background:linear-gradient(#d9faff,#4bcaeb);box-shadow:0 0 8px #9fe4ff;pointer-events:none;opacity:0}
.scene.is-free .cry-tear{animation:weep 1.25s ease-in infinite;animation-delay:var(--delay,0s)}
@keyframes weep{0%{opacity:0;transform:translateY(0) scale(.4)}22%{opacity:1}95%{opacity:.6}100%{opacity:0;transform:translateY(90px) scale(.85)}}
.scene[data-stage="4"] .finale{align-items:end;background:linear-gradient(to top,#020b19d9 0%,#09203359 29%,transparent 68%);backdrop-filter:none}
.scene[data-stage="4"] .finale>div{gap:8px;padding-bottom:2%;filter:drop-shadow(0 4px 8px #000)}
.scene[data-stage="4"] .finale h2{font-size:clamp(24px,3vw,42px)}
.scene[data-stage="4"] .panel{padding-top:14%}
.scene[data-stage="4"] .sound-area{width:36%;max-width:36%}
.scene[data-stage="4"] .party{left:1%;width:30%;height:17%}
@media(max-width:760px){
 .scene[data-stage="0"] .panel{padding-top:23%}
 .scene[data-stage="0"] .seal-area{width:53%;max-width:53%}
 .scene[data-stage="0"] .seal{width:30%;max-width:none}
 .scene[data-stage="1"] .sound-area{width:51%;max-width:51%;padding-top:7%}
 .scene[data-stage="1"] .music-controls button{min-width:48px;min-height:48px}
 .scene[data-stage="3"] .clock-area{width:54%;max-width:54%;padding-top:10%}
 .scene[data-stage="3"] .clock{width:clamp(166px,24vw,240px)}
 .scene[data-stage="4"] .sound-area{width:52%;max-width:52%;padding-top:5%}
 .scene[data-stage="4"] .panel{padding-top:9%}
}
@media(prefers-reduced-motion:reduce){.clock-fire,.word-spirit,.scene.is-free .cry-tear{animation-duration:.1s}}

/* Final reward: original photographic Lada + existing Hecate costume.
   Do not synthesize her face, hair or head; keep the original PNG/WebP pixels. */
.scene[data-stage="4"] .finale.finale-reward{
 position:absolute;inset:0;z-index:19;display:block;overflow:hidden;
 background:#2a2e27;padding:0;isolation:isolate;text-align:left
}
.finale-reward .victory-landscape{
 position:absolute;inset:0;z-index:0;width:100%;height:100%;
 object-fit:cover;object-position:center;pointer-events:none;user-select:none
}
.finale-reward::after{
 content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
 background:linear-gradient(90deg,#10131d51 0%,transparent 34%),
 linear-gradient(0deg,#15192083,transparent 21%)
}
.scene[data-stage="4"] .finale.finale-reward .victory-lada{
 position:absolute;left:26%;bottom:1.7%;width:23.5%;height:auto;
 aspect-ratio:1056/1448;z-index:2;display:block;padding:0;
 filter:drop-shadow(4px 9px 6px #1715108a);pointer-events:none;
 animation:reward-lada-arrive 1s ease-out both
}
.finale-reward .victory-lada img{
 position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
 user-select:none;pointer-events:none
}
.finale-reward .victory-lada-original{z-index:0}
.finale-reward .victory-lada-outfit{
 z-index:1;
 /* Cut away the entire costume's artificial head/hair; the real photo stays. */
 -webkit-clip-path:polygon(0 28%,35% 28%,41% 29%,59% 29%,66% 28%,100% 28%,100% 100%,0 100%);
 clip-path:polygon(0 28%,35% 28%,41% 29%,59% 29%,66% 28%,100% 28%,100% 100%,0 100%)
}
.finale-reward .victory-lada-preserved-head{
 z-index:2;
 /* The original whole head, not an AI substitute. */
 -webkit-clip-path:ellipse(25% 15.5% at 49.5% 14.8%);
 clip-path:ellipse(25% 15.5% at 49.5% 14.8%)
}
.scene[data-stage="4"] .finale.finale-reward .victory-heading{
 position:absolute;z-index:3;top:4%;left:3%;margin:0;
 font:normal clamp(19px,3vw,37px)/1.1 Georgia,serif;color:#fff0cf;
 text-shadow:0 2px 8px #07111ae8,0 1px 18px #111c1dcc;
 max-width:48%
}
.scene[data-stage="4"] .finale.finale-reward .victory-actions{
 position:absolute;z-index:3;right:2.5%;bottom:3%;padding:0;
 display:flex;flex-direction:row;gap:9px;filter:none;align-items:center
}
.finale.finale-reward .victory-actions a,
.finale.finale-reward .victory-actions button{
 display:inline-grid;place-items:center;min-height:44px;padding:8px 12px;
 border-radius:11px;border:1px solid #e5d7bd;
 color:#2c3032;background:#f1e8d5e8;
 font:bold clamp(12px,1.4vw,15px) Georgia,serif;
 box-shadow:0 3px 10px #10151352;text-shadow:none;white-space:nowrap
}
@keyframes reward-lada-arrive{
 from{opacity:0;transform:translateX(-3%) translateY(3%)}
 to{opacity:1;transform:translateX(0) translateY(0)}
}
@media(max-width:760px){
 .scene[data-stage="4"] .finale.finale-reward .victory-lada{
  left:16%;bottom:4%;width:32%
 }
 .scene[data-stage="4"] .finale.finale-reward .victory-heading{
  left:4%;top:4%;max-width:68%;font-size:clamp(17px,4.8vw,27px)
 }
 .scene[data-stage="4"] .finale.finale-reward .victory-actions{
  bottom:2%;right:2%;gap:5px
 }
 .finale.finale-reward .victory-actions a,
 .finale.finale-reward .victory-actions button{
  min-height:43px;padding:7px 9px;font-size:12px
 }
}
@media(prefers-reduced-motion:reduce){
 .scene[data-stage="4"] .finale.finale-reward .victory-lada{animation:none}
}

/* One local sound-check button lives in the header on every Hades page. */
#soundHint{display:none!important}


/* Syllable-reading version: only the current short word and two clear choices. */
.scene[data-stage="2"] .word-area{padding-top:8%;width:59%;max-width:59%;gap:10px}
.scene[data-stage="2"] .word-area .prompt{font:700 clamp(21px,2.35vw,33px)/1.18 Georgia,serif;padding:10px 14px;background:#10293fdb;border-color:#84cfebc7}
.scene[data-stage="2"] .word-bridge{gap:clamp(7px,1.1vw,14px)}
.scene[data-stage="2"] .word-step{min-height:clamp(47px,5.8vw,73px);font:bold clamp(15px,1.7vw,22px)/1.1 Georgia,serif;border-radius:30% 35% 23% 25%}
.scene[data-stage="2"] .word-step.partial{border-color:#f6d28d;background:#375b6ca8;color:#fff0ce}
.scene[data-stage="2"] .word-options{grid-template-columns:repeat(2,minmax(0,1fr));width:min(100%,410px);gap:clamp(13px,2vw,27px);margin:4px auto 0}
.scene[data-stage="2"] .word-options button{min-height:clamp(65px,7vw,88px);border-radius:22px;font:bold clamp(25px,2.8vw,38px)/1 Georgia,serif;padding:6px 10px;background:linear-gradient(#214c65,#162f47);border:3px solid #a2e0f0b8;touch-action:manipulation}
.scene[data-stage="2"] .word-options button:disabled{opacity:.32}
.scene[data-stage="2"] .bridge-track i:not(.complete){opacity:.12}
@media(max-width:760px){
 .scene[data-stage="2"] .word-area{width:69%;max-width:69%;padding-top:13%}
 .scene[data-stage="2"] .word-options{gap:10px}

}
