<head>

<title>Золотые змейки памяти · Египет · Тиввиг</title>
<style>
:root{color-scheme:dark;--cream:#fff0d3;--gold:#f7d37b;--ruby:#cf2553;--ink:#241321;--card:#4d2f3f;--card2:#6d485a}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:#140d1d}
body{font:16px Georgia,'Times New Roman',serif;color:var(--cream);background:radial-gradient(ellipse at 50% 30%,#4d294f,#140e1e 76%)}
button,a{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}a{color:inherit;text-decoration:none}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #d3f5ff;outline-offset:3px}
main{margin:0 auto;max-width:1490px;min-height:100dvh;padding:7px 9px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
header{width:min(100%,1320px);min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:7px}
header h1{font:normal clamp(18px,2.4vw,29px) Georgia,serif;margin:0;color:#ffdfb5;text-shadow:0 1px 5px #0c0712;text-align:center}
.nav{font:500 clamp(12px,1.3vw,15px) Georgia,serif;white-space:nowrap;border:1px solid #d2a99f8a;border-radius:11px;background:#3f2448e8;min-height:42px;display:grid;place-items:center;padding:8px 11px}
.scene{width:min(100%,1320px,calc((100dvh - 85px)*1.3333));aspect-ratio:4/3;position:relative;isolation:isolate;overflow:hidden;border:3px solid #9a677d;border-radius:16px;background:#2b1a35;box-shadow:0 8px 0 #291629,0 16px 30px #070610af;touch-action:manipulation}
.backdrop{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:0;user-select:none;pointer-events:none;transition:filter 1s ease}
.scene::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 30px 8px #14091855;pointer-events:none;z-index:30}
.scene-title{position:absolute;z-index:13;left:2%;top:1.7%;margin:0;max-width:54%;color:#fff4d6;font:normal clamp(17px,2.05vw,28px)/1.12 Georgia,serif;text-shadow:0 2px 8px #100819,0 0 12px #1a1025;pointer-events:none}
.scene-title span{display:block;color:#ffd188;font:600 clamp(10px,1.08vw,14px) system-ui,sans-serif;letter-spacing:.09em;margin-bottom:5px}
.message{position:absolute;z-index:15;left:50%;top:7.4%;transform:translateX(-50%);width:max-content;max-width:84%;text-align:center;font:500 clamp(13px,1.55vw,22px)/1.22 Georgia,serif;text-shadow:0 1px 7px #130914,0 0 11px #200e20;color:#fff3d7;pointer-events:none}
.stage-action{position:absolute;z-index:21;left:50%;bottom:5%;transform:translateX(-50%);padding:10px 20px;min-height:48px;border:2px solid #ffe9aa;border-radius:15px;color:#4b2035;font:bold clamp(15px,1.7vw,23px) Georgia,serif;white-space:nowrap;background:linear-gradient(#fff0cd,#f4b66b);box-shadow:0 3px 13px #140c20c2,0 0 18px #fbb75a99}
/* Original illustrated portal art: the two states are baked into the scenery.
   Never mask an AI image with CSS ovals or fake schematic symbols. */
.backdrop{transition:none!important}
.portal-open-art{z-index:1;opacity:0;transition:opacity 1.35s ease-in-out!important;will-change:opacity}
.scene[data-phase="done"] .portal-open-art{opacity:1}
/* Real, shared Lada avatar. Costume is a separate layer; head uses original photograph. */
.real-lada{position:absolute;z-index:5;left:70.7%;top:29%;height:25%;width:12%;pointer-events:none;filter:drop-shadow(2px 5px 6px #200e2dbb)}
.real-lada img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}
.real-lada .costume{z-index:2;clip-path:polygon(0 29%,100% 29%,100% 100%,0 100%);-webkit-clip-path:polygon(0 29%,100% 29%,100% 100%,0 100%)}
.real-lada .head{z-index:3;clip-path:ellipse(24% 15% at 49.6% 14.5%);-webkit-clip-path:ellipse(24% 15% at 49.6% 14.5%)}
/* Memory grid */
.memory-wrap{position:absolute;left:6.2%;top:23%;width:56%;height:63%;z-index:16;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:10px;padding:12px;border-radius:18px;background:linear-gradient(180deg,#24132bcc,#150b1eb6);border:1px solid #c39a82b5;box-shadow:0 6px 18px #0d0716ad}
.memory-card{position:relative;border:0;padding:0;border-radius:16px;background:transparent;perspective:900px;min-width:0;min-height:0;touch-action:manipulation}
.memory-card .inner{position:absolute;inset:0;border-radius:16px;transform-style:preserve-3d;transition:transform .45s ease}
.memory-card.revealed .inner,.memory-card.matched .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 3px 12px #0000005f}
.back{background:linear-gradient(180deg,#7f5d3b,#5a3f2a 40%,#432e21 100%);border:2px solid #f4d085}
.back::before{content:'';position:absolute;inset:10%;border-radius:14px;background:radial-gradient(circle at 50% 50%,#fbe3a2 0 8%,transparent 9%),radial-gradient(circle at 50% 50%,transparent 0 34%,#e9c26d 35% 39%,transparent 40%);opacity:.9}
.back::after{content:'🐍';position:absolute;font-size:clamp(26px,3.2vw,44px);filter:drop-shadow(0 0 3px #ffe9ac)}
.front{transform:rotateY(180deg);border:2px solid #ffefc0;background:linear-gradient(180deg,#fff0d0,#e8d0a2);padding:4px;color:#41233a}
.memory-art{display:block;width:100%;height:100%;max-width:100%;max-height:100%;border-radius:10px;object-position:center center;background:#efd7bb;pointer-events:none;user-select:none}
.memory-card.matched .memory-art{filter:saturate(1.1)}
.memory-card.matched .front{background:linear-gradient(180deg,#f7f2d6,#d8ebb8);border-color:#e8ffc9}

.memory-card:disabled{cursor:default}
.card-hint{position:absolute;inset:-3px;border-radius:18px;border:3px solid #fff6b4;box-shadow:0 0 12px #ffef93;opacity:0;pointer-events:none}
.memory-card.revealed .card-hint{opacity:1}
.zmeya{position:absolute;z-index:18;width:clamp(70px,9vw,120px);height:auto;filter:drop-shadow(0 2px 3px #482a04);pointer-events:none;opacity:0}.snake-shape{display:block;width:100%;height:auto}
.zmeya.run{animation:serpent-swoop .7s ease-in-out forwards}
#snakeA{left:9%;top:19%}#snakeB{left:46%;top:19%}#snakeC{left:27%;top:71%}
@keyframes serpent-swoop{0%{opacity:0;transform:translate(0,-25px) scale(.7) rotate(-12deg)}20%{opacity:1}100%{opacity:1;transform:translate(210px,35px) scale(1.1) rotate(18deg)}}
.finish{position:absolute;z-index:22;left:50%;bottom:4%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:13px 16px;border-radius:14px;border:1px solid #f2d59e;background:#211633e3;box-shadow:0 4px 22px #10051add;max-width:92%}
.finish p{margin:0;color:#fff2d8;white-space:nowrap;font-size:clamp(14px,1.7vw,20px)}.finish a,.finish button{background:#f5ddb0;color:#432143;border:1px solid #fff2dc;border-radius:10px;min-height:44px;padding:8px 13px;white-space:nowrap;font:bold clamp(13px,1.25vw,17px) Georgia,serif}
.finish button{background:#58335d;color:#fff3d8}
@media(max-width:710px){
 main{padding:5px 4px 8px;justify-content:flex-start;min-height:100dvh}header{gap:5px}header h1{font-size:clamp(14px,3.65vw,21px)}.nav{font-size:11px;padding:7px 6px;min-height:42px}
 .scene{width:100%;min-height:385px;aspect-ratio:4/3;border-width:2px}
 .scene-title{max-width:58%;font-size:clamp(13px,3.3vw,20px)}.scene-title span{font-size:9px;margin-bottom:2px}
 .message{top:9%;max-width:90%;white-space:normal;font-size:clamp(11px,2.8vw,15px)}
 .memory-wrap{left:3%;top:24.5%;width:63%;height:62%;gap:6px;padding:8px}
 .real-lada{left:70.8%;top:35%;height:22%;width:13%}
 .stage-action{bottom:7%;min-height:45px;font-size:16px;padding:8px 15px}
 .finish{bottom:1.5%;padding:9px 8px;gap:7px}.finish p{font-size:13px}
}
@media(prefers-reduced-motion:reduce){.memory-card .inner,.portal-open-art{transition:none!important}.zmeya.run{animation:none;opacity:1}}
</style>
</head>
