<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#625080"><title>Ладабург — Дубовый квартал</title>
<style>
:root{--gold:#dec48a;--ink:#2e2344}*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;color:#fff0df}
body{min-height:100dvh;padding:clamp(9px,2vw,24px);background:radial-gradient(ellipse at 50% 0%,#806394,#30243f 75%)}
a{touch-action:manipulation}a:focus-visible{outline:4px solid #fff09e;outline-offset:3px}
header{max-width:1550px;margin:auto auto 12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header a,.back{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:9px 16px;border:2px solid #c39c62;border-radius:12px;background:#f8e7c7;color:#523c38;text-decoration:none;font-weight:bold}
header span{font-size:clamp(12px,1.6vw,19px);letter-spacing:.08em}
main{max-width:1550px;margin:auto}.scene{position:relative;border:7px double var(--gold);border-radius:20px;overflow:hidden;line-height:0;box-shadow:0 20px 50px #150e2299;background:#d2cba7}
.scene>img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.house{position:absolute;left:0%;top:45%;width:19%;height:39%;border-radius:24% 30% 13px 13px;cursor:pointer;display:block;touch-action:manipulation;border:3px solid transparent;background:radial-gradient(ellipse,#d7c1ff1c,transparent 70%);transition:background .2s,border .2s}
.house:hover,.house:focus-visible{background:#e6c9ff4d;border-color:#ffe3a1;outline:3px solid #563c77;outline-offset:-3px}
.house-label{position:absolute;bottom:0;left:50%;transform:translateX(-50%);min-width:105px;max-width:95%;font:bold clamp(12px,1.8vw,23px)/1.2 Georgia,serif;color:#493063;text-align:center;padding:8px 10px;border-radius:14px;background:#f8e8dce8;border:3px solid #ac8dce;box-shadow:0 5px 13px #28193866;pointer-events:none}
.caption{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:13px auto}.caption h1{margin:0;font-size:clamp(23px,3vw,38px);font-weight:normal}.caption p{margin:0;font-size:clamp(13px,1.5vw,18px)}
@media(max-width:720px){body{padding:7px}.scene{border-width:4px;border-radius:10px}.house{left:0;top:45%;width:24%;height:40%}.house-label{font-size:11px;min-width:76px;padding:5px 3px}.caption{text-align:center;justify-content:center}}

/* Second recruit: the strong pink rabbit lives in the right-hand house. */
.rabbit-house{position:absolute;right:0%;top:32%;width:22%;height:50%;border:3px solid transparent;border-radius:24% 18% 16px 20px;cursor:pointer;display:block;touch-action:manipulation;background:radial-gradient(ellipse,#ffd4eb1c,transparent 70%);transition:background .2s,border .2s}
.rabbit-house:hover,.rabbit-house:focus-visible{background:#ffcee65c;border-color:#ffe3aa;outline:3px solid #744879;outline-offset:-3px}
.rabbit-house-label{position:absolute;bottom:0;right:7%;min-width:108px;max-width:96%;text-align:center;padding:8px 10px;border-radius:14px;background:#fce0ece9;color:#673c5a;border:3px solid #d5a0af;box-shadow:0 5px 13px #28193866;pointer-events:none;font:bold clamp(12px,1.8vw,23px)/1.2 Georgia,serif}
@media(max-width:720px){.rabbit-house{right:0;top:29%;width:24%;height:54%}.rabbit-house-label{min-width:82px;padding:5px 4px;font-size:11px}}

/* Third recruit: the book-filled house behind the left staircase. */
.monkey-house{position:absolute;left:23.5%;top:26%;width:18.5%;height:31%;display:block;border:3px solid transparent;border-radius:20% 23% 12px 16px;cursor:pointer;touch-action:manipulation;background:radial-gradient(ellipse,#dab8ff1e,transparent 73%);transition:background .16s,border-color .16s}
.monkey-house:hover,.monkey-house:focus-visible{background:#d7aeff6b;border-color:#ffe9aa;outline:3px solid #5a3478;outline-offset:-3px}
.monkey-label{position:absolute;bottom:0;left:45%;transform:translateX(-50%);min-width:112px;padding:7px 10px;white-space:normal;text-align:center;border-radius:13px;background:#f9ebdff1;color:#523b65;border:3px solid #ad85bd;box-shadow:0 5px 14px #26163c8c;pointer-events:none;font:bold clamp(12px,1.45vw,21px)/1.18 Georgia,serif}
@media(max-width:720px){.monkey-house{left:23.5%;top:25%;width:20%;height:33%}.monkey-label{min-width:78px;padding:4px 5px;font-size:10px}}
</style>
</head>
<body>
<header><a href="ladaburg.html" aria-label="Вернуться к центральной площади Ладабурга">← Ладабург</a><span>Дубовый квартал · Жилые дома</span></header>
<main>
<div class="scene"><img src="images/oak-quarter.webp" alt="Новый жилой квартал Ладабурга, светлые дома в цветах и огромный древний дуб на центральной площади" width="1448" height="1086" draggable="false">
<a class="house" href="ladaburg-cat-home.html" aria-label="Войти в первый дом слева, в гости к ловкому синему коту"><span class="house-label">🐈 Дом кота</span></a>
<a class="rabbit-house" href="ladaburg-rabbit-home.html" aria-label="Войти в дом сильного розового зайца, в гости к силачу"><span class="rabbit-house-label">🐰 Дом силача</span></a>
<a class="monkey-house" href="ladaburg-monkey-home.html" aria-label="Войти в дом Умняшки Обезьяны с библиотекой"><span class="monkey-label">📖 Умняшка</span></a>
</div>
<div class="caption"><h1>Дубовый квартал</h1><p>На площади растёт древний дуб. В этом квартале живут три будущих героя: ловкий кот, сильный заяц и Умняшка Обезьяна.</p></div>
<p id="gameConnection" style="text-align:center;font-size:13px" aria-live="polite"></p>
</main><script src="game-runtime.js?v=1" defer></script>
</body></html>
