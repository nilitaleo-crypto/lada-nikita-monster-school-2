<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c5436">
<title>Бегемот · Египетский зоопарк · Тиввиг</title>
<link rel="stylesheet" href="zoo-enclosures.css?v=3">
</head>
<body data-animal="hippo">
<div class="game">
  <header>
    <a class="back" href="egypt-zoo.html" aria-label="Назад к карте">‹</a>
    <div class="title-wrap">
      <h1>Бегемот</h1>
      <div class="subtitle">Нафири рассказывает о животных Египта</div>
    </div>
  </header>
  <main class="scene" id="scene" aria-label="Игровая сцена"></main>
  <section class="info-bar">
    <div class="task" id="task"></div>
    <div class="progress" id="progress"></div>
    <div class="fact hidden" id="fact"></div>
    <div class="controls hidden" id="controls">
      <button class="action secondary" id="restart" type="button">Ещё раз</button>
      <a class="action" id="mapBtn" href="egypt-zoo.html">К карте зоопарка</a>
    </div>
  </section>
</div>
<p id="gameConnection" class="hidden" role="status" aria-live="polite"></p>
<script src="zoo-enclosures.js?v=3"></script>
<script src="game-runtime.js?v=6" defer></script>
</body>
</html>
