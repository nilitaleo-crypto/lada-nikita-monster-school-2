<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b78c55">
<meta name="description" content="Лада оживляет шесть стражей храма ибиса. Повторяй движения под руководством учителя.">
<title>Храм ибиса · Движения стражей · Тиввиг</title>
<link rel="preload" as="image" href="images/egypt-motion-temple-bg.webp">
<style>
:root{--gold:#ffdc8c;--sand:#f2c879;--dark:#34221a}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:#44301d;color:#fff3da;font-family:Georgia,'Times New Roman',serif}
button,a{font:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:inherit;text-decoration:none}button{cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #073949;outline-offset:3px}
main{max-width:1380px;padding:8px 8px 12px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:7px;min-height:45px;margin:0 auto 8px;max-width:1280px}
header h1{font-weight:normal;font-size:clamp(17px,2.45vw,28px);margin:0;text-align:center;color:#fff0ce;text-shadow:0 2px 4px #251300}
.nav{display:grid;place-items:center;min-height:44px;padding:7px 12px;border:1px solid #f1c37c;border-radius:10px;background:#6e4a2dec;white-space:nowrap;font-size:clamp(12px,1.3vw,17px)}
.scene{width:min(100%,1280px);margin:auto;aspect-ratio:1672/941;position:relative;isolation:isolate;overflow:hidden;border:3px solid #e7b96e;border-radius:14px;background:#e7bb79;box-shadow:0 12px 28px #1a0a0477}
.landscape{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;object-position:center;pointer-events:none;user-select:none}
.scene:after{content:"";position:absolute;inset:0;z-index:21;box-shadow:inset 0 0 24px #31211239;pointer-events:none}
/* Temple entrance stays visible; no duplicate painted window or obstructing gate. */
.temple-glow{position:absolute;z-index:1;left:36%;top:30%;width:28%;height:54%;border-radius:50%;background:radial-gradient(ellipse,#ffedb98c,transparent 65%);opacity:0;pointer-events:none;transition:opacity .6s}
.scene[data-state="done"] .temple-glow{opacity:1}
.guardians{position:absolute;z-index:9;top:2.3%;left:17%;right:17%;height:11.2%;display:flex;gap:1.8%;justify-content:center;align-items:center;pointer-events:none}
.guardian{height:100%;aspect-ratio:1;min-width:0;flex:0 1 11.2%;display:grid;place-items:center;opacity:.94;filter:saturate(.85) brightness(.98) drop-shadow(0 4px 4px #3421159e);transition:transform .2s,filter .25s,opacity .25s}
.guardian img{display:block;width:100%;height:100%;object-fit:contain}
.guardian.awake{opacity:1;filter:drop-shadow(0 0 11px #fff0a5) drop-shadow(0 3px 3px #382a26)}
.guardian.current{opacity:1;filter:drop-shadow(0 0 11px #fff0a5) drop-shadow(0 4px 5px #42271a);transform:scale(1.13)}
.chapter{position:absolute;z-index:10;top:14.6%;left:0;right:0;text-align:center;font:700 clamp(13px,1.35vw,19px) Georgia,serif;color:#f9e4b3;text-shadow:0 2px 7px #351912,0 0 4px #351912;pointer-events:none}
.command{position:absolute;z-index:10;top:19.6%;left:19%;right:19%;text-align:center;pointer-events:none}
.command strong{display:block;color:#fff5d7;font:normal clamp(26px,3.15vw,42px) Georgia,serif;text-shadow:0 2px 8px #3e2619,0 0 4px #331915}
/* The teacher gives exercise instructions aloud: no instructional panel on-screen. */
.figure{position:absolute;z-index:8;top:32%;left:50%;transform:translateX(-50%);width:min(29%,370px);aspect-ratio:1;display:grid;place-items:center;pointer-events:none;filter:drop-shadow(0 14px 12px #4127188c)}
.figure img{width:100%;height:100%;object-fit:contain;display:block;user-select:none}
@keyframes medal-in{from{opacity:.35;transform:translateX(-50%) scale(.84)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.person{position:absolute;z-index:7;bottom:1.5%;height:31%;pointer-events:none;filter:drop-shadow(0 6px 6px #3a251b91)}
.person img{display:block;width:100%;height:100%;object-fit:contain;object-position:bottom center;pointer-events:none;user-select:none}
.lada{left:3%;width:17%}.lada img{position:absolute;inset:0}
.lada [data-outfit-layer]{clip-path:polygon(0 27%,100% 27%,100% 100%,0 100%);-webkit-clip-path:polygon(0 27%,100% 27%,100% 100%,0 100%)}
.lada[data-outfit="egyptMoon"] [data-outfit-layer]{clip-path:none;-webkit-clip-path:none}
.tuten{right:2%;width:18%}
.action{position:absolute;z-index:15;bottom:4%;left:50%;transform:translateX(-50%);min-height:55px;min-width:170px;padding:8px 19px;border:3px solid #fff0c0;border-radius:14px;background:linear-gradient(#fff1b9,#e8b15b);color:#57361d;font:bold clamp(19px,2vw,25px) Georgia,serif;box-shadow:0 4px 0 #a0784c,0 7px 14px #46281780}
.action:active{transform:translate(-50%,3px);box-shadow:0 1px 0 #a0784c}
.reward{position:absolute;z-index:11;left:38%;top:33%;width:24%;height:38%;display:grid;place-items:center;pointer-events:none;filter:drop-shadow(0 0 17px #ffeab2)}
.reward img{width:100%;height:100%;object-fit:contain}
.scene[data-state="done"] .figure{display:none}
.footer{position:absolute;z-index:16;right:2%;bottom:3%;min-height:46px;border:2px solid #f0c77a;border-radius:10px;background:#5b482fe8;color:#fff1c9;padding:9px 13px;display:grid;place-items:center;font-weight:bold}
#gameConnection{min-height:1em;margin:5px auto 0;max-width:1280px;color:#fff2cf;font:12px system-ui,sans-serif}
@media(max-width:720px){
main{padding:4px}header h1{font-size:16px}.nav{font-size:12px;padding:6px 8px}
.scene{aspect-ratio:4/5;min-height:430px}.landscape{object-position:center}
.guardians{top:3%;left:2%;right:2%;height:9.8%;gap:1%}.guardian{flex:1 1 16%;height:auto;aspect-ratio:1;max-width:15%}
.chapter{top:15%;font-size:14px}.command{top:21%;left:7%;right:7%}.command strong{font-size:clamp(24px,6.5vw,33px)}
.figure{top:35%;width:min(51%,220px)}
.person{bottom:4%;height:26%}.lada{left:-2%;width:25%}.tuten{right:-2%;width:27%}
.action{bottom:4%;min-height:52px;min-width:151px;font-size:19px;padding:8px 10px}
.reward{top:38%;left:32%;width:36%;height:31%}.footer{right:2%;bottom:2%;font-size:12px;padding:8px}
}
@media(prefers-reduced-motion:reduce){.figure{animation:none}.guardian,.temple-glow{transition:none}}
</style>
</head>
<body>
<main>
<header><a class="nav" href="egypt-solar-barque.html">← Ладья Ра</a><h1>Храм ибиса</h1><a class="nav" href="index.html">⌂ Карта</a></header>
<section class="scene" id="motionScene" data-state="intro" aria-label="Храм ибиса: повторяй движения за шестью стражами по команде учителя">
<img class="landscape" id="motionBackdrop" src="images/egypt-motion-temple-bg.webp" alt="Солнечный египетский храм ибиса с золотыми колоннами" draggable="false" fetchpriority="high" decoding="async">
<div class="temple-glow" aria-hidden="true"></div>
<div class="guardians" id="motionGuardians" aria-label="Шесть эмблем стражей"></div>
<div class="chapter" id="motionProgress" aria-live="polite">ШЕСТЬ СТРАЖЕЙ</div>
<div class="command" aria-live="polite"><strong id="motionName">Разбудим храм!</strong></div>
<div class="figure" id="motionFigure" aria-label="Эмблема текущего стража" role="img"><img id="motionMedallion" src="images/egypt-motion-ibis.webp" alt="Ибис" draggable="false"></div>
<div class="person lada" id="motionLada" role="img" aria-label="Лада в выбранном костюме"><img src="images/lada-cutout.webp" alt="" draggable="false"><img data-outfit-layer hidden alt="" draggable="false"></div>
<div class="person tuten" role="img" aria-label="Тутенштейн"><img src="images/egypt-tutenstein.webp" alt="" draggable="false"></div>
<div class="reward" id="motionReward" hidden><img src="images/egypt-motion-amulet.svg" alt="Амулет оживших стражей" draggable="false"></div>
<button class="action" id="motionAction" type="button" data-tivvig-sound="manual">Начать</button>
<a class="footer" id="motionToMap" href="index.html" hidden>Карта →</a>
</section>
<p id="gameConnection" role="status"></p>
</main>
<script src="wardrobe.js?v=7" defer></script>
<script src="egypt-motion-temple.js?v=2" defer></script>
<script src="hades-sounds.js?v=9" defer></script>
<script src="game-runtime.js?v=5" defer></script>
</body>
</html>
