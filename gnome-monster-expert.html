<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#283b30">
<meta name="description" content="В доме гнома Чудоведа Лада читает восемь названий чудовищ и собирает предметы для защиты деревни.">
<title>Дом гнома Чудоведа — Тиввиг</title>
<style>
:root{--ink:#523721;--gold:#e1b876;--parchment:#ffedc1;--pine:#2b5043}
*{box-sizing:border-box} html{background:#1d3028} body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 4%,#536843,#1e312a 76%);font-family:Georgia,'Times New Roman',serif;color:#f7e6c7}
button,a{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent} button{cursor:pointer} button:focus-visible,a:focus-visible{outline:3px solid #ffe094;outline-offset:3px} [hidden]{display:none!important}
.shell{width:min(100%,1510px);margin:0 auto;padding:clamp(7px,1.5vw,18px)}
.head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:9px;margin:0 auto 10px}
.head h1{font-size:clamp(24px,2.85vw,39px);font-weight:normal;margin:0;line-height:1.12}.head small{font-size:clamp(13px,1.2vw,17px);color:#e8d19a}
.back{display:inline-flex;align-items:center;justify-content:center;padding:9px 14px;min-height:45px;color:#ffedc8;background:#294b3d;border:2px solid #c4a06a;border-radius:11px;text-decoration:none;font-weight:bold}
.scene{position:relative;width:100%;aspect-ratio:1672/941;border:5px ridge #c7a066;border-radius:13px 13px 4px 4px;overflow:hidden;background:#664b32;isolation:isolate;box-shadow:0 12px 38px #111b1499}
.scene-art{display:block;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.scene::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 24px #130f0b70;pointer-events:none;z-index:5}
.scene-caption{position:absolute;z-index:3;left:64.5%;top:17%;width:30%;height:56%;padding:1%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:clamp(4px,1vw,12px);color:#65442b;text-align:center;pointer-events:none}
.scene-caption strong{font-weight:normal;font-size:clamp(16px,2.55vw,37px);line-height:1.1}
.scene-caption .beast{font-size:clamp(23px,5vw,64px);line-height:1.2;filter:drop-shadow(1px 2px 3px #82694b55)}
.scene-caption .word{font:bold clamp(16px,2.75vw,42px)/1.1 Georgia,serif;letter-spacing:.045em;overflow-wrap:anywhere;max-width:100%}
.gear-spot{position:absolute;z-index:7;left:var(--x);top:var(--y);width:clamp(44px,6vw,82px);height:clamp(44px,6vw,82px);transform:translate(-50%,-50%);background:#fbe2a930;border:3px dashed #ffe8a3;border-radius:50%;box-shadow:0 0 0 6px #fbdc7770,0 0 22px 8px #ffd077b8;opacity:1;display:grid;place-items:center}
.gear-spot:disabled{display:none}.gear-spot:after{content:'+';font:bold 28px/1 Georgia,serif;color:#fff3c1;text-shadow:0 2px 3px #372017}
.gear-spot:hover{background:#f7e09079}
.lesson{background:linear-gradient(105deg,#fbe8bd,#ffefd0 52%,#e6c998);border:4px ridge #b18b57;border-top:0;border-radius:0 0 16px 16px;box-shadow:0 9px 17px #15231966;color:var(--ink);padding:clamp(11px,1.8vw,24px)}
.intro{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;border-bottom:1px dashed #b39162;padding-bottom:11px}
.intro strong{font-size:clamp(19px,2.3vw,30px);color:#604020;font-weight:normal}
.intro .count{font:bold clamp(13px,1.5vw,18px)/1.2 Georgia,serif;background:#315645;color:#fdf0ca;border:2px solid #ac874e;padding:7px 12px;border-radius:40px}
.lesson-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,31%);align-items:center;gap:clamp(9px,2vw,24px);padding-top:10px}
.phrase{font-size:clamp(16px,1.7vw,23px);line-height:1.4;margin:0 0 7px;max-width:970px}
.feedback{min-height:29px;font-size:clamp(14px,1.35vw,19px);color:#475a36;font-weight:bold;margin:8px 0}
.feedback.warn{color:#9a4f37}
.word-track{min-height:66px;background:#fff6dfe8;border:2px solid #c5a776;border-radius:13px;padding:10px 15px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font:bold clamp(24px,3.1vw,43px)/1 Georgia,serif;letter-spacing:.03em;color:#4e3726}
.word-track .empty{display:inline-block;min-width:clamp(42px,6vw,100px);height:34px;border-bottom:3px solid #bc9b6b;opacity:.7}
.word-track .part{background:#ebddae;border:1px solid #c09e67;border-radius:6px;padding:4px 9px}
.tiles{display:flex;gap:clamp(8px,1.1vw,16px);flex-wrap:wrap;justify-content:center;align-items:center;margin:12px 0 3px;min-height:70px}
.tile{min-width:clamp(77px,11vw,145px);min-height:60px;border-radius:13px;border:3px solid #9b7648;background:linear-gradient(#fffaf0,#f2daa5);color:#4c3021;box-shadow:0 4px 0 #8b6b4790;font:bold clamp(23px,2.6vw,36px)/1 Georgia,serif;padding:8px 14px}
.tile:hover{background:#fff2cb}.tile:disabled{display:none}
.controls{display:flex;flex-direction:column;gap:8px;justify-content:center;align-items:stretch}
.action{min-height:49px;padding:10px 13px;border:2px solid #a37e4f;border-radius:11px;background:#315b4e;color:#fdf0c7;font-weight:bold;font-size:clamp(16px,1.55vw,22px)}
.action:hover{background:#477666}.action:disabled{opacity:.38;cursor:default}
.action.secondary{background:#f8eacb;color:#64482d}.action.secondary:hover{background:#ffe2a8}
.loot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:11px 0 0;border-top:1px dashed #bd9d75;margin-top:13px;font-size:clamp(14px,1.4vw,19px)}
.loot strong{margin-right:5px}.loot .item{padding:6px 10px;border:1px solid #ba965e;border-radius:9px;background:#fff8e6;color:#523720;white-space:nowrap}
.end{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:10px 0;padding:14px;background:#426f55;border:2px solid #bc965e;border-radius:10px;color:#f9edcb;font-size:clamp(16px,1.5vw,21px)}
.end a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 14px;border:2px solid #c6a56e;border-radius:9px;background:#fff0c5;color:#523621;text-decoration:none;font-weight:bold}
.footer-note{color:#e9d7b0;text-align:center;font-size:clamp(12px,1.2vw,16px);margin:12px}
#gameConnection{font-size:13px;color:#ffe4af;text-align:center}
@media(max-width:780px){.head{justify-content:center}.head h1{width:100%;text-align:center}.scene{border-width:3px}.scene-caption strong{font-size:clamp(12px,2.5vw,19px)}.scene-caption .word{font-size:clamp(12px,2.5vw,22px)}.scene-caption .beast{font-size:clamp(19px,4.5vw,34px)}.lesson-main{grid-template-columns:1fr}.controls{flex-direction:row;flex-wrap:wrap}.controls .action{flex:1 1 155px}.tile{min-height:52px}.word-track{min-height:55px}}
@media(max-width:470px){.scene-caption{display:none}.head small{display:none}.tile{min-width:84px;font-size:24px}.lesson{padding:10px}.loot .item{font-size:13px}}

/* Eight miniature illustrated bestiary rewards; one shared image atlas, no emojis as portraits. */
.card-art{display:block;background-image:url("images/gnome-monster-mini-cards.webp?v=1");background-repeat:no-repeat;background-size:400% 200%;background-position:var(--bx,0%) var(--by,0%);aspect-ratio:418 / 470.5;box-shadow:0 2px 5px #402c2170;border:1px solid #bd9562;border-radius:7px;overflow:hidden}
.scene-caption .beast[hidden],.scene-monster-art[hidden]{display:none!important}
.scene-monster-art{width:clamp(45px,9vw,120px);max-height:52%;margin:3px auto;box-shadow:0 4px 12px #69452566}
.monster-collection{margin-top:15px;padding:12px 10px 13px;background:#fcf2dc;border:2px solid #c6a67d;border-radius:14px}
.collection-heading{font-size:clamp(16px,1.65vw,22px);font-weight:bold;margin:0 0 10px;color:#5d412b}
.monster-cards{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:clamp(5px,1vw,12px)}
.mini-slot{display:flex;flex-direction:column;justify-content:flex-start;gap:5px;min-width:0;padding:5px;border:1px solid #cbaa76;border-radius:8px;background:#eedfbe;color:#654d36;text-align:center;box-shadow:0 2px 3px #5a3d2c24}
.mini-slot .card-art{width:100%;height:auto}
.mini-name{font:bold clamp(10px,1.05vw,15px)/1.17 Georgia,serif;overflow-wrap:anywhere}
.mini-slot.locked{opacity:.7;background:#eee3d1}
.mini-slot.locked .mini-place{display:grid;place-items:center;aspect-ratio:418 / 470.5;border:1px dashed #b19b81;border-radius:7px;color:#baa487;font:normal clamp(27px,3vw,42px)/1 Georgia,serif;background:linear-gradient(145deg,#ebdcc0,#f6ead4)}
.mini-slot.locked .mini-name{color:#93836c}
.monster-reward{position:fixed;inset:0;z-index:110;display:grid;place-items:center;padding:clamp(10px,2vw,25px);background:#121a17d9;overflow-y:auto}
.monster-reward[hidden]{display:none!important}
.reward-panel{width:min(93vw,410px);max-height:96dvh;display:flex;flex-direction:column;gap:clamp(6px,1vh,11px);align-items:center;justify-content:center;border:7px double #d1ac70;border-radius:16px;background:radial-gradient(circle at 50% 12%,#fff4db,#f0d6a5 92%);color:#4d3827;box-shadow:0 18px 48px #000b;padding:clamp(10px,1.7vw,20px)}
.reward-eyebrow{font:italic clamp(18px,2.4vw,25px)/1.1 Georgia,serif;color:#88582f;text-align:center}
.reward-panel .card-art{width:min(57%,185px);flex-shrink:1;min-height:0;box-shadow:0 7px 18px #54412c66;border-width:3px}
.reward-monster-name{font:bold clamp(21px,4vw,34px)/1 Georgia,serif;text-align:center;letter-spacing:.055em}
.reward-caption{font-size:clamp(12px,1.6vw,16px);line-height:1.3;text-align:center;max-width:330px}
.reward-claim{width:100%;padding:11px 16px;min-height:48px;border-radius:12px;border:2px solid #a77c45;background:linear-gradient(#406b54,#294a3a);color:#fff1cd;font-weight:bold;font-size:clamp(16px,2vw,20px);box-shadow:0 4px 0 #183b2f77}
.reward-claim:hover{background:#416f56}
@media(max-width:680px){.monster-cards{grid-template-columns:repeat(4,minmax(0,1fr))}.mini-name{font-size:12px}.scene-monster-art{width:18%}.reward-panel .card-art{width:min(57%,155px)}}
@media(max-height:600px){.reward-panel{padding:8px;gap:5px}.reward-panel .card-art{width:min(36%,110px)}.reward-eyebrow{font-size:17px}.reward-monster-name{font-size:23px}.reward-caption{font-size:12px}.reward-claim{min-height:40px;padding:5px}}
@media(prefers-reduced-motion:no-preference){.reward-panel{animation:cardReveal .23s ease-out both}@keyframes cardReveal{from{transform:scale(.93);opacity:.7}to{transform:scale(1);opacity:1}}}


/* Integrated gameplay: the actual painting's parchment board is the only game surface. */
.scene-scroll{width:100%;overflow-x:auto;overscroll-behavior-x:contain;border-radius:12px;scrollbar-color:#bc9162 #2e4233}
.scene{border-radius:13px}
.board-game{pointer-events:auto;z-index:6;left:63.8%;top:12%;width:31.2%;height:64.5%;padding:0 0.45%;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:clamp(2px,.37vw,6px);overflow:hidden;color:#5c3d28;text-align:center}
.board-head{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;min-height:22px}
.board-head strong{font-size:clamp(14px,1.8vw,27px);line-height:1.15;font-weight:bold}
.board-head .count{font:bold clamp(10px,.9vw,15px)/1 Georgia,serif;color:#75502c;white-space:nowrap}
.board-word{min-height:24px;display:flex;align-items:center;justify-content:center;gap:6px}
.board-word .word{font:bold clamp(13px,1.7vw,26px)/1.12 Georgia,serif;letter-spacing:.015em;overflow-wrap:anywhere}
.board-word .beast{font-size:clamp(14px,1.7vw,25px);filter:none}
.board-word .scene-monster-art{width:clamp(22px,3.8vw,50px);margin:0}
.board-game .phrase{font-size:clamp(11px,1.16vw,17px);line-height:1.23;margin:1px 0}
.board-game .word-track{min-height:clamp(33px,3.8vw,58px);padding:3px 5px;gap:4px;border-width:1px;border-radius:7px;background:#fff2d08c;font-size:clamp(17px,2vw,30px);line-height:1.05}
.board-game .word-track .part{padding:3px 5px;background:#ebd3a274;white-space:nowrap;border-radius:5px}
.board-game .word-track .empty{min-width:clamp(24px,3.2vw,50px);height:19px;border-bottom-width:2px}
.board-game .tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(3px,.5vw,8px);margin:2px 0;min-height:0;align-items:stretch}
.board-game .tile{min-width:0;min-height:clamp(36px,4.25vw,59px);font:bold clamp(17px,1.85vw,29px)/1 Georgia,serif;padding:5px 6px;border-width:2px;border-radius:7px;box-shadow:0 2px 0 #8b6b4780}
.board-game .tile[hidden]{display:none!important}
.board-game .feedback{min-height:0;max-height:51px;overflow-y:auto;font-size:clamp(10px,1.04vw,16px);line-height:1.18;margin:1px 0}
.board-game .controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:center;gap:4px;margin-top:auto}
.board-game .action{min-height:clamp(34px,3.8vw,48px);font-size:clamp(11px,1.13vw,17px);line-height:1.12;padding:5px 4px;border-width:2px;border-radius:8px}
.board-game #readConfirm:not([hidden]),.board-game #nextMonster:not([hidden]){grid-column:1 / -1}
.board-game #undoSyllable:disabled{opacity:.42}
.board-game .loot{min-height:18px;display:flex;align-items:center;justify-content:center;gap:4px;padding:3px 0 0;margin:0;border:0;font-size:clamp(9px,.96vw,14px)}
.board-game .loot .item{font-size:clamp(9px,.85vw,13px);padding:2px 3px;white-space:nowrap;border:0;background:transparent}
.board-game .end{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;padding:5px;margin:0;border-width:1px;border-radius:6px;font-size:clamp(11px,1.1vw,15px)}
.board-game .end a{min-height:34px;font-size:inherit;padding:5px 8px}
.collection-holder{background:linear-gradient(105deg,#fbe8bd,#fff0d0 52%,#e4c999);border:4px ridge #b18b57;border-top:0;border-radius:0 0 14px 14px;box-shadow:0 9px 17px #15231966;padding:clamp(6px,1vw,13px)}
.collection-holder .monster-collection{margin:0}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:900px){
 .scene{min-width:850px}
 .board-game{top:12.3%;height:64.2%;width:31.2%;left:63.7%;gap:2px}
 .board-head strong{font-size:16px}
 .board-head .count{font-size:11px}
 .board-word .word{font-size:16px}
 .board-game .phrase{font-size:12px}
 .board-game .word-track{min-height:33px;font-size:19px}
 .board-game .tile{min-height:36px;font-size:19px}
 .board-game .action{min-height:34px;font-size:12px}
 .board-game .feedback{font-size:11px;max-height:38px}
 .board-game .loot{font-size:10px}
 .board-game .loot .item{font-size:10px}
}

@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="shell">
<header class="head"><a href="gnome-village.html" class="back">← Деревня гномов</a><h1>Дом гнома Чудоведа</h1><small>Подготовка к ночной обороне</small></header>
<div class="scene-scroll" id="sceneScroll" tabindex="0" role="region" aria-label="Хижина Чудоведа: на узком экране можно листать изображение по горизонтали"><section class="scene" aria-label="Уютная хижина гнома-знатока чудовищ с предметами защиты">
 <img class="scene-art" src="images/gnome-monster-expert.webp?v=1" alt="Гном в зелёной шапке с книгой о чудовищах. В его комнате есть щит, зеркало, колокол, сеть, старые книги и таинственные предметы" width="1672" height="941" draggable="false" fetchpriority="high">

 <div class="scene-caption board-game" aria-label="Игровая доска гнома Чудоведа">
  <div class="board-head"><strong id="sceneCaption">Бестиарий Чудоведа</strong><span class="count" id="lessonCounter">1 из 8</span></div>
  <div class="board-word"><span class="beast" id="sceneBeast" aria-hidden="true">🔍</span><span class="scene-monster-art card-art" id="sceneMonsterArt" role="img" aria-label="Портрет прочитанного чудовища" hidden></span><span class="word" id="sceneWord">Прочитай моё имя</span></div>
  <strong class="sr-only" id="lessonTitle">Чудовед: «Изучим чудовищ!»</strong>
  <p class="phrase" id="lessonSpeech" aria-live="polite">Собери слово и прочитай его вслух.</p>
  <div id="wordTrack" class="word-track" aria-label="Составленное слово" aria-live="polite"></div>
  <div class="tiles" id="syllableTiles" aria-label="Выбери слоги по порядку">
   <button type="button" class="tile" id="syllable0">—</button><button type="button" class="tile" id="syllable1">—</button><button type="button" class="tile" id="syllable2">—</button><button type="button" class="tile" id="syllable3">—</button>
  </div>
  <p class="feedback" id="lessonFeedback" role="status" aria-live="polite"></p>
  <div class="controls">
   <button type="button" class="action" id="readConfirm" hidden>✓ Прочитано</button>
   <button type="button" class="action" id="nextMonster" hidden>Следующее чудовище →</button>
   <button type="button" class="action secondary" id="undoSyllable">↶ Убрать слог</button>
   <button type="button" class="action secondary" id="restartLesson">↻ Сначала</button>
  </div>
  <div class="loot" id="loot" aria-label="Снаряжение для обороны" aria-live="polite"><strong>🎒</strong><span>Рюкзак пуст</span></div>
  <div class="end" id="lessonDone" hidden><span>✦ Восемь слов прочитаны!</span><a href="gnome-village.html">В деревню →</a></div>
 </div>
 <button type="button" id="gearShield" class="gear-spot" style="--x:36%;--y:43%" aria-label="Взять щит" disabled></button>
 <button type="button" id="gearMirror" class="gear-spot" style="--x:44.5%;--y:44%" aria-label="Взять зеркало" disabled></button>
 <button type="button" id="gearBell" class="gear-spot" style="--x:51%;--y:50%" aria-label="Взять колокол" disabled></button>
 <button type="button" id="gearNet" class="gear-spot" style="--x:54%;--y:69%" aria-label="Взять сеть" disabled></button>
</section></div>
<div class="collection-holder">
 <section class="monster-collection" aria-label="Коллекция карточек изученных чудовищ"><h2 class="collection-heading">📖 Мой маленький бестиарий <span id="collectedCount">0 / 8</span></h2><div id="monsterCards" class="monster-cards" aria-live="polite"></div></section>
</div>
<div class="monster-reward" id="monsterReward" role="dialog" aria-modal="true" aria-labelledby="rewardName" hidden>
 <div class="reward-panel">
  <div class="reward-eyebrow">✦ Новая мини-награда! ✦</div>
  <div id="rewardArt" class="card-art" role="img" aria-label="Иллюстрация чудовища"></div>
  <div id="rewardName" class="reward-monster-name">Чудовище</div>
  <div id="rewardCaption" class="reward-caption"></div>
  <button type="button" class="reward-claim" id="rewardAccept">Забрать карточку в бестиарий →</button>
 </div>
</div>

<p id="gameConnection" role="status" aria-live="polite"></p>
</main>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const monsters=[
 {word:'ЗОМБИ',parts:['ЗОМ','БИ'],order:[1,0],icon:'🧟',note:'Зомби ходит медленно и ищет дорогу. Теперь ты знаешь его имя.'},
 {word:'ГИДРА',parts:['ГИ','ДРА'],order:[1,0],icon:'🐉',note:'У гидры много голов. Она уже знакома Ладе по приключениям на вулкане.'},
 {word:'МУМИЯ',parts:['МУ','МИ','Я'],order:[2,0,1],icon:'🧻',note:'Мумия закутана в длинные полосы ткани.'},
 {word:'ВАМПИР',parts:['ВАМ','ПИР'],order:[1,0],icon:'🦇',note:'Вампир любит темноту. Фонари помогут гномам освещать деревню.'},
 {word:'ГОЛЕМ',parts:['ГО','ЛЕМ'],order:[1,0],icon:'🪨',note:'Голем — существо из камня или глины в старинных легендах.'},
 {word:'ЛЕШИЙ',parts:['ЛЕ','ШИЙ'],order:[1,0],icon:'🌲',note:'Леший живёт в лесу. Его легко спутать с деревом.'},
 {word:'ТРОЛЛЬ',parts:['ТРОЛЛЬ'],order:[0],icon:'👹',note:'Тролля Лада уже встретила на мосту. В этом слове только один слог.'},
 {word:'ДЕМОГОРГОН',parts:['ДЕ','МО','ГОР','ГОН'],order:[2,0,3,1],icon:'🌺',note:'Демогоргоны опасны для деревни. Гномы готовят защиту до наступления ночи.'}
];
const equipment=[
 {id:'Shield',name:'Щит',icon:'🛡️',description:'Щит укроет гномов от ударов.'},
 {id:'Mirror',name:'Зеркало',icon:'🪞',description:'Зеркалом можно отражать свет и подавать сигналы.'},
 {id:'Bell',name:'Колокол',icon:'🔔',description:'Колокол поможет вовремя предупредить жителей.'},
 {id:'Net',name:'Сеть',icon:'🕸️',description:'Сеть пригодится, чтобы задержать небольшое чудовище.'}
];
const reward='tivvig_reward_gnome_bestiary_v1';
const gearStorage='tivvig_gnome_defense_supplies_v1';
let index=0,phase='assemble',selected=[],gears=[],finished=false,found=new Set();
const buttons=[$('syllable0'),$('syllable1'),$('syllable2'),$('syllable3')];
const sceneScroll=$('sceneScroll');
function revealBoard(){if(window.innerWidth<=900)sceneScroll.scrollLeft=sceneScroll.scrollWidth-sceneScroll.clientWidth;}
const el=(name,cls,text)=>{const node=document.createElement(name);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node};
function say(text,warning=false){const feedback=$('lessonFeedback');feedback.textContent=text;feedback.classList.toggle('warn',warning)}
function cardArt(node,n){
 const xs=['0%','33.333333%','66.666667%','100%'];
 node.style.setProperty('--bx',xs[n%4]);
 node.style.setProperty('--by',n<4?'0%':'100%');
}
function collection(){
 const grid=$('monsterCards');grid.replaceChildren();
 for(let n=0;n<monsters.length;n++){
  const card=el('div','mini-slot'+(found.has(n)?'':' locked'));
  const pic=el('div',found.has(n)?'card-art':'mini-place');
  if(found.has(n)){
   cardArt(pic,n);
   pic.setAttribute('role','img');
   pic.setAttribute('aria-label','Иллюстрация: '+monsters[n].word);
  }else pic.textContent='?';
  const name=el('span','mini-name',found.has(n)?monsters[n].word:'Не открыто');
  card.append(pic,name);grid.append(card);
 }
 $('collectedCount').textContent=found.size+' / '+monsters.length;
}
function update(){
 const m=monsters[index];
 if(window.innerWidth<=900){if(phase==='gear')sceneScroll.scrollLeft=0;else revealBoard();}
 $('lessonCounter').textContent=(finished?'8 / 8 ✓':'Слово '+(index+1)+' из '+monsters.length);
 const caption=$('sceneCaption'),beast=$('sceneBeast'),word=$('sceneWord');
 caption.textContent=finished?'Секреты чудовищ изучены':'Чудовище № '+(index+1);
 const seen=found.has(index);
 beast.textContent='🔍';beast.hidden=seen;
 const portrait=$('sceneMonsterArt');portrait.hidden=!seen;
 if(seen){cardArt(portrait,index);portrait.setAttribute('aria-label','Иллюстрация: '+m.word);}
 word.textContent=phase==='assemble'?'Прочитай моё имя':m.word;
 collection();
 const popup=$('monsterReward');popup.hidden=phase!=='reward';
 if(phase==='reward'){
  cardArt($('rewardArt'),index);
  $('rewardArt').setAttribute('aria-label','Мини-награда: '+m.word);
  $('rewardName').textContent=m.word;
  $('rewardCaption').textContent=m.note;
 }
 $('lessonTitle').textContent=finished?'Чудовед: «Молодец, Лада!»':'Чудовед: «Изучим новое чудовище!»';
 const target=$('wordTrack');target.replaceChildren();
 if(phase==='assemble'){
  for(const indexPart of selected)target.append(el('span','part',m.parts[m.order[indexPart]]));
  for(let i=selected.length;i<m.parts.length;i++)target.append(el('span','empty',''));
 }else target.append(el('span','part',m.parts.join('')));
 for(let k=0;k<buttons.length;k++){
  const b=buttons[k],has=k<m.order.length;
  b.hidden=!has||phase!=='assemble'||selected.includes(k);
  b.disabled=b.hidden;
  b.textContent=has?m.parts[m.order[k]]:'';
  b.setAttribute('aria-label',has?'Выбрать слог '+m.parts[m.order[k]]:'Слог отсутствует');
 }
 $('undoSyllable').disabled=phase!=='assemble'||selected.length===0;
 $('readConfirm').hidden=phase!=='read';
 $('nextMonster').hidden=phase!=='ready'||finished;
 $('nextMonster').textContent=index===monsters.length-1?'Завершить подготовку':'Следующее чудовище →';
 for(const item of equipment){const btn=$('gear'+item.id);btn.disabled=phase!=='gear'||equipment[Math.floor(index/2)]?.id!==item.id;}
 if(finished){$('lessonSpeech').textContent='Готово! Восемь слов и четыре предмета.';}
 else if(phase==='assemble')$('lessonSpeech').textContent='Собери слоги и прочитай слово вслух.';
 else if(phase==='read')$('lessonSpeech').textContent='Прочитай вслух и нажми «Прочитано».';
 else if(phase==='reward')$('lessonSpeech').textContent='Ты прочитала слово! Забери карточку чудовища в свой маленький бестиарий.';
 else if(phase==='gear'){$('lessonSpeech').textContent='Найди '+equipment[Math.floor(index/2)].name.toLowerCase()+' в комнате и нажми на предмет.';}
 else $('lessonSpeech').textContent='Отлично! Теперь продолжим изучать чудовищ.';
 const loot=$('loot');loot.replaceChildren(el('strong','', '🎒 Снаряжение:'));
 if(!gears.length)loot.append(el('span','', 'Рюкзак пуст'));
 for(const g of gears)loot.append(el('span','item',g.icon));
 $('lessonDone').hidden=!finished;
}
function takeSyllable(k){
 if(phase!=='assemble'||selected.includes(k))return;
 const m=monsters[index];if(k>=m.parts.length)return;
 if(m.order[k]!==selected.length){say('Этот слог пока не подходит. Вспомни, с какого звука начинается слово.',true);return;}
 selected.push(k);
 if(selected.length===m.parts.length){phase='read';say('Слово собрано! Теперь произнеси его вслух.');}
 else say('Хорошо! Читай следующий слог.');
 update();
}
function undo(){if(phase!=='assemble'||!selected.length)return;selected.pop();say('Убрали последний слог.');update()}
function confirmReading(){
 if(phase!=='read')return;
 found.add(index);
 phase='reward';
 say('✓ Прочитано! Открылась новая мини-награда — '+monsters[index].word+'.');
 update();
}
function acceptCard(){
 if(phase!=='reward')return;
 if(index%2===1){phase='gear';say('Карточка получена! Прочитаны два имени — теперь найди защитный предмет в комнате.');}
 else {phase='ready';say('Карточка чудовища в твоём бестиарии! Продолжим чтение.');}
 update();
}
function collectGear(id){
 if(phase!=='gear')return;
 const need=equipment[Math.floor(index/2)];if(need.id!==id)return;
 gears.push(need);phase='ready';say(need.icon+' '+need.name+' в рюкзаке! '+need.description);
 if(index===monsters.length-1)complete();
 update();
}
function complete(){
 if(finished)return;finished=true;
 try{localStorage.setItem(gearStorage,JSON.stringify({items:gears.map(x=>x.id.toLowerCase()),count:gears.length}));localStorage.setItem(reward,'unlocked')}catch{}
 try{localStorage.setItem('tivvig_gnome_monster_cards_v1',JSON.stringify(monsters.map(x=>x.word)))}catch{}
 const grant=()=>{try{if(window.TivvigRegistry?.byReward?.[reward])window.TivvigRegistry.unlockReward(reward)}catch(err){console.warn('Gnome monster expert reward',err)}};
 if(window.TivvigRegistry?.byReward?.[reward])grant();
 else window.addEventListener('tivvig:registry-ready',grant,{once:true});
 say('Все чудовища изучены. Снаряжение собрано, гномы смогут подготовиться к ночи!');
}
function advance(){
 if(phase!=='ready'||finished)return;
 if(index===monsters.length-1){complete();update();return;}
 index++;selected=[];phase='assemble';say('Новое имя в книге чудовищ.');update();
}
function restart(){index=0;phase='assemble';selected=[];gears=[];finished=false;found=new Set();say('Книга открыта с самого начала.');update()}
buttons.forEach((b,i)=>b.addEventListener('click',()=>takeSyllable(i)));
$('undoSyllable').addEventListener('click',undo);
$('readConfirm').addEventListener('click',confirmReading);
$('rewardAccept').addEventListener('click',acceptCard);
$('nextMonster').addEventListener('click',advance);
$('restartLesson').addEventListener('click',restart);
for(const item of equipment)$('gear'+item.id).addEventListener('click',()=>collectGear(item.id));
update();
window.TivvigMonsterExpertDebug=Object.freeze({
 getState:()=>({index,phase,selected:[...selected],gears:gears.map(x=>x.id),found:[...found],finished}),
 words:monsters.map(x=>({word:x.word,parts:[...x.parts],order:[...x.order]})),reward
});
})();
</script>
<script src="game-runtime.js?v=1" defer></script>
</body>
</html>
