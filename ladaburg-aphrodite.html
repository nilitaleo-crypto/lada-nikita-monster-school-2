<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#a77d65">
<meta name="description" content="Храм Афродиты в Ладабурге: учим стих-пароль Даниила Хармса строка за строкой.">
<title>Храм Афродиты · Тиввиг</title>
<style>
:root{--ink:#64402a;--gold:#b27c42;--paper:#f4e3c4}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#d2a476}
body{font-family:Georgia,'Times New Roman',serif;color:#503221;overflow-x:hidden}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation;font:inherit}
button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #355943;outline-offset:3px}
[hidden]{display:none!important}
.temple{position:relative;isolation:isolate;width:min(100%,1800px);margin:auto;height:100dvh;min-height:520px;overflow:hidden;background:#f1d5ad url('images/temple-interior.webp') center center/cover no-repeat;box-shadow:0 0 50px #52301999}
.temple:after{position:absolute;inset:0;z-index:1;content:'';pointer-events:none;background:linear-gradient(to bottom,#fff3d52e 0%,transparent 20%,transparent 78%,#5033223d 100%)}
.topbar{position:absolute;top:clamp(10px,2.4vh,25px);left:clamp(10px,2vw,28px);right:clamp(10px,2vw,28px);z-index:25;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.back,.title-chip{display:inline-flex;align-items:center;min-height:46px;padding:8px 17px;border:2px solid #b2824a;border-radius:10px;background:#f6dfbce8;box-shadow:0 4px 12px #62432955;color:#473223;text-decoration:none;font-weight:bold;font-size:clamp(13px,1.65vw,19px);pointer-events:auto}
.title-chip{letter-spacing:.06em;justify-content:center;background:#3b4236de;color:#ffe8ba;border-color:#d5b277;white-space:nowrap}
.wall{position:absolute;z-index:4;left:16.6%;top:22%;width:45.5%;height:52%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:2% 2.8%;text-align:center;color:#62412a;text-shadow:0 1px #fff7d6b0}
.wall .sigil{font-size:clamp(23px,2.4vw,39px);color:#ba894c;margin-bottom:clamp(5px,2vh,17px);line-height:1;user-select:none}
.wall h1{font-weight:bold;letter-spacing:.15em;font-size:clamp(13px,1.4vw,20px);margin:0 0 clamp(7px,2vh,20px);color:#8d5c34}
.poem{width:100%;max-height:83%;display:flex;align-items:center;justify-content:center;overflow-y:auto;scrollbar-width:thin;min-height:0}
.poem-line{display:block;width:100%;font-size:clamp(20px,2.25vw,37px);white-space:nowrap;line-height:1.24;font-weight:600;text-wrap:balance;letter-spacing:-.024em;animation:lineReveal .28s ease-out both}
.poem-all{display:block;width:100%;white-space:pre-line;font-size:clamp(19px,1.62vw,28px);font-weight:600;line-height:1.38;letter-spacing:-.014em;animation:lineReveal .3s ease-out both}
.poem-complete{display:block;font-size:clamp(23px,2.5vw,43px);font-weight:bold;line-height:1.22;color:#6e452f;animation:lineReveal .3s ease-out both}
@keyframes lineReveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.line-counter{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:clamp(8px,2vh,24px);font:bold clamp(14px,1.4vw,19px) Georgia,serif;color:#9d6b3b}
.venus-portrait{position:absolute;z-index:5;right:8.5%;top:19%;height:61%;width:18%;margin:0;display:flex;align-items:center;justify-content:center;filter:drop-shadow(1px 7px 12px #5c342d8c)}
.venus-frame{position:relative;height:100%;max-height:660px;aspect-ratio:147/402;max-width:100%;border:clamp(5px,.75vw,11px) ridge #ba8b49;box-shadow:inset 0 0 0 2px #ffe1a3,0 0 0 4px #f2ca83,0 6px 20px #6c483d98;background:#b5cfc4;overflow:hidden;border-radius:45% 45% 7px 7px/13% 13% 7px 7px}
.venus-frame img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
.venus-caption{position:absolute;bottom:-25px;left:50%;transform:translateX(-50%);padding:5px 13px;font-weight:bold;font-size:clamp(12px,1.25vw,16px);white-space:nowrap;border-radius:8px;border:1px solid #d5ae74;background:#f7dfb4e6;color:#65412b;text-shadow:0 1px #fff7}
.lada{position:absolute;z-index:4;left:2.6%;bottom:5%;height:27%;max-width:16%;width:auto;object-fit:contain;object-position:bottom;filter:drop-shadow(2px 10px 8px #71452c88);pointer-events:none}
.controls{position:absolute;z-index:20;bottom:clamp(12px,3vh,35px);left:50%;transform:translateX(-50%);width:min(82%,930px);min-height:69px;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;padding:9px 12px;border-radius:18px;border:2px solid #b98849;background:#f5e5c6f2;box-shadow:0 8px 30px #50301e99}
.control{min-height:49px;min-width:clamp(110px,12vw,157px);padding:8px 17px;background:linear-gradient(145deg,#254d46,#263a32);border:2px solid #b79960;border-radius:12px;color:#fff1c8;font-weight:bold;font-size:clamp(14px,1.6vw,20px);box-shadow:0 3px 8px #1f2f2d51}
.control:hover{filter:brightness(1.15)}.control:active{transform:translateY(2px)}.control:disabled{opacity:.38;cursor:default;filter:grayscale(.5)}
.control.secondary{background:linear-gradient(145deg,#f9efd3,#e2c59c);color:#684728}
.control.finish{background:linear-gradient(145deg,#8e6537,#5d3d26)}
.lesson-hint{position:absolute;z-index:6;left:47%;bottom:14%;transform:translateX(-50%);font-size:clamp(11px,1.2vw,16px);font-style:italic;color:#785e3e;text-shadow:0 1px #ffe7bc9e;text-align:center;max-width:50%}
@media(max-width:900px) and (orientation:portrait){
 .temple{background-position:53% center}
 .wall{left:4%;top:12%;width:92%;height:49%;padding:4% 5%;border:3px solid #d1a26f;background:linear-gradient(145deg,#ffe7ccf7,#ecd0aeef);border-radius:19px;box-shadow:0 8px 20px #6b452955}
 .wall .sigil{margin-bottom:5px}.wall h1{margin-bottom:10px;font-size:clamp(13px,2.8vw,19px)}
 .poem-line{font-size:clamp(22px,4.1vw,35px)}.poem-all{font-size:clamp(19px,2.95vw,29px);line-height:1.35}
 .venus-portrait{right:10%;top:63%;height:22%;width:auto;aspect-ratio:147/402}.venus-caption{bottom:-17px;font-size:11px;padding:3px 7px}
 .lada{left:7%;bottom:11%;height:24%;max-width:23%}
 .controls{width:min(96%,720px);bottom:1%;gap:7px;padding:7px;min-height:58px}
 .control{min-height:45px;min-width:105px;padding:7px 10px;font-size:14px}
 .lesson-hint{display:none}
 .topbar{top:8px;left:8px;right:8px}.back,.title-chip{font-size:13px;padding:6px 9px;min-height:40px}
}
@media(max-width:600px) and (orientation:portrait){
 .wall{top:10%;height:56%;left:2%;width:96%;padding:15px 12px}
 .poem-line{font-size:clamp(18px,4.2vw,24px)}.poem-all{font-size:clamp(15px,4.1vw,22px);line-height:1.36}
 .wall h1{font-size:13px}.wall .sigil{font-size:20px}
 .venus-portrait{top:67%;right:14%;height:18%}.lada{bottom:12%;left:3%;height:21%}
 .controls{bottom:1.5%;width:98%;min-height:56px;flex-wrap:nowrap;gap:4px;padding:6px}
 .control{min-width:0;flex:1;padding:5px 4px;min-height:47px;font-size:clamp(12px,3.1vw,15px)}
 .title-chip{font-size:12px}
}
@media(max-height:600px) and (orientation:landscape){
 .wall{top:18%;height:59%}.wall .sigil{margin-bottom:5px}.wall h1{margin-bottom:7px}
 .poem-line{font-size:clamp(21px,3vw,33px)}.poem-all{font-size:clamp(13px,1.75vw,19px);line-height:1.2}
 .controls{bottom:1%;min-height:48px;padding:4px;gap:8px}.control{min-height:37px;font-size:15px}
 .venus-portrait{top:16%;height:65%}.venus-caption{bottom:-14px}
 .lada{bottom:6%;height:27%}.lesson-hint{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.observatory-route{display:inline-grid;place-items:center;text-align:center;text-decoration:none;background:linear-gradient(145deg,#355466,#1c3247);color:#fff1c8;border:2px solid #b79960;border-radius:12px;font-weight:bold;padding:8px 14px;min-height:49px;font-size:clamp(14px,1.6vw,20px)}</style>
</head>
<body>
<main class="temple" id="temple" aria-label="Храм Афродиты в Ладабурге">
 <header class="topbar"><a class="back" href="ladaburg.html?v=5" aria-label="Вернуться в Ладабург">← Ладабург</a><span class="title-chip">✦ ХРАМ АФРОДИТЫ ✦</span></header>
 <section class="wall" aria-label="Мраморная стена со стихотворением">
  <div class="sigil" aria-hidden="true">✦ ❦ ✦</div>
  <h1 id="wallHeading">СТИХ-ПАРОЛЬ</h1>
  <div class="poem" id="poem" aria-live="polite" aria-atomic="true"><span class="poem-line" id="verseText">Дремлет сокол. Дремлют пташки.</span></div>
  <div class="line-counter" id="lineCounter" aria-label="Строка 1 из 8">✦ 1 / 8 ✦</div>
 </section>
 <figure class="venus-portrait" aria-label="Афродита помогает учить стих">
  <div class="venus-frame"><img src="images/venus-botticelli.webp" width="294" height="804" alt="Венера с картины Сандро Боттичелли «Рождение Венеры», изображение предоставлено пользователем" draggable="false"></div>
  <figcaption class="venus-caption">Афродита</figcaption>
 </figure>
 <img class="lada" src="images/lada-cutout.webp" alt="Лада в храме" width="290" height="620" draggable="false">
 <div class="lesson-hint" id="hint">Читаем вслух по одной строке</div>
 <nav class="controls" aria-label="Изучение стихотворения">
  <button class="control secondary" id="back" type="button" disabled>← Назад</button>
  <button class="control secondary" id="all" type="button">Весь стих</button>
  <button class="control" id="next" type="button">Дальше →</button>
  <button class="control finish" id="learned" type="button" hidden>Я выучила ✦</button>
  <button class="control secondary" id="again" type="button" hidden>↻ Сначала</button>
  <a id="observatoryLink" class="observatory-route" href="ladaburg-observatory.html?v=2" hidden>🔭 К звёздам</a>
 </nav>
 <p id="gameConnection" hidden aria-live="polite"></p>
</main>
<script>
(()=>{'use strict';
const lines=[
 'Дремлет сокол. Дремлют пташки.',
 'Дремлют козы и барашки,',
 'А в траве в различных позах',
 'Спят различные букашки.',
 'Дремлет мостик над водой,',
 'Дремлет кустик молодой.',
 'Пятаков Борис Петрович',
 'Дремлет кверху бородой.'
];
const $=id=>document.getElementById(id), el={verse:$('verseText'),poem:$('poem'),counter:$('lineCounter'),heading:$('wallHeading'),back:$('back'),all:$('all'),next:$('next'),learned:$('learned'),again:$('again'),hint:$('hint')};
let position=0; // 0-7 individual verses, 8 = complete poem, 9 = marked learned
function paint(){
 const full=position===8,done=position===9;
 el.heading.textContent=done?'ПАРОЛЬ ВЫУЧЕН':full?'СТИХ ЦЕЛИКОМ':'СТИХ-ПАРОЛЬ';
 const text=done?'✦ Пароль запомнен ✦':full?lines.join('\n'):lines[position];
 const child=document.createElement('span');child.className=done?'poem-complete':full?'poem-all':'poem-line';child.textContent=text;
 el.poem.replaceChildren(child);
 el.poem.scrollTop=0;
 el.counter.hidden=done;
 el.counter.textContent=full?'✦ Весь стих ✦':'✦ '+(position+1)+' / 8 ✦';
 el.counter.setAttribute('aria-label',full?'Всё стихотворение':'Строка '+(position+1)+' из 8');
 el.back.disabled=position===0;
 el.next.hidden=full||done;
 el.all.hidden=full||done;
 el.learned.hidden=!full;
 el.again.hidden=!done; $('observatoryLink').hidden=!done;
 el.hint.hidden=full||done;
}
function mark(){try{if(window.TivvigRegistry?.unlockReward)window.TivvigRegistry.unlockReward('tivvig_reward_aphrodite_password_v1');else localStorage.setItem('tivvig_reward_aphrodite_password_v1','unlocked')}catch{}position=9;paint()}
el.back.addEventListener('click',()=>{if(position>0){position=position===9?8:position-1;paint()}});
el.next.addEventListener('click',()=>{if(position<8){position++;paint()}});
el.all.addEventListener('click',()=>{position=8;paint()});
el.learned.addEventListener('click',mark);
el.again.addEventListener('click',()=>{position=0;paint()});
document.addEventListener('keydown',ev=>{if(ev.key==='ArrowRight'&&position<8){ev.preventDefault();position++;paint()}else if(ev.key==='ArrowLeft'&&position>0){ev.preventDefault();position=position===9?8:position-1;paint()}});
paint();
window.__templeTest={getState:()=>({position,heading:el.heading.textContent,verse:el.poem.textContent,complete:position===9}),next:()=>el.next.click(),previous:()=>el.back.click(),showAll:()=>el.all.click(),learned:()=>el.learned.click(),restart:()=>el.again.click()};
})();
</script>
<script src="game-runtime.js?v=1" defer></script>
<script src="wardrobe.js?v=7" defer></script>
<script src="lada-avatar.js?v=1" defer></script>
</body>
</html>
