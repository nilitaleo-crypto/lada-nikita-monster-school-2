<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#33252f">
<meta name="description" content="Ладабург — столица Тиввига. Карта города для будущих приключений.">
<title>Ладабург — столица Тиввига</title>
<style>
:root{--bg:#211b25;--gold:#baa37b;--ivory:#f4e6ca;--wine:#422d37}
*{box-sizing:border-box}
body{min-height:100dvh;margin:0;padding:clamp(8px,2vw,24px);background:radial-gradient(ellipse at 50% 5%,#72515a,#332530 55%,var(--bg) 100%);font-family:Georgia,"Times New Roman",serif;color:var(--ivory)}
header{max-width:1500px;margin:0 auto 12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
header a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 17px;border:1px solid var(--gold);border-radius:10px;color:#fce9c9;background:rgba(38,25,33,.86);text-decoration:none;font-size:16px;font-weight:bold;touch-action:manipulation}
header a:hover,header a:focus-visible{background:#644b52;outline:2px solid #edcd91;outline-offset:2px}
header .location{letter-spacing:.12em;text-transform:uppercase;font-size:clamp(11px,1.6vw,15px);font-weight:bold}
main{max-width:1500px;margin:auto}
.scene{position:relative;overflow:hidden;border:clamp(4px,.7vw,9px) double var(--gold);border-radius:15px;box-shadow:0 18px 50px #100b15a8;line-height:0;background:linear-gradient(135deg,#c6ae9b,#e6dbbe)}
.scene img{display:block;width:100%;height:auto;aspect-ratio:1672/941;object-fit:contain;user-select:none;-webkit-user-drag:none}
.market-hotspot{position:absolute;z-index:4;left:16%;top:48%;width:19%;height:29%;display:block;border-radius:13px;cursor:pointer;touch-action:manipulation;background:linear-gradient(120deg,transparent 25%,#ffe4a31a 100%);border:2px solid transparent;transition:border-color .15s,background .15s}
.market-hotspot:hover,.market-hotspot:focus-visible{background:#f5e3b41c;border-color:#ffe5a3;outline:3px solid #633f50;outline-offset:2px}
.market-sign{position:absolute;bottom:0;left:50%;transform:translateX(-50%);white-space:nowrap;font:bold clamp(10px,1.3vw,18px) Georgia,serif;line-height:1.3;text-align:center;color:#392320;padding:5px 11px;border-radius:8px;border:2px solid #ad8353;background:#f5deb2ee;box-shadow:0 3px 7px #301d2988;pointer-events:none}
@media(max-width:680px){.market-hotspot{left:14%;top:47%;width:23%;height:33%}.market-sign{font-size:10px;white-space:normal;width:115px}}
.caption{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:14px auto 0;max-width:1500px;color:var(--ivory)}
.caption h1{font-size:clamp(22px,3vw,36px);font-weight:normal;margin:0;letter-spacing:.05em}
.caption p{font-size:clamp(13px,2vw,17px);line-height:1.5;margin:0;opacity:.85}
.note{margin-top:10px;text-align:center;font-size:13px;opacity:.8}
@media(max-width:600px){header{gap:8px}.scene{border-width:4px;border-radius:10px}.caption{display:block;text-align:center}.caption p{margin-top:7px}}

.bookshop-hotspot{position:absolute;z-index:6;left:4.6%;top:35.5%;width:11.5%;height:17.5%;display:block;border:2px solid transparent;border-radius:10px;touch-action:manipulation;background:#ffe4a30a;transition:background .15s,border-color .15s}
.bookshop-hotspot:hover,.bookshop-hotspot:focus-visible{background:#f5e3b42d;border-color:#ffe5a3;outline:2px solid #633f50;outline-offset:2px}
.bookshop-sign{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);white-space:nowrap;line-height:1.3;font:bold clamp(11px,1.4vw,17px) Georgia,serif;text-align:center;color:#392320;padding:4px 9px;border-radius:8px;border:2px solid #ad8353;background:#f5deb2ee;box-shadow:0 3px 7px #301d2988;pointer-events:none}
@media(max-width:680px){.bookshop-hotspot{left:4.6%;top:35.5%;width:11.5%;height:17.5%}.bookshop-sign{font-size:10px;white-space:normal;min-width:56px}}

.fountain-hotspot{position:absolute;z-index:5;left:41%;top:36%;width:18%;height:38%;display:block;border:2px solid transparent;border-radius:50%;cursor:pointer;touch-action:manipulation;background:radial-gradient(ellipse,#b4f7ff07,transparent 65%);transition:border-color .16s,background .16s}
.fountain-hotspot:hover,.fountain-hotspot:focus-visible{border-color:#fff0b6;background:#f9e6ab22;outline:2px solid #633f50;outline-offset:2px}
.fountain-sign{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);white-space:nowrap;line-height:1.3;font:bold clamp(11px,1.3vw,17px) Georgia,serif;color:#392320;padding:5px 10px;border-radius:8px;border:2px solid #ad8353;background:#f5deb2ef;box-shadow:0 3px 7px #301d2988;pointer-events:none}
@media(max-width:680px){.fountain-hotspot{left:39%;top:33%;width:21%;height:43%}.fountain-sign{font-size:10px;padding:3px 5px}}

.garden-hotspot{position:absolute;z-index:7;left:38%;top:46.7%;width:max(7%,44px);height:22%;transform:translateX(-50%);display:block;border:2px solid transparent;border-radius:32% 32% 10px 10px;touch-action:manipulation;cursor:pointer;background:linear-gradient(to bottom,#fee6b00a,#fee6b012);transition:background .15s,border-color .15s}
.garden-hotspot:hover,.garden-hotspot:focus-visible{background:#f7e2b22b;border-color:#ffe1a3;outline:2px solid #634153;outline-offset:2px}
.garden-sign{position:absolute;left:50%;bottom:0;transform:translateX(-50%);padding:5px 10px;background:#f5deb2f0;border:2px solid #ad8353;border-radius:8px;white-space:nowrap;color:#3b2826;font:bold clamp(10px,1.2vw,16px) Georgia,serif;line-height:1.3;box-shadow:0 3px 8px #271d237e;pointer-events:none}
@media(max-width:680px){.garden-hotspot{left:38%;top:46.7%;width:max(7%,44px);height:24%}.garden-sign{font-size:10px;padding:3px 5px}}

/* Two separate entry targets at the shop doorway: syllables and Hermes. */
.hermes-hotspot{position:absolute;z-index:6;left:4.6%;top:54%;width:11.5%;height:17.5%;display:block;border:2px solid transparent;border-radius:10px;touch-action:manipulation;background:#ffe4a30a;transition:background .15s,border-color .15s}
.hermes-hotspot:hover,.hermes-hotspot:focus-visible{background:#f5e3b42d;border-color:#ffe5a3;outline:2px solid #633f50;outline-offset:2px}
.hermes-sign{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);white-space:nowrap;line-height:1.3;font:bold clamp(11px,1.4vw,17px) Georgia,serif;text-align:center;color:#392320;padding:4px 9px;border-radius:8px;border:2px solid #ad8353;background:#f5deb2ee;box-shadow:0 3px 7px #301d2988;pointer-events:none}
@media(max-width:680px){.hermes-hotspot{left:4.6%;top:54%;width:11.5%;height:17.5%}.hermes-sign{font-size:10px;white-space:nowrap;padding:4px 5px}}

/* Entrance to the rotunda visible on the upper left-center of Ladaburg's city illustration. */
.temple-hotspot{position:absolute;z-index:6;left:29.3%;top:11.2%;width:12.7%;height:23.6%;display:block;border:2px solid transparent;border-radius:48% 48% 11px 11px;touch-action:manipulation;cursor:pointer;background:linear-gradient(180deg,#ffe0aa09,#ffe8b710);transition:background .16s,border-color .16s}
.temple-hotspot:hover,.temple-hotspot:focus-visible{background:#f4ddab30;border-color:#ffe6b6;outline:2px solid #624434;outline-offset:2px}
.temple-sign{position:absolute;left:50%;bottom:0;transform:translateX(-50%);white-space:nowrap;line-height:1.3;font:bold clamp(11px,1.3vw,17px) Georgia,serif;text-align:center;color:#392b22;background:#f5deb2ee;border:2px solid #ad8353;border-radius:8px;padding:4px 9px;box-shadow:0 3px 7px #301d2988;pointer-events:none}
@media(max-width:680px){.temple-hotspot{left:29%;top:11.2%;width:13.3%;height:23.6%}.temple-sign{font-size:10px;padding:3px 5px}}

/* Astronomer's tower, upper right of Ladaburg — separate from the central fountain. */
.observatory-hotspot{position:absolute;z-index:6;left:87.3%;top:31.6%;width:10.5%;height:34%;display:block;border:2px solid transparent;border-radius:34% 34% 9px 9px;touch-action:manipulation;background:linear-gradient(#ffe6ac08,#ffe6ac10);transition:border-color .16s,background .16s}
.observatory-hotspot:hover,.observatory-hotspot:focus-visible{border-color:#f9e4ae;outline:2px solid #463b61;outline-offset:2px;background:#fae4ad27}
.observatory-sign{position:absolute;left:50%;bottom:1%;transform:translateX(-50%);padding:5px 9px;white-space:nowrap;font:bold clamp(11px,1.25vw,16px) Georgia,serif;text-align:center;line-height:1.25;color:#392a22;background:#f5deb2f0;border:2px solid #ad8353;border-radius:8px;box-shadow:0 3px 8px #251d2388;pointer-events:none}
@media(max-width:680px){.observatory-hotspot{left:86.8%;top:31.6%;width:11%;height:35%}.observatory-sign{font-size:10px;padding:3px 5px}}

/* New location, isolated from established map targets. */
.fialka-hotspot{position:absolute;z-index:6;left:66.5%;top:49%;width:17.5%;height:22%;display:block;border:2px solid transparent;border-radius:18px;cursor:pointer;touch-action:manipulation;background:linear-gradient(160deg,#dfc3ff09,#7e51a521);transition:background .16s,border-color .16s}
.fialka-hotspot:hover,.fialka-hotspot:focus-visible{background:#bc82e84a;border-color:#f3dcff;outline:2px solid #53376b;outline-offset:2px}
.fialka-sign{position:absolute;bottom:0;left:50%;transform:translateX(-50%);color:#4a2e5f;background:#f9e9fcec;border:2px solid #bb8bc6;border-radius:9px;padding:5px 9px;text-align:center;line-height:1.24;white-space:nowrap;font:bold clamp(11px,1.3vw,17px) Georgia,serif;box-shadow:0 3px 9px #27132b8e;pointer-events:none}
@media(max-width:680px){.fialka-hotspot{left:65%;top:49%;width:19%;height:23%}.fialka-sign{padding:4px 5px;font-size:10px;white-space:normal;min-width:83px}}

/* New district gateway: outside all existing building hotspots. */
.oak-quarter-hotspot{position:absolute;right:1.8%;bottom:4%;z-index:10;display:flex;align-items:center;justify-content:center;min-height:52px;min-width:clamp(116px,18%,238px);max-width:25%;padding:9px 15px;white-space:normal;text-align:center;line-height:1.2;font:bold clamp(12px,1.65vw,22px) Georgia,serif;color:#50385f;text-decoration:none;border:3px solid #c39e71;border-radius:14px;background:linear-gradient(135deg,#fff4da,#e9d5f2);box-shadow:0 7px 14px #2d193e8a;touch-action:manipulation}
.oak-quarter-hotspot:hover,.oak-quarter-hotspot:focus-visible{background:#fff1b7;outline:3px solid #704ca1;outline-offset:2px}
@media(max-width:680px){.oak-quarter-hotspot{right:1%;bottom:2%;min-height:44px;min-width:86px;max-width:28%;padding:4px;font-size:11px;border-width:2px}}

/* Enter the Town Hall from the city map: no overlap with old doorways. */
.council-hotspot{position:absolute;left:61%;top:13%;width:20%;height:24%;z-index:11;display:flex;justify-content:center;align-items:flex-end;touch-action:manipulation;border:3px solid transparent;border-radius:35% 35% 12px 12px;background:radial-gradient(ellipse at 50% 74%,#f3db982c,transparent 72%);transition:background .18s,border-color .18s;text-decoration:none}
.council-hotspot:hover,.council-hotspot:focus-visible{border-color:#ffeba9;background:#eed29f65;outline:3px solid #5a4058;outline-offset:2px}
.council-sign{display:inline-flex;align-items:center;justify-content:center;min-height:36px;max-width:94%;padding:5px 8px;border-radius:10px;border:2px solid #b18b60;box-shadow:0 4px 8px #271d228e;color:#4c2c43;background:#fae7c8f0;text-align:center;font:bold clamp(12px,1.4vw,19px)/1.2 Georgia,serif;pointer-events:none}
@media(max-width:680px){.council-hotspot{left:59%;top:10%;width:22%;height:28%;border-width:2px}.council-sign{font-size:10px;padding:3px 5px;min-height:28px}}
</style>
</head>
<body>
<header>
<a href="index.html" aria-label="Вернуться на карту мира Тиввиг">← Карта Тиввига</a>
<span class="location">Тиввиг · Столица королевства</span>
</header>
<main>
<div class="scene">
<img src="images/ladaburg-city.webp" alt="Ладабург: светлая каменная столица с цветущими деревьями, лавками, библиотекой, театром, обсерваторией, фонтанами и далёким дворцом на горе" draggable="false" width="1672" height="941">
<a class="market-hotspot" href="ladaburg-market.html?v=2" aria-label="Войти в лавку удивительных плодов"><span class="market-sign">🍎 Лавка плодов</span></a>
<a class="bookshop-hotspot" href="ladaburg-bookshop.html?v=3" aria-label="Играть в поиск книг по слогам"><span class="bookshop-sign">🔤 Слоги</span></a>
<a class="hermes-hotspot" href="ladaburg-hermes-book.html?v=2" aria-label="Открыть книгу о Гермесе"><span class="hermes-sign">📖 Гермес</span></a>
<a class="temple-hotspot" href="ladaburg-aphrodite.html?v=1" aria-label="Войти в храм Афродиты и выучить стих-пароль"><span class="temple-sign">🏛️ Храм</span></a>
<a class="observatory-hotspot" href="ladaburg-observatory.html?v=2" aria-label="Войти в сказочную обсерваторию и запомнить звёзды"><span class="observatory-sign">🔭 Звёзды</span></a>
<a class="fountain-hotspot" href="ladaburg-fountain.html?v=3" aria-label="Войти к фонтану семи духов"><span class="fountain-sign">👻 Фонтан</span></a>
<a class="garden-hotspot" href="ladaburg-garden.html?v=2" aria-label="Войти в сад с призраками"><span class="garden-sign">🌿 Сад</span></a>
<a class="fialka-hotspot" href="ladaburg-fialka.html?v=1" aria-label="Войти в школу феи Фиалки и посмотреть рисунки Лады"><span class="fialka-sign">🎨 Школа Фиалки</span></a>
<a class="council-hotspot" href="ladaburg-council.html?v=1" aria-label="Войти в ратушу Ладабурга на военный совет четырёх друзей"><span class="council-sign">📜 Ратуша · Совет</span></a>
<a class="oak-quarter-hotspot" href="ladaburg-oak-quarter.html?v=1" aria-label="Перейти в новый Дубовый квартал Ладабурга">→ К дубу</a>
</div>
<div class="caption">
<h1>Ладабург</h1>
<p>Пока город встречает гостей. Скоро в его зданиях появятся приключения.</p>
</div>
<p id="gameConnection" class="note" aria-live="polite"></p>
</main>
<script src="game-runtime.js?v=1" defer></script>
</body>
</html>
