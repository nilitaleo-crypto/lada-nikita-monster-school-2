<title>Книжная лавка · Тиввиг</title><style>

.shelf:after{content:'';position:absolute;z-index:6;bottom:0;left:-17px;right:-17px;height:27px;border-radius:2px;background:linear-gradient(#a46f3b,#4e2b1b 64%,#25150e);box-shadow:inset 0 3px #e6b46f,inset 0 -4px #190d08,0 9px 12px #080604cf;border:1px solid #b7884f;pointer-events:none}

.book .ornament{position:absolute;top:11%;left:14%;right:14%;border-top:2px solid #e4bc72;box-shadow:0 2px #55381d}.book .ornament.bottom{top:auto;bottom:10%}.book:hover{transform:translateY(-10px);filter:brightness(1.15)}.book:active{transform:translateY(-3px)}.book .word{white-space:nowrap}
.book.wrong{animation:shake .42s ease;filter:saturate(.65)}@keyframes shake{0%,100%{transform:translateX(0)}27%{transform:translateX(-6px)}63%{transform:translateX(6px)}}
.book.chosen{z-index:9;transform:translateY(-15px) scale(1.05);filter:brightness(1.5) drop-shadow(0 0 14px #fff1b6)}

@keyframes rise{0%{transform:translateY(75px) scale(.45) rotate(-8deg);opacity:0}38%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-20px) scale(1.08);opacity:1}}
.magical-book:before{content:'';position:absolute;inset:0;border-radius:50%;background:#fff2b350;filter:blur(54px)}

.book-cover.left{right:50%;border-radius:20px 6px 5px 18px;transform:rotateY(70deg);animation:openLeft 1.1s .25s forwards}.book-cover.right{left:50%;border-radius:6px 20px 18px 5px;transform-origin:0 50%;transform:rotateY(-70deg);animation:openRight 1.1s .25s forwards}
@keyframes openLeft{to{transform:rotateY(-9deg)}}@keyframes openRight{to{transform:rotateY(9deg)}}
.book-cover:after{content:'';position:absolute;inset:12px 20%;border:2px solid #d2a267;border-radius:60%;background:repeating-linear-gradient(0deg,transparent 0 18px,#966a3b40 19px 20px)}

.spark{position:absolute;width:12px;height:12px;background:#ffefd1;border-radius:50%;box-shadow:0 0 18px 7px #ffe6a2;animation:drift 1.2s infinite alternate ease-in-out;left:var(--x);top:var(--y)}@keyframes drift{to{transform:translateY(-40px) scale(.6);opacity:.2}}
.reward{position:absolute;inset:0;z-index:70;display:none;justify-content:center;align-items:center;padding:25px;background:radial-gradient(ellipse at 50% 47%,#405020 0,#161f0e 70%,#080b06 100%)}
.reward.visible{display:flex;animation:rewardShow .45s ease both}@keyframes rewardShow{from{opacity:0}to{opacity:1}}
.reward-art{max-width:min(82%,760px);max-height:calc(100% - 20px);object-fit:contain;border:7px solid #73683b;border-radius:10px;box-shadow:0 0 0 2px #d1af65,0 18px 70px #000b,0 0 95px #a7a45035;animation:floatIn .85s ease both}@keyframes floatIn{from{transform:translateY(23px) scale(.96);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<body><div class="wrap"><main class="game" id="game" aria-label="Книжная лавка">

<button class="book" type="button" data-word="ВА-ЗА" aria-label="Книга ВА-ЗА" style="--bc:#a14e53;--bh:91%"><i class="ornament"></i><span class="word">ВА</span><span class="word">ЗА</span><i class="ornament bottom"></i></button>
<button class="book" type="button" data-word="ЖА-БА" aria-label="Книга ЖА-БА" style="--bc:#525981;--bh:95%"><i class="ornament"></i><span class="word">ЖА</span><span class="word">БА</span><i class="ornament bottom"></i></button>
<button class="book" type="button" data-word="РА-МА" aria-label="Книга РА-МА" style="--bc:#8a674a;--bh:87%"><i class="ornament"></i><span class="word">РА</span><span class="word">МА</span><i class="ornament bottom"></i></button>
</div>
<div class="shelf" role="group" aria-label="Нижняя полка">
<button class="book" type="button" data-word="ТУ-ЧА" aria-label="Книга ТУ-ЧА" style="--bc:#796b83;--bh:88%"><i class="ornament"></i><span class="word">ТУ</span><span class="word">ЧА</span><i class="ornament bottom"></i></button>
<button class="book" type="button" data-word="ЛИ-СА" aria-label="Книга ЛИ-СА" style="--bc:#82734a;--bh:84%"><i class="ornament"></i><span class="word">ЛИ</span><span class="word">СА</span><i class="ornament bottom"></i></button>
<button class="book" type="button" data-word="РЫ-БА" aria-label="Книга РЫ-БА" style="--bc:#6b627d;--bh:94%"><i class="ornament"></i><span class="word">РЫ</span><span class="word">БА</span><i class="ornament bottom"></i></button>
<button class="book" type="button" data-word="РО-ЗА" aria-label="Книга РО-ЗА" style="--bc:#945b47;--bh:90%"><i class="ornament"></i><span class="word">РО</span><span class="word">ЗА</span><i class="ornament bottom"></i></button>

</div>
</div>

<g fill="#e96b92"><circle cx="60" cy="138" r="8"/><circle cx="104" cy="174" r="11"/><circle cx="55" cy="239" r="10"/><circle cx="116" cy="281" r="11"/></g><g fill="#ecb837"><circle cx="60" cy="138" r="3"/><circle cx="104" cy="174" r="4"/><circle cx="55" cy="239" r="4"/><circle cx="116" cy="281" r="4"/></g></svg>

<script>

(()=>{
  'use strict';
  const TARGET='ЖА-БА';
  const library=document.getElementById('library');
  const opening=document.getElementById('bookOpening');
  const reward=document.getElementById('reward');
  const restart=document.getElementById('restart');
  const books=[...document.querySelectorAll('.book')];
  const lada=document.getElementById('ladaPhoto');
  const fallback=document.getElementById('ladaFallback');
  // On the actual GitHub Pages website, use the already local, versioned Lada asset.
  
  function showFallback(){lada.hidden=true;fallback.hidden=false;}
  lada.addEventListener('error', showFallback);
  lada.addEventListener('load',()=>{if(lada.naturalWidth>0){lada.hidden=false;fallback.hidden=true;}});
  if(lada.complete && lada.naturalWidth===0)showFallback();
  setTimeout(()=>{if(!lada.naturalWidth)showFallback()},1500);
  let phase='search';let rewardTimer=null;let wrongTimers=new Set();
  function wrong(book){
    if(phase!=='search')return;
    book.classList.remove('wrong');void book.offsetWidth;book.classList.add('wrong');
    let timer=setTimeout(()=>{book.classList.remove('wrong');wrongTimers.delete(timer)},480);wrongTimers.add(timer);
  }
  function win(book){
    if(phase!=='search')return;
    phase='opening';library.dataset.locked='true';books.forEach(b=>b.disabled=true);
    book.classList.add('chosen');opening.classList.add('is-visible');
    opening.setAttribute('aria-hidden','false');
    rewardTimer=setTimeout(()=>{
      if(phase!=='opening')return;
      phase='reward';reward.classList.add('visible');reward.setAttribute('aria-hidden','false');
      opening.classList.remove('is-visible');opening.setAttribute('aria-hidden','true');
      restart.focus({preventScroll:true});rewardTimer=null;
    },1750);
  }
  function reset(){
    if(rewardTimer!==null)clearTimeout(rewardTimer);rewardTimer=null;
    for(const t of wrongTimers)clearTimeout(t);wrongTimers.clear();
    phase='search';library.dataset.locked='false';
    books.forEach(b=>{b.disabled=false;b.classList.remove('wrong','chosen')});
    reward.classList.remove('visible');reward.setAttribute('aria-hidden','true');
    opening.classList.remove('is-visible');opening.setAttribute('aria-hidden','true');
    document.activeElement?.blur?.();
  }
  books.forEach(b=>b.addEventListener('click',()=> b.dataset.word===TARGET?win(b):wrong(b)));
  restart.addEventListener('click',reset);
  window.__bookshopTest={getPhase:()=>phase,reset};
})();

</script>
