<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#321a20">
<meta name="description" content="Тиввиг — книга приключений школы охотников на чудовищ Лады и Никиты.">
<title>Мир Тиввиг — атлас приключений</title>
<style>
:root{--wine:#50232b;--wine-dark:#2d181e;--gold:#c29a62;--ink:#39221d;--parchment:#eed4a5}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#1c1115}
body{font-family:Georgia,"Times New Roman",serif;color:var(--ink);overflow-x:hidden;background:
 radial-gradient(ellipse at 50% 25%,#65363c 0,#3e2029 45%,#190f13 100%)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;background:repeating-linear-gradient(93deg,transparent 0 4px,#d39d8016 4px 5px,transparent 5px 13px),repeating-linear-gradient(0deg,#0b060514 0 2px,transparent 2px 7px)}
a{color:inherit}
button{font:inherit}
button:focus-visible,a:focus-visible{outline:3px solid #f5cb77;outline-offset:3px}
.world{max-width:1580px;min-height:100dvh;margin:auto;padding:clamp(12px,2vw,30px) clamp(18px,2.7vw,45px) 20px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.masthead{font-size:clamp(10px,1.18vw,15px);letter-spacing:.22em;color:#dfb9a0;text-shadow:0 2px 3px #15090e;text-align:center;font-weight:bold;text-transform:uppercase}
.book{width:min(100%,1460px);aspect-ratio:1024/602;position:relative;isolation:isolate;filter:drop-shadow(0 22px 22px #08050695);background:transparent}
/* Page-and-binding fallback remains beneath the licensed book artwork. */
.book-fallback{position:absolute;inset:0;background:url("images/book-fallback.webp") center/100% 100% no-repeat;pointer-events:none}
.book-fallback::after{display:none}
.book-art{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:fill;z-index:1;pointer-events:none;filter:sepia(.14) saturate(.88) hue-rotate(-9deg)}
.book-toning{position:absolute;inset:3.5% 5.5% 2.5%;z-index:2;pointer-events:none;opacity:.42;border-radius:22px;background:linear-gradient(90deg,rgba(89,27,43,.14),transparent 12%,transparent 86%,rgba(89,27,43,.13)),radial-gradient(ellipse at 52% 120%,rgba(91,33,42,.18),transparent 55%)}
.spread{position:absolute;z-index:3;inset:8.8% 9.8% 9.2% 9.8%;display:grid;grid-template-columns:49.8% 50.2%;align-items:stretch;pointer-events:none}
.page{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;pointer-events:auto}
.page--left{padding:2.6% 6.5% 2.7% 3.5%}
.page--right{padding:2.6% 3.8% 2.7% 9%;display:flex;flex-direction:column;text-align:center;justify-content:center;gap:0}
.map-frame{position:relative;width:100%;max-width:min(100%,660px);border:3px solid #8b5b39;box-shadow:0 3px 0 #c99b5b,0 6px 18px rgba(64,30,27,.38);background:#2b4a53;transform:rotate(-.3deg)}
.map-frame::after{content:"";position:absolute;inset:-6px;box-shadow:inset 0 0 0 1px #6e442a;pointer-events:none}
.map-frame img{display:block;width:100%;height:auto;aspect-ratio:1/1;user-select:none;-webkit-user-drag:none}
.map-hit{position:absolute;display:block;transform:translate(-50%,-50%);background:transparent;border:0;padding:0;margin:0;cursor:pointer;border-radius:46%;touch-action:manipulation;appearance:none;-webkit-appearance:none}
.map-hit:focus-visible{outline:3px solid #f4c75d;outline-offset:-2px;background:#fcb64e24}
.map-hit.astraluna{left:24%;top:32%;width:29%;height:29%}
.map-hit.tristalia{left:66%;top:31%;width:31%;height:25%}
.map-hit.ladaburg{left:50%;top:54%;width:23%;height:23%}
.map-hit.forest{left:76%;top:72%;width:30%;height:26%}
.map-hit.vulcano{left:35%;top:77%;width:29%;height:27%}
.map-hit.vulcano::after{content:"";position:absolute;left:53%;top:52%;width:49%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:1px solid #ffd395b9;background:radial-gradient(circle,#ffdbaa5c 0,#ffbd6e3d 39%,transparent 76%);box-shadow:0 0 12px 7px #ffa93c65;animation:glow 2.6s ease-in-out infinite;pointer-events:none}
@keyframes glow{0%,100%{opacity:.6;box-shadow:0 0 9px 3px #ffa93c5e}50%{opacity:1;box-shadow:0 0 20px 12px #ffa93c93}}
.booktitle{font-size:clamp(21px,3.35vw,51px);color:#542b29;font-weight:normal;margin:0 0 .1em;line-height:1.03;letter-spacing:.03em}
.toprule{width:68%;max-width:250px;display:flex;align-items:center;gap:8px;color:#9e6f47;font-size:15px;margin:0 auto clamp(5px,.55vw,9px)}
.toprule::before,.toprule::after{content:"";height:1px;flex:1;background:#aa774c}
.subtitle{margin:0 0 clamp(5px,.75vw,13px);font-size:clamp(10px,1.1vw,15px);color:#7e5743;letter-spacing:.12em;text-transform:uppercase;font-weight:bold}
.meduza{display:block;position:relative;width:min(62%,220px);height:clamp(105px,16vw,217px);margin:0 auto clamp(5px,.6vw,11px);display:flex;align-items:center;justify-content:center}
.meduza::before{content:"";position:absolute;border:1px solid #ab754b80;border-radius:50%;width:77%;aspect-ratio:1;background:radial-gradient(circle,#d8b88769 0,transparent 65%)}
.meduza img{max-height:100%;max-width:100%;object-fit:contain;display:block;position:relative;filter:drop-shadow(1px 4px 3px #69463278)}
.divider{display:flex;align-items:center;gap:8px;width:70%;max-width:260px;color:#9f6841;margin:2px auto clamp(4px,.65vw,11px);font-size:17px}
.divider::before,.divider::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#9d704c,transparent)}
.quest{position:relative;width:100%;max-width:360px;margin:0 auto;padding:clamp(9px,1.15vw,17px) clamp(6px,1.4vw,21px);border:2px double #a37a54;background:linear-gradient(180deg,#f9edce20,#e6be8526);box-shadow:inset 0 0 0 3px #e2be9230}
.quest::before{content:"✣";position:absolute;left:50%;top:-14px;transform:translateX(-50%);color:#a47147;background:#ebcd9b;padding:0 8px;font-size:14px}
.quest-label{font-size:clamp(10px,1.1vw,14px);color:#805536;font-weight:bold;letter-spacing:.12em;text-transform:uppercase}
.quest h2{font-size:clamp(17px,2.15vw,30px);font-weight:normal;line-height:1.1;margin:6px 0;color:#5b3129}
.quest p{font-size:clamp(11px,1.18vw,16px);line-height:1.36;margin:0 auto clamp(7px,.75vw,12px);max-width:300px}
.go{display:inline-flex;align-items:center;justify-content:center;min-height:clamp(34px,3.7vw,47px);padding:6px clamp(13px,1.6vw,22px);background:linear-gradient(180deg,#783e41,#4d242e);color:#f8e6c8;text-decoration:none;text-transform:uppercase;letter-spacing:.09em;font-size:clamp(11px,1.16vw,15px);border:1px solid #b38757;box-shadow:0 3px 0 #9f754d}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 #9f754d}
.status{min-height:17px;margin:clamp(5px,.65vw,10px) auto 0;color:#875c45;font-size:clamp(10px,.92vw,13px);font-style:italic}
.collection{position:absolute;z-index:6;left:3.8%;top:50%;transform:translate(-5%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;width:clamp(37px,4.3vw,61px);min-height:clamp(116px,16vw,190px);background:linear-gradient(100deg,#27131b 0%,#75404b 45%,#3d1b26 100%);border:2px solid #bf9765;border-radius:10px 4px 4px 10px;text-decoration:none;color:#f7d7a3;box-shadow:inset 3px 0 0 #a97857,-3px 8px 12px #0c080a77}
.wardrobe-tab{position:absolute;z-index:7;right:3.8%;top:50%;transform:translate(5%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;width:clamp(37px,4.3vw,61px);min-height:clamp(116px,16vw,190px);background:linear-gradient(100deg,#27131b,#75404b 45%,#3d1b26);border:2px solid #bf9765;border-radius:4px 10px 10px 4px;text-decoration:none;color:#f7d7a3;box-shadow:inset -3px 0 0 #a97857,3px 8px 12px #0c080a77}
.wardrobe-tab .symbol{font-size:clamp(17px,2vw,25px)}.wardrobe-tab .label{writing-mode:vertical-rl;font-size:clamp(10px,1.15vw,14px);letter-spacing:.13em;font-weight:bold}
.home-lada img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;max-height:none;max-width:none}.home-lada [data-outfit-layer][hidden]{display:none}
.collection .symbol{font-size:clamp(17px,2vw,25px)}
.collection .label{writing-mode:vertical-rl;transform:rotate(180deg);font-size:clamp(10px,1.15vw,14px);letter-spacing:.13em;font-weight:bold}
.collection .count{background:#2c1722;font:11px system-ui,sans-serif;padding:4px;border-radius:7px}
.credit{font-size:10px;color:#c49e82;text-align:center;opacity:.8;margin:6px 0 0;line-height:1.4;letter-spacing:.02em}
.credit a{color:#e0bf8c}
@media(max-width:1050px){
 .world{padding:14px 15px 22px}
 .page--left{padding:2.8% 7.6% 2.8% 3.3%}
 .page--right{padding:2.6% 4.7% 2.5% 8.3%}
 .meduza{height:clamp(88px,14.4vw,165px)}
 .quest{padding:9px 9px}
}
@media(max-width:760px){
 .world{padding:14px 15px 22px}
 .book{width:min(100%,520px);aspect-ratio:auto;filter:drop-shadow(0 14px 15px #10080c9c);background:linear-gradient(90deg,#31191f 0,#70404c 4%,#4a242c 97%,#29191e 100%);border:3px solid #9d6c56;border-radius:12px 19px 23px 13px;padding:22px 21px 27px 29px;box-shadow:0 9px 0 #a07c61,0 15px 0 #49262a}
 .book-art,.book-toning,.book-fallback{display:none}
 .book::after{content:"";position:absolute;bottom:9px;left:25px;right:11px;height:10px;background:repeating-linear-gradient(0deg,#e2c898 0 2px,#af8c66 2px 3px,#f1d7ab 3px 5px)}
 .spread{position:relative;inset:auto;display:block;background:linear-gradient(90deg,#edd7b0 0,#f7e7c5 50%,#dec092 100%);border:1px solid #ac825a;box-shadow:inset 0 0 24px #8b5c3450}
 .page--left{padding:24px 17px;border-bottom:2px solid #b18b63}
 .page--right{padding:23px 16px 29px}
 .map-frame{max-width:440px}
 .booktitle{font-size:clamp(32px,7vw,43px)}
 .subtitle{font-size:12px}
 .meduza{height:185px}
 .quest{max-width:360px;padding:14px}
 .quest h2{font-size:27px}
 .quest p{font-size:15px}
 .go{font-size:14px;min-height:43px}
 .collection{left:-14px;top:31%;width:42px;min-height:135px}.wardrobe-tab{right:-14px;top:31%;width:42px;min-height:135px}
 .collection .label{font-size:11px}
 .status{font-size:12px}
}
@media(prefers-reduced-motion:reduce){.map-hit.vulcano::after{animation:none}}
</style>
</head>
<body>
<main class="world">
  <div class="masthead">✦ Мир Тиввиг ✦</div>
  <article class="book" aria-label="Старинный атлас Тиввига">
    <div class="book-fallback" aria-hidden="true"></div>
    <img class="book-art" src="https://opengameart.org/sites/default/files/book_12.png" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='images/book-fallback.webp'" alt="" aria-hidden="true">
    <div class="book-toning" aria-hidden="true"></div>
    <a class="collection" href="collection.html" aria-label="Открыть коллекцию наград">
      <span class="symbol" aria-hidden="true">✧</span>
      <span class="label">Коллекция</span>
      <span class="count" id="collectionCount">0/8</span>
    </a>
    <a class="wardrobe-tab" href="wardrobe.html" aria-label="Открыть наряды Лады"><span class="symbol" aria-hidden="true">♛</span><span class="label">Наряды</span></a>
    <div class="spread">
      <section class="page page--left" aria-label="Интерактивная карта Тиввига">
        <div class="map-frame">
          <img src="images/tivvig-map.webp" alt="Карта Тиввига" draggable="false">
          <button class="map-hit astraluna" type="button" data-place="astraluna" aria-label="Исследовать Астралуну"></button>
          <button class="map-hit tristalia" type="button" data-place="tristalia" aria-label="Исследовать Тристалию"></button>
          <button class="map-hit ladaburg" type="button" data-place="ladaburg" aria-label="Исследовать Ладабург"></button>
          <a class="map-hit vulcano" href="vulkan-labirint.html" aria-label="Начать экспедицию на вулкан Эмпедокла"></a>
          <a class="map-hit forest" href="michael-jackson-jungle.html" aria-label="Открыть джунгли Майкла Джексона и найти подруг"></a>
        </div>
      </section>
      <section class="page page--right" aria-label="Экспедиция на сегодня">
        <div class="toprule" aria-hidden="true">✥</div>
        <h1 class="booktitle">Мир Тиввиг</h1>
        <p class="subtitle">Атлас неведомых земель</p>
        <div class="meduza lada home-lada" id="homeLada"><img src="images/lada-cutout.webp" alt="Лада — проводница по Тиввигу"><img data-outfit-layer alt="" hidden></div>
        <div class="divider" aria-hidden="true">❦</div>
        <div class="quest">
          <div class="quest-label">Экспедиция на сегодня</div>
          <h2>Джунгли Майкла Джексона</h2>
          <p>🌸 🌿 Найди подруг среди цветов и волшебной пыльцы!</p>
          <a class="go" href="michael-jackson-jungle.html">Искать подруг →</a>
        </div>
        <p class="status" id="mapStatus" aria-live="polite">Выбери землю на карте…</p>
      </section>
    </div>
  </article>
  <p class="credit">Книжный ассет: MELLE (Melissa Krautheim), <a href="https://opengameart.org/content/epic-collection-book">CC0</a>.</p>
</main>
<script src="wardrobe.js"></script>
<script>
(()=>{
 'use strict';
 const status=document.getElementById('mapStatus');
 const setOutfit=()=>window.TivvigWardrobe?.equip(document.getElementById('homeLada'));
 setOutfit();window.addEventListener('pageshow',setOutfit);window.addEventListener('tivvig-outfit-changed',setOutfit);
 const places={
  astraluna:'Астралуна пока ждёт исследователей.',
  tristalia:'Тристалия ещё хранит свои тайны.',
  ladaburg:'Ладабург готовится встречать гостей.',
  forest:'Лес Майкла Джексона откроется позже.'
 };
 document.querySelectorAll('[data-place]').forEach(btn=>btn.addEventListener('click',()=>{
  const msg=places[btn.dataset.place];if(msg)status.textContent=msg;
 }));
 try{
  const keys=['tivvig_reward_maze_coins_v1','tivvig_reward_empedocles_v1','tivvig_reward_forge_v1','tivvig_reward_sword_v1','tivvig_reward_hydra_v1','tivvig_reward_jungle_friends_v1','tivvig_reward_merman_waterhouse_v1','tivvig_reward_vampire_nosferatu_v1'];
  const unlocked=keys.filter(k=>localStorage.getItem(k)==='unlocked').length;
  document.getElementById('collectionCount').textContent=unlocked+'/'+keys.length;
 }catch(e){}
})();
</script>
</body>
</html>
