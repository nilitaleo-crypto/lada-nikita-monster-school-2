<style>
:root{color-scheme:dark;--cream:#fff1d2;--gold:#e5bb79;--azure:#75e8ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#10121f}
body{font-family:Georgia,'Times New Roman',serif;color:var(--cream);background:radial-gradient(ellipse at top,#393149,#111523 65%)}

[hidden]{display:none!important}
.world{max-width:1500px;margin:0 auto;padding:9px clamp(8px,2vw,22px) 20px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;margin-bottom:9px}
.bar h1{font-size:clamp(21px,2.6vw,34px);font-weight:normal;color:var(--gold);margin:0}
.back{min-height:44px;border-radius:10px;background:#302b35;border:1px solid #a58866;padding:10px 13px;color:#fff0d1;text-decoration:none}

.scroll{width:min(100%,clamp(850px,calc((100dvh - 265px)*1.3333),1200px));margin-inline:auto;overflow-x:auto;border-radius:12px;border:5px ridge #967a58;background:#18212c;box-shadow:0 10px 24px #0009;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.scene{width:100%;min-width:850px;aspect-ratio:1448/1086;position:relative;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 70% 31%,#644039,#212530 52%,#101823)}
.art{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none;-webkit-user-drag:none}
.fallback-dog{display:none;position:absolute;right:8%;top:15%;font-size:180px;opacity:.45;z-index:0;pointer-events:none}
.scene::before{content:'';position:absolute;inset:0;background:linear-gradient(to top,#170f197a,transparent 43%,#060e1b20);z-index:1;pointer-events:none}
/* The printed bones in the illustration are decorative; these eight real, independently readable bones are the game pieces. */
.bone-pad{position:absolute;left:34%;top:49%;width:64%;height:40%;border-radius:42% 23% 12% 17%;background:radial-gradient(ellipse at 50% 55%,#312a25a8 0%,#32282384 53%,transparent 76%);z-index:2;pointer-events:none}
.bone{position:absolute;z-index:6;width:11%;height:6.2%;min-height:42px;border:0;background:transparent;color:#412a21;display:flex;align-items:center;justify-content:center;font:900 clamp(18px,2.25vw,33px)/1 system-ui,sans-serif;letter-spacing:.035em;text-shadow:0 1px #ffe6ba;filter:drop-shadow(0 5px 3px #100d10b5);touch-action:manipulation;transition:filter .18s,scale .18s;isolation:isolate}
.bone::before{content:'';position:absolute;inset:4% 14%;z-index:-1;background:linear-gradient(160deg,#fff1cf 3%,#e8c998 55%,#c18d5f 100%);border:2px solid #a77043;border-radius:32% / 46%;box-shadow:inset 0 2px 3px #fff9e5a8}
.bone::after{content:'';position:absolute;inset:-5% -4%;z-index:-2;background:radial-gradient(circle at 12% 20%,#f0dbb2 0 16%,transparent 17%),radial-gradient(circle at 12% 80%,#ead0a4 0 16%,transparent 17%),radial-gradient(circle at 88% 20%,#efdab4 0 16%,transparent 17%),radial-gradient(circle at 88% 80%,#dfbd8f 0 16%,transparent 17%)}
.bone:hover,.bone:focus-visible{scale:1.1;filter:drop-shadow(0 0 12px #ffe18d)}
.bone[disabled]{opacity:.28;filter:grayscale(.65);scale:.88;pointer-events:none}
.bone.busy{visibility:hidden}
.bone[data-slot="0"]{left:40%;top:52%;rotate:-5deg}.bone[data-slot="1"]{left:55%;top:51%;rotate:4deg}.bone[data-slot="2"]{left:70%;top:52%;rotate:-4deg}.bone[data-slot="3"]{left:85%;top:54%;rotate:4deg}
.bone[data-slot="4"]{left:43%;top:65%;rotate:5deg}.bone[data-slot="5"]{left:58%;top:66%;rotate:-6deg}.bone[data-slot="6"]{left:74%;top:66%;rotate:6deg}.bone[data-slot="7"]{left:88%;top:70%;rotate:-5deg}
.flying{position:absolute;z-index:12;width:11%;height:6.2%;min-height:42px;display:flex;align-items:center;justify-content:center;color:#4e2b13;font:900 clamp(18px,2.25vw,33px)/1 system-ui,sans-serif;pointer-events:none;filter:drop-shadow(0 0 9px #ffca59);isolation:isolate;animation:bone-fly .95s cubic-bezier(.28,.22,.3,1) forwards}
.flying::before{content:'';position:absolute;inset:4% 12%;z-index:-1;border:2px solid #b98d53;border-radius:35%;background:linear-gradient(#fff2cf,#d9ad74)}
.flying::after{content:'✦ ✧ ✦';position:absolute;top:-38%;left:10%;color:#ffe59a;font-size:26px;text-shadow:0 0 12px #ffd170}
@keyframes bone-fly{0%{transform:translate(0,0) rotate(0deg) scale(1)}48%{transform:translate(var(--mid-x),var(--mid-y)) rotate(16deg) scale(.84)}100%{transform:translate(var(--end-x),var(--end-y)) rotate(360deg) scale(.30);opacity:0}}
/* The sleeping face is a painted frame, not artificial eye ovals. */
.art-clever{z-index:1;opacity:0;transition:opacity 2s ease-in-out}
.scene[data-state="clever"] .art-clever{opacity:1}
.scene[data-state="clever"] .bone-pad{opacity:0}
.scene[data-state="clever"] .bark{left:2%;top:4%;max-width:40%;}
.math-board{position:absolute;inset:0;pointer-events:none;z-index:6}
.math-ground{position:absolute;left:35%;top:60%;width:63%;height:34%;border-radius:38%;background:radial-gradient(ellipse,#2e2229a1,#25202988 65%,transparent 80%)}
.math-zone{position:absolute;z-index:8;top:56%;width:21%;height:13%;border:2px solid #e9c590;border-radius:16px;color:#fff3db;background:linear-gradient(165deg,#4c3047e8,#201c31ee);font:bold clamp(13px,1.45vw,20px)/1.2 Georgia,serif;box-shadow:0 0 13px #130c18;pointer-events:auto;touch-action:manipulation}
.math-zone-a{left:45%}.math-zone-b{left:74%}
.math-zone-count{display:block;font:700 clamp(12px,1.35vw,17px)/1.15 system-ui,sans-serif;color:#a7e8f3;margin-top:3px}
.math-tokens{display:block;white-space:nowrap;overflow:hidden;font-size:clamp(12px,1.35vw,21px);line-height:1.2}
.math-label{position:absolute;left:37%;top:70%;width:60%;text-align:center;color:#ffe8c5;text-shadow:0 2px 6px #17111a;font:bold clamp(12px,1.35vw,18px) Georgia,serif}
.math-bone{position:absolute;z-index:9;width:11%;height:7.4%;min-height:45px;transform:translate(-50%,-50%);border:2px solid #a87a49;border-radius:48% 26% 36% 27%;background:linear-gradient(165deg,#fff1d3,#dfb680);box-shadow:0 4px 7px #1118,inset 0 2px 5px #fff8;touch-action:none;font-size:clamp(25px,2.6vw,40px);cursor:grab;user-select:none;display:flex;align-items:center;justify-content:center}
.math-bone.selected{outline:4px solid #72f5ec;filter:drop-shadow(0 0 10px #7bf7ff);background:#ffdeb0}
.math-bone:active{cursor:grabbing}
.math-route{position:absolute;z-index:4;left:0;top:0;width:1px;height:1px;border:0;opacity:0;pointer-events:none}
.math-question{font:bold 22px Georgia,serif;color:#d0f8f6;align-self:center}

/* Suspicious right head: four keys, one correct. */
.scene[data-state="suspicious"] .art-clever{opacity:1}
.scene[data-state="suspicious"] .bark{left:2%;top:4%;max-width:43%;border-color:#e5c992}
.scene[data-state="suspicious"] .bone-pad{opacity:0}
.key-option{position:absolute;z-index:9;width:14%;height:9%;min-height:52px;border:0;background:transparent;cursor:pointer;filter:drop-shadow(0 4px 8px #110d12aa)}
.key-option:hover,.key-option:focus-visible{transform:scale(1.05);filter:drop-shadow(0 0 10px #ffe18d)}
.key-head,.key-shaft,.key-teeth,.key-star{position:absolute;display:block}
.key-head{left:0;top:14%;width:32%;height:72%;border:4px solid #9b6e32;background:linear-gradient(#ffd58d,#dca45d)}
.key-head.round{border-radius:50%}
.key-head.square{border-radius:12%}
.key-head.diamond{width:26%;height:56%;left:3%;top:22%;transform:rotate(45deg);border-radius:8%}
.key-shaft{left:24%;top:40%;width:58%;height:18%;border-radius:10px;background:linear-gradient(#ffd58d,#dca45d);border:3px solid #9b6e32}
.key-teeth{right:0;top:39%;width:20%;height:23%}
.key-teeth::before,.key-teeth::after{content:'';position:absolute;right:0;background:#dca45d;border:3px solid #9b6e32;border-left:none;width:58%;height:92%}
.key-teeth::before{top:-55%}.key-teeth::after{top:52%}
.key-star{left:7%;top:-4%;font-size:22px;color:#ffef93;text-shadow:0 0 7px #fff0ab}
.key-option[data-key='0']{left:39%;top:73%}.key-option[data-key='1']{left:54%;top:71%}.key-option[data-key='2']{left:69%;top:74%}.key-option[data-key='3']{left:84%;top:72%}
.key-option.long .key-shaft{width:64%}.key-option.short .key-shaft{width:45%}.key-option.medium .key-shaft{width:55%}
.scene[data-bite='1']{animation:cerb-bite .28s linear 0s 3}
.scene[data-bite='1']::after{content:'ЩЁЛК!';position:absolute;left:58%;top:24%;z-index:20;color:#ffd7d7;background:#4b0d14d9;border:2px solid #ff9a7c;border-radius:14px;padding:8px 14px;font:bold clamp(22px,2.7vw,36px)/1 Georgia,serif;box-shadow:0 0 18px #000a}
@keyframes cerb-bite{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.bite-vortex{position:absolute;left:0;top:35%;width:39%;height:64%;z-index:20;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 45% 75%,#0b111df5 14%,#171720f0 44%,#161e25cc 62%,transparent 78%);color:#ffe2b7;text-shadow:0 0 12px #000;font:bold clamp(26px,4vw,60px) Georgia,serif;opacity:0;pointer-events:none}
.scene[data-bite='1'] .bite-vortex{animation:vortex-snap 1.3s ease-in-out forwards}
.bite-vortex strong{position:relative;z-index:4;font:inherit}
.bite-vortex::before,.bite-vortex::after{content:'';position:absolute;left:5%;right:5%;height:40%;z-index:3;background:linear-gradient(160deg,#312227,#11131e 65%);filter:drop-shadow(0 2px 9px #000c);border:3px solid #664637}
.bite-vortex::before{top:-37%;clip-path:polygon(0 0,100% 0,100% 62%,94% 100%,88% 62%,82% 100%,76% 62%,70% 100%,64% 62%,58% 100%,52% 62%,46% 100%,40% 62%,34% 100%,28% 62%,22% 100%,16% 62%,10% 100%,4% 62%,0 65%)}
.bite-vortex::after{bottom:-37%;clip-path:polygon(0 100%,100% 100%,100% 38%,94% 0,88% 38%,82% 0,76% 38%,70% 0,64% 38%,58% 0,52% 38%,46% 0,40% 38%,34% 0,28% 38%,22% 0,16% 38%,10% 0,4% 38%,0 35%)}
.scene[data-bite='1'] .bite-vortex::before{animation:cerb-upper 1.3s ease-in-out both}
.scene[data-bite='1'] .bite-vortex::after{animation:cerb-lower 1.3s ease-in-out both}
@keyframes cerb-upper{0%,100%{transform:translateY(0)}26%,62%{transform:translateY(175%)}}
@keyframes cerb-lower{0%,100%{transform:translateY(0)}26%,62%{transform:translateY(-175%)}}

@keyframes vortex-snap{0%,12%{opacity:0;transform:scale(.55)}27%,65%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.2)}}
@media(prefers-reduced-motion:reduce){.scene[data-bite='1'] .bite-vortex{animation:none;opacity:.75}}

/* In-scene, atmospheric whisper; no external gameplay panel. */
.bark{position:absolute;z-index:11;left:2%;top:5%;width:max-content;max-width:40%;padding:10px 14px;color:#fff1d6;text-shadow:0 2px 5px #070a11;font-size:clamp(16px,1.65vw,22px);line-height:1.28;text-align:left;pointer-events:none;border-radius:15px 18px 15px 6px;border:1px solid #d9b88655;background:linear-gradient(138deg,#241b20cd,#282b36a8);box-shadow:0 5px 18px #0006, inset 0 0 14px #e6b87c12;backdrop-filter:blur(3px)}
.scene-progress{display:block;margin-top:5px;color:#d4cab2;font:600 12px/1.3 system-ui,sans-serif;letter-spacing:.025em}
.scene-actions{position:absolute;left:50%;bottom:1%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;max-width:90%;padding:4px 7px;border-radius:20px;background:#16202ab8;box-shadow:0 3px 12px #0007}
.scene-actions:empty{display:none}
.action{display:inline-flex;align-items:center;justify-content:center;min-height:45px;min-width:0;padding:7px 13px;border:1px solid #c5a16e;border-radius:18px;background:linear-gradient(#f4e1af,#d1aa75);color:#29211b;font:bold 16px/1.15 Georgia,serif;text-decoration:none;white-space:normal}
.action.secondary{background:#303544;color:#f8e8cb}
.action[disabled]{opacity:.55;cursor:wait}
.math-question{font:bold 16px Georgia,serif;color:#d0f8f6;align-self:center;padding:0 5px}

/* Single-scene cast and captive friends. All six models are original site assets. */
.art-suspicious{z-index:1;opacity:0;transition:opacity 1.15s}
.scene[data-state="suspicious"] .art-clever{opacity:0}
.scene[data-state="suspicious"] .art-suspicious{opacity:1}
.rock-shade{position:absolute;left:0;bottom:0;width:40%;height:57%;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 40% 75%,#282335e8,#27212cba 60%,transparent 83%)}
.party{position:absolute;inset:0;z-index:5;pointer-events:none}
.party img{position:absolute;object-fit:contain;object-position:center bottom;filter:drop-shadow(2px 6px 4px #000b);user-select:none}
.party .ladamodel{position:absolute;left:3%;bottom:6%;width:17%;height:44%}
.party .ladamodel img{inset:0;width:100%;height:100%;object-fit:contain}
.ladamodel [data-outfit-layer][hidden],.ladamodel [data-outfit-face][hidden]{display:none}
.party .cat{left:16%;bottom:8%;width:11%;height:27%}.party .rabbit{left:25%;bottom:8%;width:9.5%;height:22%}.party .monkey{left:33%;bottom:8%;width:9%;height:23%}
.cage{position:absolute;z-index:14;left:5%;top:1%;width:27%;height:41%;pointer-events:none;filter:drop-shadow(0 9px 12px #000c);animation:cage-swing 4s ease-in-out infinite alternate;transform-origin:50% 0}
@keyframes cage-swing{to{transform:rotate(1.2deg)}}
.cage-people{position:absolute;left:19%;top:33%;width:62%;height:55%;display:flex;align-items:end;justify-content:center;overflow:hidden}
.cage-people img{width:50%;height:100%;object-fit:contain;object-position:50% 100%}
.cage-bars{position:absolute;inset:0;width:100%;height:100%}
.cage-door{transform-box:fill-box;transform-origin:left center;transition:transform 1.25s ease}
.scene[data-freed="yes"] .cage-door{transform:perspective(450px) rotateY(-112deg)}
.scene[data-freed="yes"] .cage-people{animation:rescued 1.2s ease forwards}
@keyframes rescued{to{transform:translateY(-13px)}}
.scene .bark{display:none}
.scene[data-state="clever"] .bark{display:block;left:43%;top:2%;bottom:auto;max-width:53%;padding:6px 13px;font-size:clamp(17px,1.65vw,23px);background:#1f2029ad}
.scene[data-state="suspicious"] .bark{display:block;left:37%;top:auto;bottom:1%;width:60%;max-width:60%;padding:8px 12px;border-radius:12px;text-align:center;background:#302328ef;border:1px solid #d3b47a;font-size:clamp(15px,1.5vw,21px)}
.scene[data-state="suspicious"] .scene-progress{display:none}
.scene[data-state="clever"] .scene-progress{font-size:11px}
.key-option,.key-option.long,.key-option.short,.key-option.medium{z-index:17;top:62%;width:15%;height:26%;min-height:110px;display:flex;align-items:center;justify-content:center;border:0;background:#231b2338;border-radius:14px;padding:3px;filter:drop-shadow(0 5px 6px #000b)}
.key-option svg{width:100%;height:100%;overflow:visible;pointer-events:none}
.key-option[data-key='0']{left:35%;top:60%}.key-option[data-key='1']{left:51%;top:62%}.key-option[data-key='2']{left:67%;top:62%}.key-option[data-key='3']{left:83%;top:62%}
.scene[data-state="suspicious"] .scene-actions{bottom:11%}
.cerberus-win{position:absolute;inset:0;z-index:50;background:#131729ed;display:flex;align-items:center;justify-content:center;animation:win-enter .7s ease}
.cerberus-win[hidden]{display:none!important}
.cerberus-win img{width:100%;height:100%;object-fit:contain;pointer-events:none}
.cerberus-win button{position:absolute;z-index:51;top:2%;right:2%;width:46px;height:46px;border:1px solid #ffdfa8;border-radius:50%;background:#33233ed9;color:#fff0d4;font:26px system-ui}
@keyframes win-enter{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.cage{animation:none}.cerberus-win{animation:none}}
@media(max-width:900px){.scene{min-width:850px}.bone,.flying{font-size:26px}.bar{justify-content:center}.bar h1{order:-1;width:100%;text-align:center}.hint{width:100%;text-align:center}}
@media(prefers-reduced-motion:reduce){.flying{animation-duration:.18s}.art-clever{transition:none!important}}
.cerberus-charon-next{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);z-index:26;display:flex;align-items:center;justify-content:center;min-height:46px;min-width:165px;padding:8px 17px;border:2px solid #f0d4a0;border-radius:15px;background:#2a2b37e8;color:#f8e3b5;font:700 19px Georgia,serif;text-decoration:none;box-shadow:0 6px 14px #0009}
</style>

const speech=document.getElementById('cerberusSpeech');
const tip=document.getElementById('cerberusTip');
const pageTitle=document.getElementById('cerberusPageTitle');
const award=document.getElementById('cerberusWin');
const outfit=()=>window.TivvigWardrobe?.equip(document.getElementById('cerberusLada'));
window.addEventListener('pageshow',outfit);
window.addEventListener('tivvig-outfit-changed',outfit);
window.addEventListener('DOMContentLoaded',outfit);
let rewardTimer=null,showReward=false;
const isCoop=new URLSearchParams(location.search).get('coop')==='1';
const SAVE='tivvig_cerberus_feeding_v1';
const SETS=[
 ['МА','МО','МУ','МИ','МЕ','СА','СО','СУ'],
 ['ЛА','ЛО','ЛУ','ЛИ','ЛЕ','РА','РО','РУ'],
 ['ВА','ВО','ВУ','ВИ','ВЕ','НА','НО','НУ'],
 ['ПА','ПО','ПУ','ПИ','ТА','ТО','ТУ','ТИ']
];
const PUZZLES=[
 {total:7,a:2,b:1,whoA:'Аид',whoB:'Голодная',labelA:'Аид украл',labelB:'Голодная съела',question:'У меня было 7 костей. Две украл Аид, ещё одну съела Голодная. Сколько осталось?',answers:[3,4,5]},
 {total:8,a:3,b:2,whoA:'Харон',whoB:'Летучие мыши',labelA:'Харон забрал',labelB:'Мыши унесли',question:'На берегу лежало 8 костей. Три забрал Харон, ещё две унесли летучие мыши. Сколько осталось?',answers:[2,4,3]},
 {total:9,a:2,b:2,whoA:'Умняшка',whoB:'Ловкач',labelA:'Умняшка спрятала',labelB:'Ловкач утащил',question:'На камне лежало 9 костей. Две спрятала Умняшка, ещё две утащил Ловкач. Сколько осталось?',answers:[4,5,6]}
];
const KEYS=[{length:'long',head:'round',star:false},{length:'medium',head:'diamond',star:false,correct:true},{length:'short',head:'square',star:true},{length:'medium',head:'round',star:false}];
if(new Set(SETS.flat()).size!==32)throw Error('Повторяющиеся слоги');
const initial=()=>({round:0,eaten:[],done:false,puzzle:0,placed:[],selected:-1,solved:false,finished:false,suspicious:false,keySolved:false});
let state=initial(),busy=false,flightTimer=null,settlingTimer=null,changingHeads=false,activeDrag=null,suppressTapId=null,biteTimer=null;
function validate(x){
 if(!x||!Number.isInteger(x.round)||x.round<0||x.round>4)return initial();
 const done=x.round===4||!!x.done;
 const puzzle=Number.isInteger(x.puzzle)?Math.max(0,Math.min(2,x.puzzle)):0;
 const total=PUZZLES[puzzle].total;
 const placed=Array.isArray(x.placed)?x.placed.filter(v=>v&&Number.isInteger(v.i)&&v.i>=0&&v.i<total&&(v.zone==='a'||v.zone==='b')).slice(0,total):[];
 const unique=[];const seen=new Set();for(const v of placed)if(!seen.has(v.i)){seen.add(v.i);unique.push(v)}
 const counts={a:unique.filter(v=>v.zone==='a').length,b:unique.filter(v=>v.zone==='b').length};
 const correct=counts.a===PUZZLES[puzzle].a&&counts.b===PUZZLES[puzzle].b;
 return {round:done?4:x.round,eaten:done?[]:Array.isArray(x.eaten)?[...new Set(x.eaten.filter(n=>Number.isInteger(n)&&n>=0&&n<8))]:[],done,puzzle,placed:unique,selected:-1,solved:!!x.solved&&correct,finished:!!x.finished&&done,suspicious:!!x.suspicious&&done,keySolved:!!x.keySolved&&!!x.suspicious&&done};
}
if(!isCoop)try{state=validate(JSON.parse(localStorage.getItem(SAVE)||'null'))}catch{state=initial()}
showReward=!!state.keySolved;
function save(){if(!isCoop)try{localStorage.setItem(SAVE,JSON.stringify(state))}catch{}}
let questionRestoreTimer=null;
function setStatus(text){speech.textContent=text;}
function print(){
 scene.dataset.bite='0';
 scene.dataset.freed=state.keySolved?'yes':'no';
 award.hidden=!showReward;
 outfit();
 const clever=state.done&&!state.suspicious;
 scene.dataset.state=state.suspicious?'suspicious':clever?'clever':'playing';
 field.replaceChildren();
 if(state.suspicious){renderSuspicious();return;}
 if(clever){renderClever();return;}
 pageTitle.textContent='Цербер: голодная голова';
 const set=SETS[state.round];
 for(let i=0;i<set.length;i++){
  const btn=document.createElement('button');btn.className='bone';btn.dataset.slot=String(i);btn.id='cerberus-bone-'+i;
  btn.type='button';btn.textContent=set[i];btn.setAttribute('aria-label','Прочитать '+set[i]+' и бросить косточку');
  if(state.eaten.includes(i)){btn.disabled=true;btn.setAttribute('aria-label',set[i]+' уже съедено')}
  field.appendChild(btn);
 }
 title.textContent='Голодная голова просит косточки';
 guide.textContent='Прочитай слог вслух и нажми на эту косточку. Цербер её поймает!';
 progress.textContent=(state.round+1)+'/4 · '+state.eaten.length+'/8 косточек';
 setStatus('');
 tip.textContent='В каждом раунде прочитай и брось все восемь косточек.';
 actions.replaceChildren();
}
function throwBone(i){
 if(busy||state.done||state.eaten.includes(i)||i<0||i>=SETS[state.round].length)return;
 const chosen=document.getElementById('cerberus-bone-'+i);if(!chosen)return;
 busy=true;
 const r=chosen.getBoundingClientRect(),sr=scene.getBoundingClientRect();
 const bone=document.createElement('div');bone.className='flying';bone.textContent=SETS[state.round][i];
 const left=r.left-sr.left,top=r.top-sr.top;
 const dx=sr.width*.63-(left+r.width*.5),dy=sr.height*.29-(top+r.height*.5);
 bone.style.left=left+'px';bone.style.top=top+'px';bone.style.setProperty('--mid-x',dx*.48+'px');bone.style.setProperty('--mid-y',(dy*.48-sr.height*.13)+'px');bone.style.setProperty('--end-x',dx+'px');bone.style.setProperty('--end-y',dy+'px');
 scene.appendChild(bone);chosen.classList.add('busy');chosen.disabled=true;
 setStatus('Ам! '+SETS[state.round][i]+'! Вкусно!');
 clearTimeout(flightTimer);
 flightTimer=setTimeout(()=>{
  bone.remove();state.eaten.push(i);busy=false;
  if(state.eaten.length===SETS[state.round].length){
   if(state.round===3){state.done=true;state.round=4;state.eaten=[];changingHeads=true}
   else{state.round++;state.eaten=[]}
  }
  save();print();
  if(changingHeads){clearTimeout(settlingTimer);settlingTimer=setTimeout(()=>{changingHeads=false;print()},2350)}
 },1000);
}
const count=zone=>state.placed.filter(p=>p.zone===zone).length;
const current=()=>PUZZLES[state.puzzle];
function renderClever(){
 pageTitle.textContent='Цербер: хитрая голова';
 if(changingHeads){
  title.textContent='Голодная голова засыпает…';
  guide.textContent='Голодная засыпает. Просыпается Хитрая!';
  progress.textContent='32/32 · Хр-р-р…';
  tip.textContent='Подожди, пока проснётся хитрая голова.';
  setStatus('Хр-р… Просыпается Хитрая!');actions.replaceChildren();return;
 }
 if(state.finished){
  title.textContent='Все загадки разгаданы!';
  guide.textContent='Проснулась правая голова.';
  progress.textContent='3/3 · Верно';
  tip.textContent='Впереди четыре ключа.';
  setStatus('Хм! А с ключами справишься?');
  actions.innerHTML='<button class="action" type="button" id="cerberusToSuspicious">К ключам →</button>';
  return;
 }
 const p=current(),a=count('a'),b=count('b'),placed=new Set(state.placed.map(x=>x.i));
 const undo=state.placed.length&&!state.solved?'<button class="action secondary" type="button" id="cerberusUndo" aria-label="Вернуть последнюю косточку">↶ Вернуть</button>':'';
 title.textContent='Хитрая голова — загадка '+(state.puzzle+1)+' из 3';
 guide.textContent=p.question;
 progress.textContent='Загадка '+(state.puzzle+1)+'/3 · Осталось '+(p.total-state.placed.length)+' из '+p.total;
 tip.textContent='Перетащи косточки пальцем в нужные места. Можно также нажать на косточку, а затем на место.';
 setStatus(state.solved?'✓ Верно!':p.total+' − '+p.a+' − '+p.b+' = ?');
 const zoneHtml=(zone,label,max,num)=>'<button type="button" class="math-zone math-zone-'+zone+'" data-zone="'+zone+'" id="cerberus-zone-'+zone+'" aria-label="'+label+'">'+label+'<span class="math-zone-count">'+num+' / '+max+'</span><span class="math-tokens">'+'🦴'.repeat(num)+'</span></button>';
 const board=document.createElement('div');board.className='math-board';board.id='cerberusMathBoard';
 board.innerHTML='<div class="math-ground" aria-hidden="true"></div>'+zoneHtml('a',p.labelA,p.a,a)+zoneHtml('b',p.labelB,p.b,b)+'<div class="math-label" hidden>Передвинь нужные косточки</div>';
 field.appendChild(board);
 const positions=[[42,75],[55,75],[68,75],[81,75],[38,86],[51,86],[64,86],[77,86],[88,86]];
 for(let i=0;i<p.total;i++){
  if(!placed.has(i)){
   const bone=document.createElement('button');bone.type='button';bone.id='cerberus-math-bone-'+i;
   bone.className='math-bone'+(state.selected===i?' selected':'');bone.dataset.mathBone=String(i);
   bone.textContent='🦴';bone.setAttribute('aria-label','Косточка '+(i+1)+', выбрать или перетащить');
   bone.style.left=positions[i][0]+'%';bone.style.top=positions[i][1]+'%';
   field.appendChild(bone);
  }
  for(const zone of ['a','b']){
   const route=document.createElement('button');route.type='button';route.className='math-route';route.id='cerberus-route-'+i+'-'+zone;
   route.dataset.routeBone=String(i);route.dataset.routeZone=zone;route.tabIndex=-1;route.setAttribute('aria-label','Переместить косточку '+(i+1));
   field.appendChild(route);
  }
 }
 if(state.solved){
  actions.innerHTML='<button class="action" type="button" id="cerberusMathNext">'+(state.puzzle===2?'Готово ✓':'Дальше →')+'</button>';
 }else if(a===p.a&&b===p.b){
  actions.innerHTML='<span class="math-question">Осталось?</span>'+p.answers.map(n=>'<button class="action math-answer" type="button" id="cerberus-answer-'+n+'" data-answer="'+n+'">'+n+'</button>').join('')+undo;
 }else{
  actions.innerHTML='<button class="action secondary" type="button" data-zone="a" id="cerberus-place-a">'+p.labelA+'</button><button class="action secondary" type="button" data-zone="b" id="cerberus-place-b">'+p.labelB+'</button>'+undo;
 }
}
function makeKeySvg(k){
const len=k.length==='long'?286:k.length==='short'?206:243;
const head=k.head==='round'?'<circle cx="55" cy="52" r="34"/><circle cx="55" cy="52" r="23" stroke-width="3"/>':k.head==='diamond'?'<path d="M55 12L95 56L55 97L15 56Z"/><path d="M55 27L79 56L55 82L31 56Z" stroke-width="3"/>':'<rect x="19" y="17" width="73" height="78" rx="9"/><rect x="32" y="30" width="47" height="52" rx="4" stroke-width="3"/>';
return '<svg viewBox="0 0 112 310" aria-hidden="true" focusable="false"><defs><linearGradient id="golden-'+k.head+k.length+'" x2=".8" y2="1"><stop stop-color="#fff0a7"/><stop offset=".45" stop-color="#c89448"/><stop offset=".73" stop-color="#805124"/><stop offset="1" stop-color="#eab96c"/></linearGradient></defs><g fill="url(#golden-'+k.head+k.length+')" stroke="#633f25" stroke-width="6" stroke-linejoin="round">'+head+'<rect x="44" y="88" width="23" height="'+(len-88)+'" rx="8"/><path d="M44 '+(len-41)+'H86V'+(len-26)+'H65V'+(len-12)+'H86V'+len+'H44Z"/><circle cx="55" cy="128" r="6" fill="#ffe9a1" stroke-width="2"/></g>'+(k.star?'<text x="35" y="63" fill="#7c4027" font-size="44">★</text>':'')+'</svg>';
}
function renderSuspicious(){
 pageTitle.textContent='Цербер: подозрительная голова';
 title.textContent=state.keySolved?'Ключ найден!':'Подозрительная голова';
 guide.textContent=state.keySolved?'Верно. Этот ключ подходит к воротам.':'Выбери правильный ключ.';
 progress.textContent=state.keySolved?'1 / 1':'4 ключа';
 tip.textContent=state.keySolved?'Подозрительная голова больше не мешает.':'Подсказки короткие: не самый длинный, не круглая головка, без звезды.';
 setStatus(state.keySolved?'Клетка открыта!':'Не самый длинный · не круглая головка · без звезды');
 
 KEYS.forEach((k,i)=>{
   const btn=document.createElement('button'); btn.type='button'; btn.className='key-option '+k.length; btn.dataset.key=String(i); btn.id='cerberus-key-'+i;
   btn.setAttribute('aria-label','Ключ '+(i+1));
   btn.innerHTML=makeKeySvg(k);
   if(state.keySolved) btn.disabled=true;
   field.appendChild(btn);
 });
 actions.innerHTML=state.keySolved?'<a class="action" href="hades-charon.html">⛵ К Харону →</a><button class="action secondary" id="cerberusRestart" type="button">↻ Сначала</button>':'';
}
function chooseKey(i){
 if(!state.suspicious||state.keySolved||busy)return;
 const key=KEYS[i]; if(!key)return;
 if(key.correct){
  state.keySolved=true;save();print();
  clearTimeout(rewardTimer);
  rewardTimer=setTimeout(()=>{showReward=true;award.hidden=false;try{window.TivvigRegistry?.unlockReward('tivvig_reward_cerberus_paper_rescue_v1')}catch{}},1600);
  return;
 }
 busy=true; scene.dataset.bite='1'; setStatus('ЩЁЛК! Цербер проглотил малышей!');
 clearTimeout(biteTimer); biteTimer=setTimeout(()=>{ busy=false; scene.dataset.bite='0'; print(); }, 1300);
}

function selectBone(i){
 if(!state.done||state.suspicious||changingHeads||state.finished||state.solved||i<0||i>=current().total||state.placed.some(x=>x.i===i))return;
 state.selected=i;save();renderSelection();
}
function renderSelection(){
 field.querySelectorAll('.math-bone').forEach(b=>b.classList.toggle('selected',Number(b.dataset.mathBone)===state.selected));
}
function placeBone(i,zone){
 const p=current();if(!state.done||state.suspicious||changingHeads||state.finished||state.solved||!(zone==='a'||zone==='b')||i<0||i>=p.total)return;
 if(state.placed.some(x=>x.i===i)||count(zone)>=p[zone])return;
 state.placed.push({i,zone});state.selected=-1;save();print();
}
function undoMath(){
 if(!state.done||state.suspicious||changingHeads||state.finished||state.solved||!state.placed.length)return;
 state.placed.pop();state.selected=-1;save();print();
}
function advanceMath(){
 if(!state.done||state.suspicious||!state.solved||state.finished)return;
 if(state.puzzle===2){state.finished=true;}else{state.puzzle++;state.placed=[];state.selected=-1;state.solved=false;}
 save();print();
}
function answerMath(n){
 const p=current();if(!state.done||state.suspicious||changingHeads||state.finished||state.solved||count('a')!==p.a||count('b')!==p.b)return;
 if(n===p.total-p.a-p.b){state.solved=true;save();print();}
 else{
  setStatus('Попробуй ещё раз!');
  clearTimeout(questionRestoreTimer);
  const puzzleAtFailure=state.puzzle;
  questionRestoreTimer=setTimeout(()=>{if(state.done&&!state.finished&&state.puzzle===puzzleAtFailure)speech.textContent=current().question},1250);
 }
}
field.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.slot!==undefined){throwBone(Number(b.dataset.slot));return;}
 if(b.dataset.routeBone!==undefined){placeBone(Number(b.dataset.routeBone),b.dataset.routeZone);return;}
 if(b.dataset.key!==undefined){chooseKey(Number(b.dataset.key));return;}
 if(b.dataset.mathBone!==undefined){selectBone(Number(b.dataset.mathBone));return;}
 if(b.dataset.zone&&state.selected>=0){placeBone(state.selected,b.dataset.zone);return;}
});
actions.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.id==='cerberusRestart'){clearTimeout(flightTimer);clearTimeout(settlingTimer);clearTimeout(biteTimer);clearTimeout(rewardTimer);showReward=false;busy=false;changingHeads=false;state=initial();save();print();return;}
 if(b.id==='cerberusToSuspicious'){state.suspicious=true;save();print();return;}
 if(b.id==='cerberusMathNext'){advanceMath();return;}
 if(b.id==='cerberusUndo'){undoMath();return;}
 if(b.dataset.answer!==undefined){answerMath(Number(b.dataset.answer));return;}
 if(b.dataset.zone&&state.selected>=0){placeBone(state.selected,b.dataset.zone);return;}
});
// Pointer drag is local input; a co-op drag is converted to a deterministic remote click.
// Tapping the bone and a destination remains available for keyboard and all touch devices.
document.getElementById('cerberusWinClose').addEventListener('click',()=>{showReward=false;award.hidden=true});
field.addEventListener('pointerdown',e=>{
 const b=e.target.closest('.math-bone');if(!b||e.button!==0||!state.done||state.suspicious||changingHeads||state.solved)return;
 activeDrag={id:Number(b.dataset.mathBone),pointer:e.pointerId,x:e.clientX,y:e.clientY,moved:false,el:b};
 try{b.setPointerCapture(e.pointerId)}catch{}
});
field.addEventListener('pointermove',e=>{
 const d=activeDrag;if(!d||d.pointer!==e.pointerId)return;
 const dx=e.clientX-d.x,dy=e.clientY-d.y;
 if(Math.hypot(dx,dy)>9)d.moved=true;
 if(d.moved){e.preventDefault();d.el.style.transform='translate('+dx+'px,'+dy+'px) scale(1.12)';d.el.style.zIndex='28'}
});
function finishDrag(e){
 const d=activeDrag;if(!d||d.pointer!==e.pointerId)return;
 activeDrag=null;d.el.style.transform='';d.el.style.zIndex='';
 if(!d.moved)return;
 suppressTapId=d.id;
 const targets=[...field.querySelectorAll('.math-zone')];
 const drop=targets.find(el=>{const r=el.getBoundingClientRect();return e.clientX>=r.left-15&&e.clientX<=r.right+15&&e.clientY>=r.top-15&&e.clientY<=r.bottom+15});
 if(!drop)return;
 const zone=drop.dataset.zone;
 if(isCoop){
  window.dispatchEvent(new CustomEvent('tivvig:request-click',{detail:{selector:'#cerberus-route-'+d.id+'-'+zone}}));
 }else placeBone(d.id,zone);
}
field.addEventListener('pointerup',finishDrag);
field.addEventListener('pointercancel',e=>{if(activeDrag&&activeDrag.pointer===e.pointerId){activeDrag.el.style.transform='';activeDrag=null;}});
document.addEventListener('click',e=>{
 if(suppressTapId===null)return;
 const bone=e.target.closest('.math-bone');if(bone&&Number(bone.dataset.mathBone)===suppressTapId){e.preventDefault();e.stopImmediatePropagation();}
 suppressTapId=null;
},true);
window.TivvigCerberusDebug=Object.freeze({state:()=>JSON.parse(JSON.stringify({...state,busy,changingHeads})),totalSyllables:SETS.flat(),reset:()=>{clearTimeout(flightTimer);clearTimeout(settlingTimer);clearTimeout(biteTimer);busy=false;changingHeads=false;scene.dataset.bite='0';state=initial();save();print()},throwBone,placeBone,answerMath,advanceMath,chooseKey,skipToClever:()=>{clearTimeout(flightTimer);busy=false;changingHeads=false;state={...initial(),round:4,done:true};save();print();},skipToKeys:()=>{state={...initial(),round:4,done:true,finished:true,suspicious:true};save();print();}});
print();
})();
</script>
<script src="hades-sounds.js?v=1" defer></script>
<script src="game-runtime.js?v=5" defer></script>
</body></html>
