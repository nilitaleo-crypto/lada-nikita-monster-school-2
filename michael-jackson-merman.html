<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d3635">
<meta name="description" content="Тиввиг — спасение русала в джунглях Майкла Джексона. Восемь ведёр со слогами.">
<title>Спасение русала — джунгли Майкла Джексона</title>
<style>
:root{--cream:#fff0c9;--ink:#3a2330;--gold:#d4a55c;--paper:#f7e2b4}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0e201d}
body{font-family:Georgia,'Times New Roman',serif;color:var(--cream);overflow-x:hidden;background:radial-gradient(ellipse at top,#385b51 0%,#1a3433 48%,#0d1f1c 100%)}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible{outline:3px solid #ffde80;outline-offset:3px}
main{min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:8px;padding:clamp(7px,1.4vw,15px) 12px 14px}
.top{width:min(1100px,100%);display:flex;align-items:center;justify-content:space-between;gap:10px}
.back,.reset,.small-link{min-height:39px;padding:7px 14px;border:1.5px solid #d5a86e;border-radius:12px;background:linear-gradient(180deg,#f5ddae,#cba875);color:#432b27;box-shadow:0 3px 0 #120f0c;font-size:clamp(12px,1.4vw,15px);font-weight:bold}
.top h1{font-size:clamp(18px,2.5vw,30px);font-weight:normal;text-align:center;margin:0;color:#f9e0ae;text-shadow:0 3px 8px #041d1b}
.subtitle{font-size:clamp(12px,1.5vw,16px);letter-spacing:.08em;color:#ffe4ac;text-align:center;margin:0}
.stage{position:relative;isolation:isolate;aspect-ratio:1122 / 1402;width:min(98vw,calc((100dvh - 152px)*.8),680px);max-width:100%;flex-shrink:0;border:clamp(3px,.5vw,6px) solid #c99d55;border-radius:clamp(12px,1.8vw,20px);box-shadow:0 0 0 2px #4c3226,0 16px 38px #0007;overflow:hidden;background:#32453e;user-select:none;touch-action:manipulation}
.scene{display:block;width:100%;height:100%;object-fit:fill;pointer-events:none}
.stage:after{content:'';position:absolute;inset:0;pointer-events:none;z-index:2;box-shadow:inset 0 0 32px #132c2b70}
.bucket{position:absolute;z-index:6;border:0;background:transparent;border-radius:22%;padding:0;color:transparent;touch-action:manipulation;transition:background .25s,transform .25s;cursor:pointer}
.bucket:not([disabled]):hover{background:#fff9ae1c}
.bucket:not([disabled]):active{transform:scale(.94)}
.bucket[disabled]{cursor:default}
.bucket[disabled]::before{content:'';position:absolute;inset:5%;border-radius:26%;background:#182f3458}
.bucket[disabled]::after{content:'✓';position:absolute;top:32%;left:50%;transform:translate(-50%,-50%);display:grid;place-items:center;width:35%;aspect-ratio:1;border-radius:50%;background:#debf78eb;color:#31544b;border:2px solid #fff1b4;box-shadow:0 2px 8px #2336;font:bold clamp(17px,4vw,37px)/1 system-ui,sans-serif}
.water-surface{position:absolute;z-index:3;left:28%;width:46%;bottom:26.5%;height:24%;border-radius:46% 45% 16% 15%;background:linear-gradient(0deg,#2ca5beaa,#c5f9e066 40%,#d3fff11b 80%,transparent);transform:scaleY(var(--fill,0));transform-origin:bottom;mix-blend-mode:screen;pointer-events:none;transition:transform .8s cubic-bezier(.17,.67,.43,1)}
.hydration{position:absolute;z-index:3;top:30%;left:29%;width:48%;height:32%;background:radial-gradient(ellipse,#7decf1aa,transparent 70%);opacity:var(--glow,0);pointer-events:none;mix-blend-mode:screen;transition:opacity .8s}
.splash-layer{position:absolute;inset:0;z-index:8;pointer-events:none;width:100%;height:100%}
.spurt{fill:none;stroke:#b2f4ff;stroke-width:1.9;stroke-linecap:round;filter:drop-shadow(0 0 2px #d7ffff);animation:waterPath 1.1s ease-in-out both}
@keyframes waterPath{0%{stroke-dashoffset:var(--len);opacity:0}18%{opacity:1}74%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.bubble{position:absolute;z-index:9;pointer-events:none;left:51%;top:53%;border-radius:50%;width:clamp(7px,1.6vw,15px);height:clamp(7px,1.6vw,15px);background:#c4f5ffb9;box-shadow:0 0 8px #b6fff9;animation:floatUp 1.1s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-160px) scale(1.7)}}
.tracker{width:min(670px,100%);display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px}
.drop{font-size:clamp(16px,2.7vw,26px);display:grid;place-items:center;width:clamp(28px,4vw,39px);height:clamp(28px,4vw,39px);border-radius:50%;background:#204d52;border:1px solid #8fb2aa;filter:grayscale(1);opacity:.6}
.drop.full{filter:none;opacity:1;background:#d1f0ee;border-color:#fff;box-shadow:0 0 10px #6febff94}
.status{margin:1px 0 0;max-width:750px;text-align:center;color:#ffe5a9;font-size:clamp(12px,1.5vw,16px);line-height:1.3}
.modal[hidden]{display:none}
.modal{position:fixed;inset:0;z-index:100;background:#071a19e9;display:flex;justify-content:center;align-items:center;padding:clamp(9px,2vw,22px);overflow-y:auto}
.modal-card{position:relative;max-width:min(900px,100%);width:fit-content;max-height:calc(100dvh - 24px);display:flex;align-items:center;flex-direction:column;gap:8px;background:linear-gradient(#e9d19b,#bd975c);color:#38261e;padding:clamp(12px,2vw,20px);border:3px ridge #fff0ac;border-radius:16px;box-shadow:0 15px 70px #000c;overflow:auto}
.modal-card h2{font:normal clamp(20px,3vw,34px) Georgia,serif;text-align:center;margin:0}
.modal-card img{width:auto;height:auto;max-width:100%;max-height:min(72dvh,800px);object-fit:contain;box-shadow:0 3px 10px #0005;border:2px solid #ab7d4b}
.modal-actions{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px}
.action{min-height:44px;border:2px solid #ba874e;border-radius:11px;padding:10px 17px;background:#422b34;color:#ffeed0;text-align:center;font:bold clamp(13px,1.8vw,17px) Georgia,serif;box-shadow:0 3px 0 #21141a}
.action.secondary{background:#fae8c6;color:#412e28}
.credit{font-size:12px;text-align:center;margin:2px 0;color:#524135}
@media(max-width:500px){.top h1{font-size:17px}.stage{width:min(98vw,calc((100dvh - 150px)*.8))}.top{gap:5px}.back,.reset{font-size:11px;padding:5px 9px}.modal-card img{max-height:65dvh}}
@media(prefers-reduced-motion:reduce){.spurt,.bubble{animation-duration:.05s}.water-surface,.hydration,.bucket{transition:none}}
</style>
</head>
<body>
<main>
  <header class="top">
    <a class="back" href="michael-jackson-jungle.html" aria-label="Назад к первой игре">← Подружки</a>
    <h1>🌊 Спасение русала</h1>
    <a class="back" href="index.html" aria-label="Вернуться на карту Тиввига">🗺️ Карта</a>
  </header>
  <p class="subtitle">Восемь вёдер — восемь слогов</p>
  <section id="stage" class="stage" aria-label="Восемь вёдер со слогами вокруг русала в сундуке">
    <img class="scene" src="images/merman-buckets.webp" width="1122" height="1402" alt="Русал в сундуке посреди джунглей; вокруг восемь ведер с крупными слогами ВА, ВО, ВИ, ВУ, ВЕ, ВЫ, ВЯ, ВЮ" draggable="false">
    <div id="waterSurface" class="water-surface" aria-hidden="true"></div>
    <div id="hydration" class="hydration" aria-hidden="true"></div>
    <svg id="splash" class="splash-layer" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
    <button class="bucket" type="button" data-syllable="ВА" style="left:22%;top:16.7%;width:24%;height:16.3%" aria-label="Ведро ВА"></button>
    <button class="bucket" type="button" data-syllable="ВО" style="left:53.4%;top:16.7%;width:23.7%;height:16.1%" aria-label="Ведро ВО"></button>
    <button class="bucket" type="button" data-syllable="ВИ" style="left:1.3%;top:29.5%;width:24%;height:19.2%" aria-label="Ведро ВИ"></button>
    <button class="bucket" type="button" data-syllable="ВУ" style="left:74.1%;top:29.7%;width:24.8%;height:19.2%" aria-label="Ведро ВУ"></button>
    <button class="bucket" type="button" data-syllable="ВЕ" style="left:1.9%;top:49%;width:23.5%;height:19.1%" aria-label="Ведро ВЕ"></button>
    <button class="bucket" type="button" data-syllable="ВЫ" style="left:73.7%;top:49.5%;width:25.5%;height:18.6%" aria-label="Ведро ВЫ"></button>
    <button class="bucket" type="button" data-syllable="ВЯ" style="left:19.3%;top:68.1%;width:25.5%;height:18.6%" aria-label="Ведро ВЯ"></button>
    <button class="bucket" type="button" data-syllable="ВЮ" style="left:54%;top:68.2%;width:25.3%;height:18.6%" aria-label="Ведро ВЮ"></button>
  </section>
  <div class="tracker" id="tracker" role="status" aria-live="polite" aria-label="Использовано 0 из 8 вёдер">
    <span class="drop">💧</span><span class="drop">💧</span><span class="drop">💧</span><span class="drop">💧</span>
    <span class="drop">💧</span><span class="drop">💧</span><span class="drop">💧</span><span class="drop">💧</span>
    <button class="reset" id="restart" type="button" aria-label="Начать восемь вёдер сначала">↻ Сначала</button>
  </div>
  <p class="status" id="status" aria-live="polite">Выбирай ведро — и произноси слог!</p>
</main>

<div id="transformation" class="modal" role="dialog" aria-modal="true" aria-labelledby="transTitle" hidden>
  <div class="modal-card">
    <h2 id="transTitle">✨ Русал спасён!</h2>
    <img src="images/merman-transformation.webp" width="1122" height="1402" alt="Сильный русал с трезубцем поднимается из воды среди джунглей">
    <div class="modal-actions">
      <button class="action" id="showReward" type="button">🏆 Награда</button>
      <button class="action secondary" id="repeatTransform" type="button">↻ Ещё раз</button>
    </div>
  </div>
</div>

<div id="prize" class="modal" role="dialog" aria-modal="true" aria-labelledby="prizeTitle" hidden>
  <div class="modal-card">
    <h2 id="prizeTitle">🏆 Награда</h2>
    <img src="images/waterhouse-mermaid-original.webp" width="1408" height="2048" alt="Джон Уильям Уотерхаус, Русалка, 1900. Оригинальная живопись">
    <p class="credit">Джон Уильям Уотерхаус · «Русалка», 1900</p>
    <div class="modal-actions">
      <a class="action" href="michael-jackson-vampire.html">🦇 Побег от вампира →</a><a class="action" href="collection.html">✦ Коллекция</a>
      <button class="action secondary" id="repeatPrize" type="button">↻ Ещё раз</button>
      <a class="action secondary" href="index.html">🗺️ Карта</a>
    </div>
  </div>
</div>

<script>
(()=>{
 'use strict';
 const stage=document.getElementById('stage');
 const buckets=[...stage.querySelectorAll('.bucket')];
 const drops=[...document.querySelectorAll('.drop')];
 const tracker=document.getElementById('tracker');
 const status=document.getElementById('status');
 const splash=document.getElementById('splash');
 const transformation=document.getElementById('transformation');
 const prize=document.getElementById('prize');
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 let count=0,completed=false,pending=null;
 function show(el){el.hidden=false;document.body.style.overflow='hidden';}
 function hideAll(){transformation.hidden=true;prize.hidden=true;document.body.style.overflow='';}
 function progress(){
   drops.forEach((el,i)=>el.classList.toggle('full',i<count));
   tracker.setAttribute('aria-label',`Использовано ${count} из 8 вёдер`);
   stage.style.setProperty('--fill',String(count/8));
   stage.style.setProperty('--glow',String(count/8*.72));
   status.textContent=count===8?'🌊 Русал спасён!':`💧 ${count}/8 · ещё ${8-count}`;
 }
 function animateWater(button){
   if(reduced)return;
   const x=(button.offsetLeft+button.offsetWidth*.5)/stage.clientWidth*100;
   const y=(button.offsetTop+button.offsetHeight*.35)/stage.clientHeight*100;
   const endX=52,endY=49;
   const bendX=(x+endX)/2+(x>endX?-3:3),bendY=(y+endY)/2-16;
   const path=document.createElementNS('http://www.w3.org/2000/svg','path');
   path.setAttribute('class','spurt');
   path.setAttribute('d',`M ${x.toFixed(2)} ${y.toFixed(2)} Q ${bendX.toFixed(2)} ${bendY.toFixed(2)} ${endX} ${endY}`);
   splash.append(path);
   let len=path.getTotalLength();path.style.setProperty('--len',len+'px');path.style.strokeDasharray=len+' '+len;
   path.addEventListener('animationend',()=>path.remove(),{once:true});
   for(let j=0;j<9;j++){
     let b=document.createElement('i');b.className='bubble';
     b.style.left=(47+Math.random()*12)+'%';b.style.top=(49+Math.random()*9)+'%';
     b.style.setProperty('--dx',((Math.random()-.5)*85)+'px');
     stage.append(b);b.addEventListener('animationend',()=>b.remove(),{once:true});
   }
 }
 function takeBucket(b){
   if(b.disabled||completed)return;
   b.disabled=true;b.setAttribute('aria-label','Ведро '+b.dataset.syllable+' уже вылито');
   count++;animateWater(b);progress();
   if(count===8){
     completed=true;
     try{localStorage.setItem('tivvig_reward_merman_waterhouse_v1','unlocked');}catch(e){}
     pending=setTimeout(()=>show(transformation),reduced?300:1350);
   }
 }
 buckets.forEach(b=>b.addEventListener('click',()=>takeBucket(b)));
 function reset(){
   if(pending!==null)clearTimeout(pending);pending=null;
   hideAll();count=0;completed=false;
   buckets.forEach(b=>{b.disabled=false;b.setAttribute('aria-label','Ведро '+b.dataset.syllable);});
   splash.replaceChildren();stage.querySelectorAll('.bubble').forEach(b=>b.remove());
   progress();status.textContent='Выбирай ведро — и произноси слог!';
 }
 document.getElementById('restart').addEventListener('click',reset);
 document.getElementById('repeatTransform').addEventListener('click',reset);
 document.getElementById('repeatPrize').addEventListener('click',reset);
 document.getElementById('showReward').addEventListener('click',()=>{transformation.hidden=true;show(prize);});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!transformation.hidden){hideAll();}else if(e.key==='Escape'&&!prize.hidden){hideAll();}});
 progress();
})();
</script>
<script src="world-coop-bridge.js?v=10" defer></script>
</body>
</html>
