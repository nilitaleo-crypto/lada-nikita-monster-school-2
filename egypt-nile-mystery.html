<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151326">
<title>Ночная тайна Нила · Тиввиг</title>
<style>
:root{color-scheme:dark;--gold:#ffe3a0;--moon:#d0eaff;--deep:#171229}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:#110e1d}
body{font:16px Georgia,'Times New Roman',serif;color:#fff1d6;background:radial-gradient(ellipse at 50% 20%,#343057,#100e1b 82%)}
button,a{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button{cursor:pointer}a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible{outline:3px solid #c5edff;outline-offset:3px}
main{min-height:100dvh;max-width:1500px;margin:auto;padding:6px 9px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
header{width:min(100%,1380px);display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
header h1{margin:0;text-align:center;font:normal clamp(17px,2.3vw,29px) Georgia,serif;color:#ffdfa8;text-shadow:0 2px 7px #161025}
.nav{min-width:60px;min-height:42px;display:grid;place-items:center;padding:6px 9px;background:#292240c9;border:1px solid #a99fc090;border-radius:12px;font-size:13px}
.scene{position:relative;isolation:isolate;width:min(100%,1380px,calc((100dvh - 95px)*16/9));aspect-ratio:16/9;min-height:400px;overflow:hidden;border:3px solid #7d678b;border-radius:17px;background:#1d243f;box-shadow:0 4px 0 #25142c,0 10px 28px #060714b5;touch-action:manipulation}
.backdrop{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none;z-index:0;transition:opacity .55s ease}
.evidence-backdrop{opacity:0}
.scene:not([data-scene="meet"]) .intro-backdrop{opacity:0}
.scene:not([data-scene="meet"]) .evidence-backdrop{opacity:1}
.scene::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:26;box-shadow:inset 0 0 28px #070d26ad}
.scene-label{position:absolute;z-index:14;top:2%;left:2.4%;font:600 clamp(10px,1.15vw,13px) system-ui,sans-serif;letter-spacing:.08em;text-shadow:0 1px 6px #12131e;color:#ffd996}
.story-line{position:absolute;z-index:15;top:5.7%;left:50%;transform:translateX(-50%);margin:0;width:max-content;max-width:76%;text-align:center;color:#fff7de;text-shadow:0 2px 7px #151019,0 0 10px #18101e;font:normal clamp(14px,1.8vw,24px)/1.2 Georgia,serif;pointer-events:none}
/* Original human photographic cutout only: do not synthesize or alter Lada's head. */
.lada{position:absolute;left:23%;bottom:3.4%;width:13.5%;height:47%;z-index:7;pointer-events:none;filter:drop-shadow(3px 7px 7px #0b0d18b0)}
.lada img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}
.lada .outfit{z-index:2;-webkit-clip-path:polygon(0 29%,100% 29%,100% 100%,0 100%);clip-path:polygon(0 29%,100% 29%,100% 100%,0 100%)}
.lada[data-outfit="egyptMoon"] .outfit{-webkit-clip-path:none;clip-path:none}
.lada[data-outfit="egyptMoon"] .head{display:none}
.lada .head{z-index:3;-webkit-clip-path:ellipse(25% 15.5% at 49.5% 14.8%);clip-path:ellipse(25% 15.5% at 49.5% 14.8%)}
.friend{position:absolute;bottom:4%;border:0;background:transparent;padding:0;z-index:8;filter:drop-shadow(3px 8px 6px #111321c7);display:flex;align-items:flex-end;justify-content:center;transform-origin:center bottom;transition:filter .25s,transform .3s}
.friend img{width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}
.friend:hover:not(:disabled){transform:scale(1.05)}.friend:disabled{cursor:default}
.friend .talk-mark{position:absolute;right:-4px;top:4px;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#f4e1aa;color:#38264e;font:26px Georgia,serif;border:2px solid #ffeed0;box-shadow:0 0 10px #ffda82a0}
.friend.met .talk-mark{background:#a5e2b7;color:#1a503e;font:bold 23px system-ui}
#fox{left:43%;width:18%;height:57%}#nafiri{left:65%;width:20%;height:65%}
/* small prompt, never a separate darkened gameplay window */
.next-action{position:absolute;left:50%;bottom:4%;z-index:17;transform:translateX(-50%);border:2px solid #fff0c0;border-radius:13px;padding:10px 20px;min-height:48px;background:linear-gradient(#fff0c9,#eebf7d);color:#50314a;box-shadow:0 3px 13px #140f29b9;font:bold clamp(14px,1.45vw,19px) Georgia,serif;white-space:nowrap}
.portal-back{position:absolute;left:2.9%;top:22%;width:13%;height:42%;border-radius:50%;background:radial-gradient(ellipse at center,#77488874,#5b327d8a 45%,#3a2040a0 67%,transparent 76%);box-shadow:0 0 25px #e1b67a80;pointer-events:none;opacity:.52;z-index:3}
.portal-back.gone{opacity:0;transition:opacity 1s ease}
/* No icons, frames or floating graphics: the clues are baked into the painted environment. */
.clue{position:absolute;z-index:10;border:0;background:transparent;padding:0;display:block;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.clue:focus-visible{outline:2px solid #d7f5fc;outline-offset:2px;border-radius:8px}
.clue.solved{cursor:default}
.clue.hint::after{content:'';position:absolute;inset:2%;border:2px solid #f7d289;border-radius:30%;box-shadow:0 0 11px #fff0bd;animation:glimmer .65s ease-in-out 3 alternate;pointer-events:none}
.clue.solved::after{content:'✓';position:absolute;top:0;right:5%;color:#245c43;background:#bfeac7;border:1px solid #e3ffdb;border-radius:50%;width:clamp(22px,2.2vw,32px);height:clamp(22px,2.2vw,32px);display:grid;place-items:center;font:bold 17px system-ui;box-shadow:0 2px 8px #1118;pointer-events:none}
/* Match painted evidence positions on the 16:9 illustration; transparent hitboxes remain large on touch devices. */
#clue-claw{left:12.0%;top:27%;width:14%;height:27%}
#clue-cloth{left:25.3%;top:39%;width:16%;height:25%}
#clue-paw{left:32.7%;top:72.5%;width:18%;height:21%}
#clue-voice{left:53.2%;top:69.1%;width:23%;height:24.2%}
@keyframes glimmer{50%{opacity:.35;filter:brightness(1.5)}}
/* Overlay only appears when needed, small enough to preserve scenery. */
.inspect-prompt{position:absolute;z-index:19;left:48%;top:19%;width:41%;min-height:26%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:11px 12px;border:1px solid #e8bc7db0;border-radius:15px;background:#251b35df;box-shadow:0 3px 18px #09071599}
.inspect-prompt p{margin:0;color:#fff1d7;text-align:center;font:normal clamp(14px,1.7vw,21px)/1.1 Georgia,serif}
.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:100%}
.choices button{background:#edd6a6;color:#38283b;border:1px solid #fff0c5;border-radius:11px;min-height:43px;padding:7px 10px;font:bold clamp(12px,1.28vw,16px) Georgia,serif}
.choices button:active{transform:scale(.97)}
.evidence-status{position:absolute;z-index:15;right:2%;bottom:2%;padding:5px 10px;border-radius:9px;background:#1d23329c;border:1px solid #f2d79b5c;font:500 clamp(13px,1.5vw,18px) Georgia,serif;color:#ffe3aa;pointer-events:none}
/* suspects are carved into the village wall and only appear when all clues are resolved */
.suspects{position:absolute;z-index:20;left:23%;top:22%;width:64%;max-height:69%;border-radius:17px;padding:13px;background:linear-gradient(145deg,#4c3628f0,#322a33f2);border:3px ridge #d7ab68;box-shadow:0 8px 25px #101020a8}
.suspects h2{margin:0 0 10px;text-align:center;font:normal clamp(17px,2vw,26px) Georgia,serif;color:#ffefc7}
.suspect-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.suspect{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;min-height:118px;border:1px solid #c6a77c;border-radius:10px;background:#ebd9ad;color:#31253a;padding:8px 4px}
.suspect .face{font-size:clamp(28px,3.6vw,49px)}.suspect .name{font:bold clamp(12px,1.35vw,17px) Georgia,serif}.suspect .desc{font:normal clamp(9px,1.0vw,13px)/1.1 system-ui,sans-serif}
.suspects .feedback{margin:8px auto 0;text-align:center;max-width:94%;color:#f7e8d0;font-size:clamp(12px,1.4vw,17px)}
.victory{position:absolute;z-index:22;bottom:3%;left:50%;transform:translateX(-50%);width:min(95%,620px);padding:12px;border-radius:14px;border:1px solid #f6d8a3;background:#261d3ddc;text-align:center}
.victory .moon-gift{width:min(17%,80px);height:clamp(90px,11vw,120px);object-fit:contain;display:block;margin:2px auto 7px;filter:drop-shadow(0 3px 8px #ffe4a470)}
.victory p{margin:0 0 9px;font-size:clamp(14px,1.6vw,19px)}.victory .actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
.victory a,.victory button{display:grid;place-items:center;min-height:44px;padding:8px 12px;border-radius:10px;background:#f7dcb0;color:#412c49;border:1px solid #ffedc7;font:bold 15px Georgia,serif}
.scene[data-scene="investigate"] .friend,.scene[data-scene="confirm"] .friend,.scene[data-scene="done"] .friend{transform:scale(.78);transform-origin:bottom left;opacity:.9;pointer-events:none}
.scene[data-scene="investigate"] #fox{pointer-events:auto}
.scene:not([data-scene="meet"]) .friend .talk-mark{display:none}
.scene:not([data-scene="meet"]) #fox{left:3.5%;bottom:0}
.scene:not([data-scene="meet"]) #nafiri{left:76%;bottom:0}
.scene:not([data-scene="meet"]) .lada{left:7%;bottom:1%;width:12%;height:38%;opacity:.92}
.scene:not([data-scene="meet"]) .portal-back{opacity:0}
@media(max-width:700px){main{justify-content:flex-start;padding:4px 3px 8px}header h1{font-size:clamp(14px,4vw,19px)}.nav{min-width:43px;min-height:43px;padding:6px;font-size:11px}.scene{width:100%;min-height:380px;aspect-ratio:4/3;border-width:2px}.scene-label{font-size:9px}.story-line{font-size:clamp(12px,3.3vw,17px);top:6%;max-width:93%}.lada{left:19%;height:43%;width:18%}#fox{left:39%;width:23%;height:51%}#nafiri{left:60%;width:26%;height:59%}.friend .talk-mark{width:30px;height:30px;font-size:20px}.next-action{bottom:4%;padding:8px 12px;font-size:14px}.scene[data-scene="investigate"] #fox{left:0%;width:22%;bottom:0%}.scene[data-scene="investigate"] #nafiri{left:81%;width:19%;bottom:0%}.scene[data-scene="investigate"] .lada{left:8%;width:14%;height:33%}.inspect-prompt{left:41%;width:56%;top:19%;padding:8px 6px;gap:5px}.inspect-prompt p{font-size:13px}.choices{gap:4px}.choices button{font-size:11px;padding:5px 7px;min-height:43px}.clue{min-width:46px;min-height:46px}.evidence-status{font-size:13px}.suspects{left:3%;width:94%;top:21%;padding:8px}.suspects h2{font-size:16px}.suspect-grid{gap:5px}.suspect{min-height:100px;padding:4px 2px}.suspect .face{font-size:25px}.suspect .name{font-size:11px}.suspect .desc{font-size:9px}.victory{bottom:2%;padding:8px}.victory p{font-size:14px}}
@media(prefers-reduced-motion:reduce){.clue::after{animation:none}.friend,.backdrop{transition:none}}
</style>
</head>
<body>
<main>
 <header><a class="nav" href="egypt-pomegranate.html">← Портал</a><h1>Ночная тайна Нила</h1><a class="nav" href="index.html">⌂ Карта</a></header>
 <section class="scene" id="nileScene" data-scene="meet" aria-label="Лада знакомится с пёселем и мальчиком Нафири на ночном берегу Нила, затем расследует нападение на деревню">
  <img class="backdrop intro-backdrop" src="images/egypt-nile-night-entrance.webp" alt="Лунный берег Нила, где Лада встречает Нафири и пёселя" draggable="false" fetchpriority="high">
  <img class="backdrop evidence-backdrop" src="images/egypt-nile-integrated-evidence.webp" alt="Те же руины у Нила. На камне видны царапины, на столбе — полосатая ткань, в песке отпечаток львиной лапы, а рядом развернут старый папирус" draggable="false">
  <div class="portal-back" id="portalBack" aria-hidden="true"></div>
  <div class="lada" id="nileLada" role="img" aria-label="Лада в выбранном наряде"><img src="images/lada-cutout.webp" alt="" draggable="false"><img class="outfit" data-outfit-layer src="images/hecate-lyre-costume-layer.webp" alt="" draggable="false"><img class="head" src="images/lada-cutout.webp" alt="" draggable="false"></div>
  <button class="friend" id="fox" type="button" aria-label="Поговорить с пёселем" data-tivvig-sound="manual"><img src="images/egypt-fox-friend.webp" alt="Пёсель в красном жилете" draggable="false"><span class="talk-mark" aria-hidden="true">?</span></button>
  <button class="friend" id="nafiri" type="button" aria-label="Поговорить с Нафири" data-tivvig-sound="manual"><img src="images/egypt-nafiri.webp" alt="Мальчик Нафири" draggable="false"><span class="talk-mark" aria-hidden="true">?</span></button>
  <span class="scene-label" id="sceneLabel">ЕГИПЕТ · ЛУННЫЙ БЕРЕГ</span>
  <p class="story-line" id="storyLine" role="status" aria-live="polite">Лада вышла из портала… А где друзья?</p>
  <button class="next-action" id="toInvestigation" type="button" hidden data-tivvig-sound="manual">Осмотреть деревню →</button>
  <div id="clueField" hidden aria-label="Расследуй следы на песке, рисунок на папирусе, ткань и царапины на стене">
    <button class="clue" id="clue-paw" data-clue="paw" type="button" aria-label="Осмотреть большой след в песке" data-tivvig-sound="manual"></button>
    <button class="clue" id="clue-cloth" data-clue="cloth" type="button" aria-label="Исследовать синюю с золотом ткань на каменной опоре" data-tivvig-sound="manual"></button>
    <button class="clue" id="clue-claw" data-clue="claw" type="button" aria-label="Посмотреть настоящие царапины на стене" data-tivvig-sound="manual"></button>
    <button class="clue" id="clue-voice" data-clue="voice" type="button" aria-label="Изучить древний рисунок на папирусе" data-tivvig-sound="manual"></button>
  </div>
  <div class="inspect-prompt" id="inspectPrompt" hidden><p id="inspectQuestion"></p><div class="choices" id="inspectChoices"></div></div>
  <span class="evidence-status" id="evidenceStatus" hidden>Улики 0/4</span>
  <div class="suspects" id="suspects" hidden><h2>Кто напал на деревню?</h2><div class="suspect-grid">
    <button class="suspect" data-suspect="anubis" type="button" data-tivvig-sound="manual"><span class="face">🐺</span><span class="name">Анубис</span><span class="desc">Шакал + человек</span></button>
    <button class="suspect" data-suspect="sobek" type="button" data-tivvig-sound="manual"><span class="face">🐊</span><span class="name">Собек</span><span class="desc">Крокодил + человек</span></button>
    <button class="suspect" data-suspect="sekhmet" type="button" data-tivvig-sound="manual"><span class="face">🦁</span><span class="name">Сехмет</span><span class="desc">Львица + человек</span></button>
    <button class="suspect" data-suspect="sphinx" type="button" data-tivvig-sound="manual"><span class="face">🏺</span><span class="name">Сфинкс</span><span class="desc">Лев + лицо человека</span></button>
  </div><p class="feedback" id="suspectFeedback">Вспомни след, убор и рисунок на папирусе.</p></div>
  <div class="victory" id="victory" hidden><img class="moon-gift" src="images/lada-egypt-moon-dress-layer.webp" alt="Новый наряд Лады — лунная принцесса Нила"><p>Ты разгадала тайну! Лунный наряд теперь твой!</p><div class="actions"><button type="button" id="restartNile" data-tivvig-sound="manual">↻ Ещё раз</button><a href="egypt-sphinx-temple.html">🦁 К храму →</a></div></div>
 </section>
</main>

<script src="game-registry.js?v=6" defer></script>

</body>
