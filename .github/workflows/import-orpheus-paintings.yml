name: Import public-domain Orpheus paintings
on:
  push:
    paths:
      - '.github/workflows/import-orpheus-paintings.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch verified public-domain artwork and cache as local WebP
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import hashlib,io,os,time,urllib.parse,urllib.request
          from pathlib import Path
          from PIL import Image,ImageOps
          artworks=[
          ("orpheus-01-love.webp","Nicolas Poussin - Paysage avec Orphée et Eurydice.jpg","https://www.wga.hu/art/p/poussin/3/08landsc.jpg"),
          ("orpheus-02-eurydice.webp","Abbate - Orpheus and Eurydice.jpg","https://www.nationalgallery.org.uk/media/hgopl3t1/n-5283-00-000027-web-hd.jpg?width=1500"),
          ("orpheus-03-lament.webp","Ary Scheffer - Orpheus Mourning the Death of Eurydice, 1814.jpg","https://en.muzeo.com/sites/default/files/styles/image_moyenne_def/public/oeuvres/paintings/classical/orpheee_et_eurydice81877.jpg"),
          ("orpheus-04-descent.webp","Jan bruegel il vecchio, orfeo agli inferi, su rame, 1594, 01.jpg","https://www.meisterdrucke.pt/kunstwerke/1260px/Jan_the_Elder_Brueghel_-_Orpheus_with_a_Harp_Playing_to_Pluto_and_Persephone_in_the_Underworld_-_%28MeisterDrucke-87824%29.jpg"),
          ("orpheus-05-permission.webp","Orpheus and Eurydice by Peter Paul Rubens.jpg","https://www.greeklegendsandmyths.com/uploads/5/3/1/3/53133595/orpheus-rubens_orig.jpg"),
          ("orpheus-06-path.webp","Jean-Baptiste-Camille Corot - Orpheus Leading Eurydice from the Underworld - 87.190 - Museum of Fine Arts.jpg","https://abcbooks.net/images/artwork/oil/184/01.jpg"),
          ("orpheus-07-doubt.webp","Frederic Leighton-Orfeo ed Euridice-1864.jpg","https://upload.wikimedia.org/wikipedia/commons/7/7a/Frederic_Leighton-Orfeo_ed_Euridice-1864.jpg"),
          ("orpheus-08-loss.webp","Orpheus And Eurydice by George Frederick Watts - George Frederick Watts - ABDAG003030.jpg","https://www.meisterdrucke.uk/kunstwerke/1260px/George_Frederick_Watts_-_Orpheus_and_Eurydice_1870-72_%28mezzotint_on_indian_paper%29_-_%28MeisterDrucke-601974%29.jpg"),
          ("orpheus-09-elysium.webp","Maurice Denis - Orpheus and Eurydice - 68.1 - Minneapolis Institute of Arts.jpg",""),
          ]
          outdir=Path("images");outdir.mkdir(exist_ok=True)
          for out,name,backup in artworks:
            safe=name.replace(" ","_")
            m=hashlib.md5(safe.encode('utf-8')).hexdigest()
            media=f"https://upload.wikimedia.org/wikipedia/commons/{m[0]}/{m[:2]}/{urllib.parse.quote(safe,safe='')}"
            special=f"https://commons.wikimedia.org/wiki/Special:Redirect/file/{urllib.parse.quote(safe,safe='')}"
            attempts=[media,special]+([backup] if backup else [])
            completed=False
            for url in attempts:
              try:
                req=urllib.request.Request(url,headers={"User-Agent":"Tivvig-Educational-Storybook/1.0 (educational artwork usage) Mozilla/5.0","Accept":"image/jpeg,image/png,image/webp,image/*","Referer":"https://commons.wikimedia.org/"})
                with urllib.request.urlopen(req,timeout=25) as response:raw=response.read(20_000_001)
                if len(raw)>20_000_000:raise ValueError('Too large')
                img=Image.open(io.BytesIO(raw))
                img.load()
                if img.width<450 or img.height<320:raise ValueError(f'Low resolution {img.size}')
                img=ImageOps.exif_transpose(img).convert("RGB")
                img.thumbnail((1500,1200),Image.Resampling.LANCZOS)
                img.save(outdir/out,"WEBP",quality=88,method=5)
                print("IMPORTED",out,img.size,(outdir/out).stat().st_size,"via",url[:120])
                completed=True
                break
              except Exception as ex:
                print("SOURCE_FAILED",out,url[:95],repr(ex))
                time.sleep(.6)
            if not completed: raise RuntimeError("Required artwork unavailable: "+name)
          PY
      - name: Commit cached images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/orpheus-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add public-domain Orpheus and Eurydice artworks for Hecate book"
            git push
          fi
