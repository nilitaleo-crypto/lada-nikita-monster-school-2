name: Import original historical Thor book illustrations

on:
  push:
    paths:
      - '.github/workflows/import-thor-art.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-illustrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download public-domain illustrations to local WebP files
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import io, os, time, urllib.request
          from PIL import Image
          sources = [
            ("thor-book-01.webp", "https://upload.wikimedia.org/wikipedia/commons/1/1b/How_loki_wrought_mischief_in_Asgard_by_Willy_Pogany.png"),
            ("thor-book-02.webp", "https://upload.wikimedia.org/wikipedia/commons/5/58/The_Gold_Hair_that_Loki_Made.jpg"),
            ("thor-book-03.webp", "https://upload.wikimedia.org/wikipedia/commons/f/f4/Loki_and_Dvalin.jpg"),
            ("thor-book-04.webp", "https://upload.wikimedia.org/wikipedia/commons/f/f3/Once_again_the_buzzing_fly_came_in_at_the_window_%281901%29_by_Arthur_Rackham.jpg"),
            ("thor-book-05.webp", "https://upload.wikimedia.org/wikipedia/commons/4/4c/The_third_gift_%E2%80%94_an_enormous_hammer_by_Elmer_Boyd_Smith.jpg"),
            ("thor-book-06.webp", "https://upload.wikimedia.org/wikipedia/commons/5/50/Journeys_through_Bookland_-_a_new_and_original_plan_for_reading_applied_to_the_world%27s_best_literature_for_children_%281922%29_%2814596644918%29.jpg"),
          ]
          os.makedirs("images", exist_ok=True)
          for name, url in sources:
            dest=os.path.join("images",name)
            error=None
            for attempt in range(4):
              try:
                import urllib.parse
                urls=[
                  url,
                  "https://wsrv.nl/?url="+urllib.parse.quote(url,safe="")+"&w=1400&output=webp",
                  "https://images.weserv.nl/?url="+urllib.parse.quote(url,safe="")+"&w=1400&output=webp"
                ]
                if name=="thor-book-06.webp":
                  urls.insert(0,"https://live.staticflickr.com/5556/14596644918_e23a474624_o.jpg")
                option=urls[attempt%len(urls)]
                req=urllib.request.Request(option,headers={"User-Agent":"Mozilla/5.0 (Tivvig original illustrated book)","Accept":"image/avif,image/webp,image/jpeg,image/png,image/*"})
                with urllib.request.urlopen(req,timeout=35) as response:
                  blob=response.read()
                if len(blob)<1000 or len(blob)>12_000_000:raise ValueError("Unexpected image size")
                im=Image.open(io.BytesIO(blob))
                im.load()
                im.thumbnail((1600,1600), Image.Resampling.LANCZOS)
                if im.mode not in ("RGB","RGBA"):im=im.convert("RGB")
                im.save(dest,"WEBP",quality=88,method=5)
                print(name,im.size,os.path.getsize(dest))
                break
              except Exception as e:
                error=e
                if attempt==3:
                  print(f"WARNING: Could not fetch {name}: {error}")
                time.sleep(1)
          PY
      - name: Commit images to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/thor-book-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Cache public-domain original illustrations for the Thor reader"
            git push
          fi
