name: Prepare Charon boat artwork cutout
on:
  push:
    paths: ['.github/workflows/prepare-charon-boat.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cutout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Mask the boat and Charon from the existing classical painting
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          from pathlib import Path
          src=Image.open('images/charon-river-hq-meister.webp').convert('RGBA')
          W,H=src.size
          # Tight painterly cutout includes Charon with his pole and the original boat.
          poly=[(118,389),(188,348),(269,323),(288,270),(304,209),(353,157),(413,132),
            (449,108),(499,106),(540,145),(566,206),(607,250),(659,268),
            (706,321),(737,359),(800,416),(822,477),(805,565),(791,637),
            (779,685),(731,742),(706,792),(632,844),(482,870),
            (342,875),(229,855),(132,786),(77,685),(62,587),(77,468)]
          mask=Image.new('L',src.size,0)
          ImageDraw.Draw(mask).polygon(poly,fill=255)
          mask=mask.filter(ImageFilter.GaussianBlur(4))
          src.putalpha(mask)
          out=src.crop((54,88,829,880))
          Path('images').mkdir(exist_ok=True)
          out.save('images/charon-boat-cutout.webp','WEBP',quality=90,method=6)
          print('CUTOUT',out.size,Path('images/charon-boat-cutout.webp').stat().st_size)
          PY
      - name: Commit cutout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/charon-boat-cutout.webp
          if ! git diff --cached --quiet; then
            git commit -m "Prepare Charon and boat from the original painting for Styx chase"
            git push
          fi
