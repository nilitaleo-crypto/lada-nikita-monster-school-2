name: Hades stability gate
on:
  push:
    paths:
      - 'hades-*.html'
      - 'hades-*.js'
      - 'egypt-*.html'
      - 'egypt-*.js'
      - 'world-coop-bridge.js'
      - 'wardrobe.js'
      - 'tests/hades-stability.mjs'
      - 'tests/egypt-apophis.spec.mjs'
      - 'tests/egypt-pomegranate.spec.mjs'
      - 'tests/egypt-nile-mystery.spec.mjs'
      - 'tests/egypt-sphinx-temple.spec.mjs'
      - 'tests/egypt-thoth-library.spec.mjs'
      - 'tests/egypt-mummy-tomb.spec.mjs'
      - 'tests/egypt-motion-temple.spec.mjs'
      - 'tests/egypt-school.spec.mjs'
      - '.github/workflows/hades-stability.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout full Tivvig adventure
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static JavaScript syntax, Hades links and asset paths
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re,subprocess
          root=pathlib.Path('.')
          pages=sorted(root.glob('hades-*.html'))
          assert len(pages)==7, f'Expected 7 Hades locations, got {len(pages)}'
          for file in [*root.glob('hades-*.js'),*root.glob('egypt-*.js'),root/'world-coop-bridge.js',root/'wardrobe.js']:
              subprocess.run(['node','--check',str(file)],check=True)
          for page in pages:
              source=page.read_text('utf-8')
              assert 'hades-sounds.js?v=1' in source, f'Local audio script missing: {page}'
              for part in re.findall(r'<script[^>]*>(.*?)</script>',source,re.S|re.I):
                  if part.strip():
                      subprocess.run(['node','--check','--input-type=commonjs'],
                                     input=part,text=True,check=True)
              for path in re.findall(r'(?:src|href)="(images/[^"]+)"',source):
                  assert (root/path.split('?',1)[0].split('#',1)[0]).is_file(), f'{page}: missing {path}'
          print('STATIC PASS: seven scenes, JavaScript syntax, asset references')
          PY
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false playwright@1.57.0
      - name: Install Chromium and WebKit with dependencies
        run: npx playwright install --with-deps chromium webkit
      - name: Smoke test all scenes on desktop, tablet and phone in both engines
        run: node tests/hades-stability.mjs
      - name: Apophis prologue and co-op browser smoke tests
        run: node tests/egypt-apophis.spec.mjs
      - name: Pomegranate road, iPad sounds and Firebase co-op game tests
        run: node tests/egypt-pomegranate.spec.mjs
      - name: Nile mystery, original characters, co-op and iOS WebKit tests
        run: node tests/egypt-nile-mystery.spec.mjs
      - name: Sphinx temple riddles, original Lada, iOS touch/audio and Firebase co-op
        run: node tests/egypt-sphinx-temple.spec.mjs
      - name: Thoth reading, sign memory, syllables, reward and synchronized taps
        run: node tests/egypt-thoth-library.spec.mjs
      - name: Mummy tomb touch puzzles, WebKit, gold scarab and two-device co-op
        run: node tests/egypt-mummy-tomb.spec.mjs
      - name: Nile movement temple, desktop/iPad/phone and Firebase click replay
        run: node tests/egypt-motion-temple.spec.mjs
      - name: Egyptian school math, print worksheets, reading, iPad and co-op
        run: node tests/egypt-school.spec.mjs
      - name: Archive results (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hades-stability-results
          path: hades-test-results.json
          if-no-files-found: ignore
