name: Import real zoo reward photographs
on:
  push:
    branches: [main]
    paths:
      - 'zoo-photo-manifest.json'
      - 'scripts/import-zoo-reward-photos.py'
      - '.github/workflows/import-zoo-reward-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: zoo-photo-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "Pillow>=11,<13"
      - name: Download and validate real Creative Commons wildlife photographs
        run: python scripts/import-zoo-reward-photos.py
      - name: Publish optimized files to main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/zoo-reward-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Cache seven licensed zoo wildlife photo rewards locally"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
