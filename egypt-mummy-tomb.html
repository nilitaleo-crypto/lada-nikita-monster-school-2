<style>

.lada[data-outfit="egyptMoon"] [data-outfit-layer]{clip-path:none;-webkit-clip-path:none}
.lada [data-outfit-layer]{clip-path:polygon(0 27%,100% 27%,100% 100%,0 100%);-webkit-clip-path:polygon(0 27%,100% 27%,100% 100%,0 100%)}
.speech{position:absolute;z-index:7;top:1.5%;left:32%;width:37%;min-height:9%;padding:clamp(6px,1.1vw,14px) clamp(10px,1.1vw,18px);border:2px solid #d6ad64;border-radius:12px;background:#17263be8;box-shadow:0 6px 22px #100d16a6;text-align:center;color:#ffecc8;font:normal clamp(14px,1.5vw,22px)/1.22 Georgia,serif}

.status{position:absolute;z-index:9;left:17%;bottom:2%;min-width:15%;max-width:19%;min-height:44px;border:1px solid #a77840ba;background:#1b2842df;color:#fff1ce;border-radius:10px;padding:8px 12px;font-size:clamp(13px,1.34vw,18px);display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.status:empty{display:none}
.action{position:absolute;z-index:10;left:46%;bottom:2.7%;transform:translateX(-50%);min-height:clamp(48px,5vw,65px);min-width:170px;border:3px solid #926326;background:linear-gradient(#fff0bc,#dca351);color:#402718;font:bold clamp(16px,1.65vw,23px) Georgia,serif;padding:8px 17px;border-radius:13px;box-shadow:0 5px 0 #674125,0 9px 20px #2f1b13aa}
.action[hidden],[hidden]{display:none!important}.action:active,.tile:active,.weight:active{filter:brightness(.95)}
.stage-title{position:absolute;z-index:8;font:bold clamp(15px,1.4vw,21px) Georgia,serif;color:#3d2619;text-shadow:0 1px #ffe0a6}
/* The relief becomes an animated, touchable wall fresco: no detached game window. */
.fresco{position:absolute;z-index:8;left:33%;top:21%;width:64%;height:38%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:stretch;gap:1%;padding:1.15%;border:5px ridge #d4a45b;border-radius:11px;background:linear-gradient(160deg,#d7a567cf,#91623e9c);box-shadow:0 3px 0 #6d4329,0 7px 15px #1a101373}

.cycle-tile{background-color:#876344;background-image:none;background-size:400% 300%;background-repeat:no-repeat;background-origin:border-box;transition:filter .16s,opacity .16s,transform .16s}
.cycle-tile:hover:not(:disabled),.cycle-tile:focus-visible{outline:3px solid #fff2bc;outline-offset:-3px;filter:brightness(1.12)}
.cycle-tile.done{opacity:.29;border-color:#e7ca9a;filter:sepia(.4)}
.fresco-slots{position:absolute;z-index:9;left:33%;top:62%;width:64%;height:16%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1%;align-items:stretch}
.cycle-slot{position:relative;display:grid;place-items:center;min-width:0;height:100%;border:3px solid #e6c58c;border-radius:8px;background:#3e2e31a8;color:#f8e0a2;font:bold clamp(22px,2.7vw,43px) Georgia,serif}
.cycle-slot.done{border-color:#ffe3a3;background-color:#a57c4b;background-size:400% 300%;background-repeat:no-repeat;box-shadow:0 0 13px #ffd37c6c,0 2px 4px #170b0db8}
.cycle-slot.done:not(:last-child)::after{content:'➜';position:absolute;z-index:2;right:-12%;top:32%;width:21%;color:#ffefad;line-height:1;text-shadow:0 2px 2px #472b0c,0 0 8px #fff0a3;font-size:clamp(23px,2.7vw,36px);pointer-events:none}
.no-cycle-art .cycle-tile{font-size:clamp(30px,4.3vw,58px);background-image:linear-gradient(#e9d6a6,#b9834d)!important}
.no-cycle-art .cycle-slot.done{background-image:linear-gradient(#f7dc9c,#ad7d4d)!important}

/* Kanopic protection puzzle: pictorial tiles sit on the tomb floor; no modal windows. */
.organ-tray{position:absolute;z-index:9;left:40%;top:67%;width:57%;height:16%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:stretch;gap:1%;padding:.35%;border-top:3px solid #bd9155aa;border-bottom:3px solid #8e653baa;border-radius:9px;background:#58432e66}

.organ-choice svg{width:clamp(27px,4vw,53px);height:clamp(27px,4vw,53px);flex:1;max-height:70%;overflow:visible;stroke-linecap:round;stroke-linejoin:round}
.organ-choice .organ-name{font:600 clamp(10px,.93vw,14px)/1 system-ui,sans-serif;white-space:nowrap}
.organ-choice.selected{border-color:#d4f4a2;background:#cfe59a;box-shadow:0 0 15px #c5eb78b2}
.organ-choice.used{opacity:.46;filter:grayscale(.45);border-color:#98b48d}
.organ-choice.heart-ready{border-color:#ffa7a0;box-shadow:0 0 16px #ffd1a1;animation:pulse 2s ease-in-out infinite}

.jar.sealed{border-color:#a5df9d;background:#baf29635;box-shadow:0 0 16px #ffe1996f}
.jar-mark{position:absolute;left:17%;bottom:8%;width:66%;height:36%;display:grid;place-items:center;border-radius:50%;border:2px solid #ffedac;background:#42775dbd;box-shadow:0 0 9px #fff0b6;font:bold clamp(17px,2vw,28px) Georgia,serif;color:#fff6c7;pointer-events:none}
.heart-spot{position:absolute;z-index:10;left:21%;top:53%;width:10%;height:12%;display:grid;place-items:center;border:3px solid #ffe2ad;border-radius:45%;background:#9d3840a9;color:#fff4cb;font-size:clamp(23px,3vw,42px);box-shadow:0 0 22px #ffeab5;animation:pulse 1.9s ease-in-out infinite;touch-action:manipulation}
@media(prefers-reduced-motion:reduce){.organ-choice.heart-ready,.heart-spot{animation:none!important}}
.jar-targets{position:absolute;inset:0;z-index:8;pointer-events:none}
.jar{pointer-events:auto;position:absolute;top:29%;width:5.6%;height:20%;border:3px solid #ffe3a100;background:#fff2ad00;border-radius:40% 40% 20% 20%;color:#fff9d6;transition:background .15s,border-color .15s}
.jar:hover,.jar:focus-visible{border-color:#ffe3a1c9;background:#ffdd782c}
.jar.selected{border-color:#d9ef9c;background:#a8ed6b42}
.jar.bad{border-color:#f8abab;background:#e5425440}
.jar:nth-child(1){left:73.4%}.jar:nth-child(2){left:79.2%}.jar:nth-child(3){left:85.1%}.jar:nth-child(4){left:91%}
.jar-label{position:absolute;right:2%;top:53%;z-index:8;background:#f3d7a8ed;color:#55331b;border:2px solid #c99c54;border-radius:9px;padding:6px 10px;font-size:clamp(13px,1.4vw,18px);max-width:28%;text-align:center}
.scale-numbers{position:absolute;left:58%;top:42%;width:18%;height:10%;z-index:8;display:flex;align-items:center;justify-content:space-between;gap:8%;font:bold clamp(20px,3vw,41px) Georgia,serif;color:#372316}
.scale-numbers span{width:43%;aspect-ratio:1;display:grid;place-items:center;border:3px solid #a46d2c;background:linear-gradient(#f8e3b9,#dcb368);border-radius:50%;box-shadow:0 2px 12px #391e1b99}
.weights{position:absolute;left:56.3%;bottom:15%;width:23%;height:9.7%;display:flex;gap:3%;z-index:8}
.weight{flex:1;min-width:0;border-radius:14px 14px 7px 7px;border:3px solid #996121;background:linear-gradient(#ffe4a0,#c38a3c);font:bold clamp(19px,2.7vw,33px) Georgia,serif;color:#402918;box-shadow:0 4px 0 #4c3324a6}

.name-board{position:absolute;left:75.5%;top:69%;width:21%;height:22%;z-index:8;background:#c39a6eeb;border:4px solid #96643d;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:5px;box-shadow:0 4px 9px #42281991}
.name-slots{display:flex;gap:5px;justify-content:center;width:100%;min-height:28px}
.name-slots span{min-width:19%;min-height:clamp(29px,3.4vw,51px);display:grid;place-items:center;border-bottom:3px solid #7e5530;background:#f4d8a480;border-radius:5px 5px 0 0;color:#3e2b1b;font:bold clamp(15px,2vw,32px) Georgia,serif}
.name-options{display:flex;width:100%;justify-content:center;align-items:center;gap:4px}
.name-options button{min-width:0;flex:1;min-height:clamp(34px,3.4vw,50px);border:2px solid #9c6d31;border-radius:8px;background:#ffe6a8;color:#482e18;font:bold clamp(14px,1.9vw,29px) Georgia,serif;padding:2px}
.name-options button.used{visibility:hidden}
.name-label{position:absolute;left:75%;top:64%;z-index:8;color:#fff0bf;font:bold clamp(14px,1.45vw,22px) Georgia,serif;text-shadow:0 2px 4px #2d170d}
.scarab{position:absolute;z-index:9;left:70%;top:71%;width:12%;height:17%;display:grid;place-items:center;filter:drop-shadow(0 4px 8px #1119);animation:float 3.2s ease-in-out infinite}
.scarab img{width:100%;height:100%;object-fit:contain}
.mummy-glow{position:absolute;z-index:3;left:12%;top:28%;width:21%;height:53%;background:radial-gradient(ellipse,#fbe68d42,transparent 73%);pointer-events:none;animation:pulse 3.4s ease-in-out infinite}
.tutenstein{position:absolute;left:11%;bottom:2%;width:24%;height:73%;z-index:6;pointer-events:none;filter:drop-shadow(0 10px 9px #261718aa)}
.tutenstein img{display:block;width:100%;height:100%;object-fit:contain;object-position:bottom center;user-select:none;pointer-events:none}

/* One transparent 3x3 atlas, nine poses, no timers or extra game panels in CSS. */
.tutenstein{left:3%;bottom:0;width:30%;height:76%;transition:left .45s ease;will-change:auto}
.tutenstein .tuten-fallback{transition:opacity .18s linear}
.tutenstein .tuten-sprite{
 position:absolute;z-index:1;display:block;left:-23%;bottom:0;
 width:140%;height:auto;aspect-ratio:1262/1246;opacity:0;
 background-image:url('images/egypt-tutenstein-poses.webp');
 background-size:300% 300%;background-repeat:no-repeat;background-position:0% 0%;
 transform-origin:50% 92%;pointer-events:none;user-select:none;
 filter:drop-shadow(0 7px 6px #241628a3);
 animation:tuten-idle 4.1s ease-in-out infinite;
}
.tutenstein.poses-ready .tuten-fallback{opacity:0}
.tutenstein.poses-ready .tuten-sprite{opacity:1}
.tutenstein[data-pose="talk"] .tuten-sprite{background-position:50% 0%;animation:tuten-talk 3.2s ease-in-out infinite}
.tutenstein[data-pose="point-jars"] .tuten-sprite{background-position:100% 0%;animation:tuten-point 2.9s ease-in-out infinite}
.tutenstein[data-pose="point-organs"] .tuten-sprite{background-position:0% 50%;animation:tuten-point 2.9s ease-in-out infinite}
.tutenstein[data-pose="happy"] .tuten-sprite{background-position:50% 50%;animation:tuten-happy .58s ease-in-out 2}
.tutenstein[data-pose="wrong"] .tuten-sprite{background-position:100% 50%;animation:tuten-wrong .48s ease-in-out 2}
.tutenstein[data-pose="heart"] .tuten-sprite{background-position:0% 100%;animation:tuten-idle 3.8s ease-in-out infinite}
.tutenstein[data-pose="scales"] .tuten-sprite{background-position:50% 100%;animation:tuten-point 3.3s ease-in-out infinite}
.tutenstein[data-pose="celebrate"] .tuten-sprite{background-position:100% 100%;animation:tuten-celebrate 1.25s ease-in-out infinite}
.tutenstein[data-pose="point-organs"]{left:6%}
.tutenstein[data-pose="heart"]{left:6%}
.tutenstein[data-pose="scales"]{left:4%}
@keyframes tuten-idle{0%,100%{transform:translateY(0) rotate(-.7deg)}50%{transform:translateY(-5px) rotate(.7deg)}}
@keyframes tuten-talk{0%,100%{transform:rotate(-1deg)}50%{transform:translateY(-4px) rotate(1.5deg)}}
@keyframes tuten-point{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px) rotate(-1deg)}}
@keyframes tuten-happy{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-13px) scale(1.035)}}
@keyframes tuten-wrong{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes tuten-celebrate{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-14px) rotate(-4deg)}75%{transform:translateY(-10px) rotate(4deg)}}
@media(prefers-reduced-motion:reduce){
 .tutenstein{transition:none}
 .tutenstein .tuten-sprite{animation:none!important;transition:none!important;transform:none!important}
}

.scene[data-stage="intro"] .mummy-glow{opacity:.4}
.scene[data-stage="name"] .name-board{left:70%;top:65%;width:29%;height:29%}

@keyframes pulse{50%{opacity:.5}}@keyframes wave{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(19deg)}}@keyframes float{50%{transform:translateY(-12px)}}
@media(min-width:1000px){.action{left:48%}}
@media(max-width:740px){
 main{padding:4px}.nav{font-size:12px;min-height:39px;min-width:71px;padding:6px}header h1{font-size:16px}

 .speech{font-size:14px;padding:5px 7px;max-height:16%}.status{font-size:13px;padding:5px}.action{min-height:47px;font-size:16px;padding:6px 10px;min-width:125px}
 .jar-label{font-size:14px}.name-label{font-size:15px}
}

/* Keep the talking-canopic riddles readable without an extra dialogue window. */

/* High-contrast canopic lesson using a single illustrated sprite atlas. */
.scene[data-stage="jars"] .speech{left:35%;top:5.4%;width:62%;min-height:16%;padding:11px 15px;line-height:1.28;font-size:clamp(18px,1.85vw,26px);background:#14233bf7;border:2px solid #ffda9b;box-shadow:0 5px 17px #090f1b9a}
