<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172d4c">

<title>Солнечная ладья Ра · Тиввиг</title>

<style>
:root{--gold:#ffdc86;--ink:#1c3051}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#152237;color:#fff0c6;font:16px Georgia,'Times New Roman',serif}
button,a{font:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{cursor:pointer}button:disabled{cursor:default}
button:focus-visible,a:focus-visible{outline:3px solid #9de7ff;outline-offset:3px}
[hidden]{display:none!important}
main{margin:0 auto;max-width:1480px;padding:8px}
header{min-height:42px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
header h1{margin:0;text-align:center;font-weight:normal;font-size:clamp(18px,2.4vw,29px)}
.nav{display:grid;place-items:center;min-height:42px;min-width:78px;background:#243a55;border:1px solid #caa968;border-radius:10px;color:#ffe8b4;padding:6px 13px;text-decoration:none;font-size:clamp(12px,1.1vw,16px)}
.viewport{overflow-x:auto;overflow-y:hidden;border:3px solid #cda55c;border-radius:14px;box-shadow:0 9px 36px #070a16aa}
.scene{position:relative;width:100%;min-width:780px;aspect-ratio:1672/941;isolation:isolate;overflow:hidden;background:#253957}
.backdrop{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:0;pointer-events:none}
.nightwash,.sunwash{position:absolute;inset:0;z-index:1;pointer-events:none;transition:opacity 1.1s ease}
.nightwash{opacity:0;background:linear-gradient(180deg,#07142cda 0%,#111d43bf 58%,#1418327c 100%)}
.nightwash::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,#fff7d7d4 1.5px,transparent 2px),radial-gradient(circle,#dbecffab 1px,transparent 1.6px);background-size:107px 89px,167px 113px;background-position:12px 28px,62px 17px}
.sunwash{opacity:0;background:linear-gradient(180deg,#fd985442,#e58c2130 53%,transparent 75%)}
.scene[data-time="night"] .nightwash{opacity:1}
.scene[data-time="sunset"] .sunwash{opacity:1}
.scene::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 26px #11162d88;pointer-events:none;z-index:18}
.lada{position:absolute;z-index:4;left:22%;bottom:2%;width:14%;height:48%;pointer-events:none;filter:drop-shadow(1px 5px 4px #2b182899)}
.lada img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:bottom center;user-select:none;pointer-events:none}
.lada[data-outfit="egyptMoon"] [data-outfit-layer]{clip-path:none;-webkit-clip-path:none}
.lada [data-outfit-layer]{clip-path:polygon(0 27%,100% 27%,100% 100%,0 100%)}
.speech{position:absolute;z-index:9;top:2.8%;left:66%;width:32%;min-height:10%;max-height:25%;display:block;text-align:center;padding:12px 14px;border:2px solid #ffcf76;border-radius:13px;background:#162b4dea;color:#fff2ce;box-shadow:0 4px 16px #131a34a0;font-size:clamp(15px,1.33vw,21px);line-height:1.22}
.speech strong{color:#ffe08d}
.progress{position:absolute;top:3%;left:35%;z-index:10;display:flex;gap:6px}
.progress i{height:13px;width:13px;background:#36465f;border:1px solid #f1c877;border-radius:50%}
.progress i.on{background:#ffe09b;box-shadow:0 0 10px #ffcc63}
.hint{position:absolute;z-index:10;left:36%;bottom:1.2%;width:28%;max-height:11%;min-height:35px;display:grid;place-items:center;padding:4px 8px;border:1px solid #e1b671;border-radius:10px;background:#203b57df;color:#fff0c8;text-align:center;font-size:clamp(12px,1.1vw,17px);pointer-events:none}
.hint:empty{display:none}
.action{position:absolute;z-index:13;right:3%;bottom:3%;min-height:52px;min-width:168px;padding:7px 15px;border:3px solid #94601b;border-radius:15px;background:linear-gradient(#fff3bd,#e3a34b);color:#493016;font-weight:bold;font-size:clamp(17px,1.48vw,22px);box-shadow:0 5px 0 #714826,0 8px 14px #1b203ba1}
.sun-buttons{position:absolute;inset:0;z-index:7;pointer-events:none}
.sun-point{pointer-events:auto;position:absolute;width:clamp(55px,5.6vw,84px);height:clamp(55px,5.6vw,84px);display:grid;place-items:center;border:3px solid #ffeda7;border-radius:50%;background:radial-gradient(circle,#ffffd4f7,#ffcc57eb 54%,#ffa83771 78%,transparent 90%);color:#72501d;font-size:clamp(24px,2.9vw,40px);font-weight:bold;box-shadow:0 0 22px #ffdf60,0 0 36px #fff1a67c;transform:translate(-50%,-50%);text-shadow:0 1px #ffffdd}
.sun-point[data-index="0"]{left:35.4%;top:30.7%}
.sun-point[data-index="1"]{left:60.4%;top:10.4%}
.sun-point[data-index="2"]{left:88%;top:31.7%}
.sun-point:disabled{opacity:.55;filter:grayscale(.5)}
.sun-point.selected{border:5px solid #fff9cb;box-shadow:0 0 0 5px #f4b9398c,0 0 34px #ffdd57}
.sun-point.done{background:#fbe29ba1;border-color:#d0d9aa;box-shadow:0 0 12px #fff2b0}
.sun-label{position:absolute;z-index:8;top:44%;font:bold clamp(14px,1.25vw,20px) Georgia,serif;color:#ffe5a2;text-shadow:0 2px 6px #241929;pointer-events:none}
.sun-label.east{left:36%}.sun-label.west{left:83%}
.shadow-ray{position:absolute;z-index:7;left:65.3%;top:52.9%;height:14px;width:18%;background:linear-gradient(90deg,#2c284fbf,#15192c04);border-radius:50%;transform-origin:0 50%;transform:rotate(15deg);opacity:0;pointer-events:none;transition:width .45s,transform .45s,opacity .2s}
.shadow-ray.show{opacity:.95}
.shadow-ray[data-sun="0"]{width:24%;transform:rotate(13deg)}
.shadow-ray[data-sun="1"]{width:7.5%;transform:rotate(85deg)}
.shadow-ray[data-sun="2"]{width:24%;transform:rotate(167deg)}
.shadow-options{position:absolute;z-index:10;left:35%;bottom:13%;width:62%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.3%}
.shadow-option{height:clamp(57px,6.2vw,83px);padding:5px 6px;border:3px solid #e7c58a;border-radius:12px;background:#edd3a6eb;color:#593b25;font:bold clamp(14px,1.4vw,21px) Georgia,serif;box-shadow:0 4px 8px #171d33aa}
.shadow-option:disabled{opacity:.5}
.shadow-option.chosen{border-color:#a7e7a3;background:#deecb8}
.shadow-option .symbol{display:block;font-size:clamp(23px,2.3vw,35px);line-height:1}
.gates{position:absolute;inset:0;z-index:8;pointer-events:none}
.gate{position:absolute;top:31%;width:7.7%;height:18%;min-height:62px;border:3px solid #e7d1a9;border-radius:50% 50% 12% 12%;background:radial-gradient(ellipse,#e0a0fa70,#27296170);box-shadow:0 0 16px #cdacff91;color:#fff4c9;font-size:clamp(16px,1.6vw,23px);pointer-events:none}
.gate[data-index="0"]{left:77%}.gate[data-index="1"]{left:85.2%}.gate[data-index="2"]{left:93%}
.gate.ready{pointer-events:auto;border-color:#fff3ac;box-shadow:0 0 26px #ffde9d}
.gate.open{border-color:#d0ffc3;background:#9ff0b84d;box-shadow:0 0 21px #aaf7b6}
.inscription{position:absolute;z-index:10;left:35%;bottom:11%;width:62%;min-height:23%;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:6px;padding:8px 10px;border:4px ridge #d4a15b;border-radius:12px;background:#3c3146ea;box-shadow:0 7px 20px #0e142dbb}
.inscription .slots{display:flex;justify-content:center;gap:7px;min-height:40px}
.inscription .slot{min-width:11%;display:grid;place-items:center;border-bottom:3px solid #e7c88c;border-radius:7px 7px 0 0;background:#dfc5943b;color:#fff4c9;font:bold clamp(18px,2.15vw,30px) Georgia,serif;padding:3px 6px}
.inscription .slot.filled{background:#ffe4a9;color:#503520}
.inscription .tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.inscription .syllable{min-width:0;min-height:clamp(48px,4.2vw,62px);border:2px solid #d5ad61;border-radius:10px;background:linear-gradient(#fff0c4,#d3a258);color:#473021;font:bold clamp(17px,2vw,27px) Georgia,serif;padding:2px}
.inscription .syllable:disabled{opacity:.27}
.inscription .smallnote{text-align:center;font-size:clamp(13px,1.1vw,17px)}
.reward{position:absolute;z-index:10;left:61%;top:24%;width:19%;height:38%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:4px solid #f5db8a;border-radius:50%;background:radial-gradient(circle,#fff3cbdd,#b977328e 74%,#352b3b66);box-shadow:0 0 52px #ffe293ab}
.reward img{max-width:82%;max-height:76%;object-fit:contain;border-radius:50%}
.reward span{color:#54301f;font:bold clamp(15px,1.45vw,21px) Georgia,serif;text-align:center}
.scene[data-stage="done"] .sunwash{opacity:.55;background:linear-gradient(180deg,#fff5b854,transparent)}


/* Compass is a physical instrument on the boat deck, not a separate gameplay window.
   Viewer looks south in this painted scene: east appears left, west right. */
.deck-compass{position:absolute;z-index:10;left:39.2%;top:51.2%;width:23%;aspect-ratio:1;border-radius:50%;filter:drop-shadow(0 8px 8px #2116299e);isolation:isolate}
.compass-face{position:absolute;inset:0;border-radius:50%;border:9px ridge #e8b869;background:
 radial-gradient(circle at 50% 50%,#ffd78c 0 7%,transparent 7.5% 100%),
 repeating-conic-gradient(from -22.5deg,#f4d58a2d 0 22.5deg,#60432a30 22.5deg 45deg),
 radial-gradient(circle,#ad7541f0,#5e3b2be8 79%,#f0c16b 80%);box-shadow:inset 0 0 0 4px #734c2b,inset 0 0 24px #1e171660,0 0 10px #fff1b35e;pointer-events:none}
.compass-face::before{content:"";position:absolute;inset:15%;border:2px solid #f6d999;border-radius:50%;pointer-events:none}
.compass-needle{position:absolute;left:50%;top:22%;width:3%;height:56%;transform:translateX(-50%);background:linear-gradient(to bottom,#ecb957 0 49%,#8fc0d4 50% 100%);clip-path:polygon(50% 0,100% 48%,64% 50%,100% 52%,50% 100%,0 52%,36% 50%,0 48%);filter:drop-shadow(0 2px 2px #1d1b299e);pointer-events:none}
.compass-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#ffe6ab;text-shadow:0 1px 5px #382313;font-size:clamp(19px,2.2vw,29px);pointer-events:none}
.compass-direction{position:absolute;width:39%;height:22%;min-height:45px;display:grid;place-items:center;border:2px solid #f0ce8a;border-radius:12px;padding:3px 1px;background:linear-gradient(135deg,#ffecbcee,#e0b471ed);color:#50351c;font:700 clamp(12px,1.12vw,17px)/1 system-ui,sans-serif;letter-spacing:.025em;text-shadow:none;box-shadow:0 3px 7px #362a2999;transition:transform .18s,background .18s;touch-action:manipulation}
.compass-direction.north{left:30.5%;bottom:0}
.compass-direction.south{left:30.5%;top:0}
.compass-direction.east{left:-2%;top:39%}
.compass-direction.west{right:-2%;top:39%}
.compass-direction:not(:disabled):hover{transform:scale(1.05);background:#fff1c9}
.compass-direction.discovered{background:#c6dfb4;border-color:#eaffc3;color:#34503e}
.compass-direction.selected{background:#fff8c9;border-color:#fff;box-shadow:0 0 17px #fff3ae,0 3px 5px #45311c}
.scene[data-stage="compass"] .speech{top:36%;left:66%;width:32%;max-height:35%;min-height:12%;text-align:center;font-size:clamp(17px,1.55vw,24px);line-height:1.28;background:#152847f2}
.scene[data-stage="compass"] .hint{left:67%;bottom:18%;width:29%;max-height:15%;min-height:42px;background:#25354ae9;font-size:clamp(14px,1.2vw,18px)}
.scene[data-stage="compass"] .action{right:3%;bottom:3%}
@media(prefers-reduced-motion:reduce){.compass-direction{transition:none}}

/* Cinematic illustrated journey: all interactions are elements in the painted scene. */
.scene[data-stage="sky"] .speech{top:53%;left:41%;width:37%;max-height:none;min-height:10%;padding:9px 13px;font-size:clamp(17px,1.45vw,22px);background:#142d4ee9;text-align:center}
.scene[data-stage="sky"] .hint{left:39%;width:30%;bottom:1%;min-height:36px}
.scene[data-stage="sky"] .sun-point{width:clamp(63px,6.6vw,92px);height:clamp(63px,6.6vw,92px);background:#fff9cd12;color:transparent;font-size:0;border:3px solid #fff5c4b5;box-shadow:0 0 10px #ffdb73a8;transition:box-shadow .25s,opacity .25s,filter .25s}
.scene[data-stage="sky"] .sun-point:disabled{opacity:.3}
.scene[data-stage="sky"] .sun-point:not(:disabled){box-shadow:0 0 0 3px #f6bd5680,0 0 23px #ffe7a3;animation:destination-glow 2.5s ease-in-out infinite}
.scene[data-stage="sky"] .sun-point.selected{box-shadow:0 0 0 4px #fff5c6,0 0 30px #ffdf70}
.sun-point[data-index="0"]{left:30.5%;top:31.5%}
.sun-point[data-index="1"]{left:59.2%;top:10.3%}
.sun-point[data-index="2"]{left:83.8%;top:23.1%}
.travelling-sun{position:absolute;z-index:8;width:clamp(52px,6.1vw,91px);height:clamp(52px,6.1vw,91px);left:30.5%;top:31.5%;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%);border:3px solid #fff5b9;background:radial-gradient(circle,#fffdd6 0%,#fff3a2 22%,#ffbf24d9 49%,#f2871129 70%,transparent 87%);box-shadow:0 0 28px 10px #ffe171a1,0 0 60px 25px #ffca5958;transition:left 1s cubic-bezier(.16,.75,.27,1),top 1s cubic-bezier(.16,.75,.27,1),opacity .25s;animation:orb-glow 3s ease-in-out infinite}
.travelling-sun[data-stop="0"]{left:30.5%;top:31.5%}
.travelling-sun[data-stop="1"]{left:59.2%;top:10.3%}
.travelling-sun[data-stop="2"]{left:83.8%;top:23.1%}
.storm-clouds{position:absolute;inset:0;z-index:12;pointer-events:none}
.cloud-target{pointer-events:auto;position:absolute;display:grid;place-items:center;padding:0;border:3px solid #ffe5a98c;border-radius:46% 48% 47% 44%;background:radial-gradient(ellipse,#ffffd510,transparent 70%);color:#ffebac;box-shadow:0 0 15px #d298f078;transition:opacity .25s,transform .25s,box-shadow .25s}
.cloud-target span{font-size:clamp(23px,2vw,31px);text-shadow:0 0 8px #fff0b0,0 0 15px #f0c6ff;pointer-events:none}
.cloud-target:not(:disabled){animation:storm-call 2s ease-in-out infinite}
.cloud-target:hover,.cloud-target:focus-visible{border-color:#fff2aa;box-shadow:0 0 22px #ffe4a5}
.cloud-target:disabled{opacity:0;pointer-events:none}
#solar-cloud-0{left:28%;top:6%;width:17.5%;height:21%}
#solar-cloud-1{left:45%;top:17%;width:19.5%;height:21%}
#solar-cloud-2{left:67.5%;top:7%;width:17%;height:21%}
.cloud-clear{position:absolute;z-index:2;inset:0;opacity:0;pointer-events:none;background:url('images/egypt-solar-noon-cleared.webp') center / 100% 100% no-repeat;transition:opacity .65s ease}
.cloud-clear.cleared{opacity:1}
#solarCloudClear0{-webkit-mask-image:radial-gradient(ellipse 15% 23% at 36% 16%,#000 58%,transparent 95%);mask-image:radial-gradient(ellipse 15% 23% at 36% 16%,#000 58%,transparent 95%)}
#solarCloudClear1{-webkit-mask-image:radial-gradient(ellipse 17% 22% at 54% 27%,#000 55%,transparent 95%);mask-image:radial-gradient(ellipse 17% 22% at 54% 27%,#000 55%,transparent 95%)}
#solarCloudClear2{-webkit-mask-image:radial-gradient(ellipse 16% 24% at 75% 17%,#000 55%,transparent 95%);mask-image:radial-gradient(ellipse 16% 24% at 75% 17%,#000 55%,transparent 95%)}
.river-motion{position:absolute;z-index:2;left:47%;top:55%;width:51%;height:22%;pointer-events:none;opacity:.22;background-image:radial-gradient(ellipse,#fff8c8 0,transparent 62%);background-size:70px 4px;transform:skewX(-10deg);animation:river-current 8s linear infinite}
.scene[data-stage="gates"] .river-motion,.scene[data-stage="done"] .river-motion{opacity:.1}
.scene[data-stage="sky"][data-time="sunset"] .sunwash{opacity:.26}
@keyframes river-current{to{background-position:210px 0}}
@keyframes storm-call{50%{box-shadow:0 0 17px 6px #f9ca68aa;transform:scale(1.035)}}
@keyframes orb-glow{50%{box-shadow:0 0 33px 14px #ffe08ec2,0 0 61px 28px #ffca596b}}
@keyframes destination-glow{50%{box-shadow:0 0 0 3px #ffda78a8,0 0 20px 8px #fff4bc64}}
@media(prefers-reduced-motion:reduce){
 .river-motion,.travelling-sun,.cloud-target,.scene[data-stage="sky"] .sun-point:not(:disabled){animation:none!important;transition:none!important}
 .cloud-clear{transition:none}
}

@media(max-width:740px){main{padding:4px}header h1{font-size:16px}.nav{padding:4px 7px;min-width:70px;font-size:12px}.scene{min-width:780px}.viewport{border-radius:9px}}
@media(prefers-reduced-motion:reduce){.nightwash,.sunwash,.shadow-ray{transition:none}}
</style>
</head>
<body>
<main>
<header><a class="nav" href="egypt-mummy-tomb.html">← Гробница</a><h1>☀ Солнечная ладья Ра</h1><a class="nav" href="index.html">⌂ Карта</a></header>
<div class="viewport" aria-label="Нил и солнечная ладья. На телефоне игровую сцену можно прокручивать по горизонтали">
<section class="scene" id="solarScene" data-stage="intro" data-time="day" aria-label="Путешествие с Ра на солнечной ладье над Нилом">
<img class="backdrop" id="solarBackdrop" src="images/egypt-solar-sunrise-action.webp" alt="" draggable="false" fetchpriority="high" decoding="async">
<div class="cloud-clear" id="solarCloudClear0" aria-hidden="true"></div>
<div class="cloud-clear" id="solarCloudClear1" aria-hidden="true"></div>
<div class="cloud-clear" id="solarCloudClear2" aria-hidden="true"></div>
<div class="river-motion" aria-hidden="true"></div>
<div class="sunwash" aria-hidden="true"></div><div class="nightwash" aria-hidden="true"></div>
<div class="lada" id="solarLada" role="img" aria-label="Лада в выбранном костюме"><img src="images/lada-cutout.webp" alt="" draggable="false"><img data-outfit-layer hidden alt="" draggable="false"></div>
<div class="speech" id="solarSpeech" aria-live="polite"><strong>Ра:</strong> Поможешь мне провести Солнце по небу?</div>
<div class="progress" id="solarProgress" aria-label="Этапы путешествия"><i></i><i></i><i></i></div>
<div class="travelling-sun" id="solarMovingSun" aria-hidden="true" hidden></div>
<div class="storm-clouds" id="solarClouds" hidden aria-label="Разгони грозовые тучи">
<button type="button" class="cloud-target" id="solar-cloud-0" aria-label="Разогнать левую грозовую тучу"><span aria-hidden="true">✦</span></button>
<button type="button" class="cloud-target" id="solar-cloud-1" aria-label="Разогнать среднюю грозовую тучу"><span aria-hidden="true">✦</span></button>
<button type="button" class="cloud-target" id="solar-cloud-2" aria-label="Разогнать правую грозовую тучу"><span aria-hidden="true">✦</span></button>
</div>
<div class="deck-compass" id="solarCompass" hidden aria-label="Компас Ра. Найди север, юг, восток и запад">
 <span class="compass-face" aria-hidden="true"></span>
 <span class="compass-needle" aria-hidden="true"></span>
 <span class="compass-core" aria-hidden="true">✦</span>
 <button class="compass-direction north" id="solar-direction-north" type="button" aria-label="Север" data-direction="north">СЕВЕР</button>
 <button class="compass-direction south" id="solar-direction-south" type="button" aria-label="Юг" data-direction="south">ЮГ</button>
 <button class="compass-direction east" id="solar-direction-east" type="button" aria-label="Восток" data-direction="east">ВОСТОК</button>
 <button class="compass-direction west" id="solar-direction-west" type="button" aria-label="Запад" data-direction="west">ЗАПАД</button>
 </div>
<div class="sun-buttons" id="solarSuns" hidden aria-label="Выбери положение Солнца">
<button class="sun-point" id="solar-sun-0" data-index="0" type="button" aria-label="Восход: восток">☀</button>
<button class="sun-point" id="solar-sun-1" data-index="1" type="button" aria-label="Полдень: высокое солнце">☀</button>
<button class="sun-point" id="solar-sun-2" data-index="2" type="button" aria-label="Закат: запад">☀</button>
</div>
<div class="sun-label east" id="solarEast" hidden>ВОСТОК</div><div class="sun-label west" id="solarWest" hidden>ЗАПАД</div>
<div class="shadow-ray" id="solarShadow" aria-hidden="true"></div>
<div class="shadow-options" id="solarShadowOptions" hidden aria-label="Выбери тень">
<button class="shadow-option" id="solar-shadow-0" type="button" aria-label="Длинная тень направо"><span class="symbol">⟶</span>Длинная</button>
<button class="shadow-option" id="solar-shadow-1" type="button" aria-label="Короткая тень"><span class="symbol">↓</span>Короткая</button>
<button class="shadow-option" id="solar-shadow-2" type="button" aria-label="Длинная тень налево"><span class="symbol">⟵</span>Длинная</button>
