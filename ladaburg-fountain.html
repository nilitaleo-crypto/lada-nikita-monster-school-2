<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22372e">
<meta name="description" content="Тиввиг: семь злых духов у фонтана Ладабурга. Отгадай загадки и заманивай духов в волшебную книгу.">
<title>Фонтан семи духов · Тиввиг</title>
<style>
:root{--ink:#36251c;--gold:#dfb979;--milk:#fff3cf;--dark:#182a22}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#172b26}
body{font-family:Georgia,'Times New Roman',serif;color:var(--milk);overflow-x:hidden}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid #ffebaa;outline-offset:3px}
[hidden]{display:none!important}
.screen{min-height:100dvh;padding:10px 14px 20px;background:radial-gradient(ellipse at top,#638577 0%,#243b30 62%,#10201b)}
.top{max-width:1320px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 auto 10px}
.top h1{font-size:clamp(19px,2.4vw,29px);font-weight:normal;text-align:center;margin:0;text-shadow:0 3px 9px #000a}
.top a,.top button{display:inline-flex;align-items:center;justify-content:center;min-height:43px;border:1px solid #e6ce96;border-radius:12px;background:#2d4131;color:#fff4d7;padding:8px 14px;text-decoration:none;font-size:clamp(12px,1.4vw,16px);box-shadow:0 2px 9px #0006}
.stage{position:relative;isolation:isolate;margin:auto;width:min(100%,1320px);height:min(760px,calc(100dvh - 100px));min-height:570px;overflow:hidden;border:5px ridge #d1b580;border-radius:19px;box-shadow:0 20px 55px #0009;background:#577a75}
.city{position:absolute;inset:0;background:#577a75 url('images/ladaburg-fountain-closeup.webp?v=3') center/cover no-repeat}
.stage::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 60px #17251a99;pointer-events:none;z-index:1}
.water{position:absolute;left:42%;top:65%;width:36%;height:13%;border-radius:50%;background:radial-gradient(ellipse,#abf8ef90,#59b3b070 46%,transparent 73%);filter:blur(10px);opacity:.7;z-index:2;pointer-events:none;animation:water 3.5s ease-in-out infinite alternate}
@keyframes water{from{transform:scale(.94)}to{transform:scale(1.12)}}
.heading-ribbon{position:absolute;top:2.6%;left:23%;z-index:3;display:block;font:bold clamp(11px,1.4vw,17px) Georgia,serif;letter-spacing:.13em;color:#fff4d7;text-shadow:0 3px 7px #000a;text-transform:uppercase;pointer-events:none}
.progress{position:absolute;z-index:20;top:2.5%;right:2%;display:flex;gap:4px;padding:7px 10px;border:2px solid #b69a62;border-radius:20px;background:#152f2ade;box-shadow:0 4px 12px #0006}
.seal{font-size:clamp(17px,2.4vw,25px);width:clamp(18px,2.6vw,28px);text-align:center;filter:grayscale(.9);opacity:.55;transform:scale(.9);transition:filter .3s,opacity .3s,transform .3s}
.seal.active{filter:none;opacity:1;transform:scale(1.1)}
.lada{position:absolute;z-index:10;left:1.8%;bottom:17%;height:58%;width:21%;object-fit:contain;object-position:bottom;filter:drop-shadow(2px 8px 8px #17201577);pointer-events:none}
.book-hands{position:absolute;z-index:12;left:5.8%;bottom:25.5%;width:17.5%;min-width:96px;opacity:1;transform:rotate(-5deg);filter:drop-shadow(0 5px 6px #0008);pointer-events:none;transform-origin:center bottom}
.book-hands.glow{opacity:1;animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 4px 5px #372113)}to{filter:drop-shadow(0 0 27px #ffe28f) drop-shadow(0 0 5px #fff)}}
.ghost-zone{position:absolute;left:49.5%;top:21%;width:26%;height:47%;z-index:7;display:flex;justify-content:center;align-items:center;pointer-events:none}
.ghost{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 15px #ffe3a9ba) drop-shadow(0 7px 16px #1f291db5);animation:ghostBob 2.7s ease-in-out infinite;transform-origin:bottom center;user-select:none}
.ghost.appearing{animation:emerge 850ms cubic-bezier(.2,.92,.24,1.06) both}
@keyframes ghostBob{0%,100%{transform:translateY(3px) rotate(-2deg)}50%{transform:translateY(-16px) rotate(2deg)}}
@keyframes emerge{0%{opacity:0;transform:translateY(140px) scale(.2)}80%{opacity:1}100%{transform:translateY(0) scale(1)}}
.speech{position:absolute;z-index:16;top:7%;left:21%;width:min(43%,610px);padding:16px 22px 18px;background:linear-gradient(165deg,#fff2d4f7,#e4c998f5);border:3px solid #a57c49;border-radius:23px 26px 26px 7px;color:#3b271b;box-shadow:0 8px 0 #6b4c2a72,0 15px 35px #0007;max-height:31%;display:grid;align-content:center;overflow:hidden}
.speech::after{content:'';position:absolute;bottom:-12px;left:18%;width:21px;height:21px;background:#e4c998;border-right:3px solid #a57c49;border-bottom:3px solid #a57c49;transform:rotate(45deg);z-index:-1}
.spirit-name{font:bold clamp(11px,1.3vw,14px) Georgia,serif;letter-spacing:.1em;text-transform:uppercase;color:#865a38;margin:0 0 7px}
.riddle{font-size:clamp(16px,1.9vw,24px);line-height:1.24;font-weight:bold;margin:0;text-wrap:balance}
.instruction{position:absolute;z-index:8;top:3.6%;left:2%;font-size:clamp(12px,1.4vw,16px);color:#fff2c8;text-shadow:0 3px 7px #0a201bb0}
.tray{position:absolute;z-index:22;left:1.8%;right:1.8%;bottom:1.9%;min-height:16%;border-radius:20px 20px 13px 13px;background:linear-gradient(160deg,#f3ddadf5,#caa67bea 50%,#92724def);border:3px solid #b08b57;box-shadow:0 8px 0 #4f3b2eab,0 14px 25px #0008,inset 0 2px #ffeec7;display:flex;justify-content:space-evenly;align-items:center;gap:3px;padding:12px 9px}
.tray::before{content:'';position:absolute;top:-8px;left:2%;right:2%;height:8px;background:#f4e2b4d8;border-radius:100% 100% 0 0}
.fruit{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1 1 0;width:10%;min-width:0;min-height:85px;background:transparent;border:0;border-radius:18px;transition:transform .13s,background .13s,opacity .2s;user-select:none}
.fruit:hover:not(:disabled),.fruit:focus-visible{background:#fff1d13f;transform:translateY(-6px)}
.fruit:active:not(:disabled){transform:scale(.9)}
.fruit .pic{font-size:clamp(38px,5.2vw,72px);line-height:1.1;filter:drop-shadow(0 4px 2px #543c2677)}
.fruit:disabled{opacity:.2;filter:grayscale(.9);cursor:default}
.fruit.wrong{animation:wrong .38s linear}
@keyframes wrong{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.basket{z-index:3;flex:0 0 12%;align-self:center;display:grid;place-items:center;min-width:60px;color:#563a24;text-align:center;border-left:2px solid #98673e80;padding-left:5px}
.basket span:first-child{font-size:clamp(39px,5vw,65px);line-height:1}
.basket .count{font:bold clamp(12px,1.7vw,18px) system-ui,sans-serif;color:#53371d;font-variant-numeric:tabular-nums}
.float-fruit{position:fixed;z-index:9999;pointer-events:none;font-size:64px;line-height:1;filter:drop-shadow(0 4px 5px #0006);will-change:transform,opacity}
.ghost-message{position:absolute;right:20%;top:17%;z-index:18;color:#fff0c0;background:#1c2f2b9a;padding:5px 9px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none}
.ghost-message.visible{opacity:1}
.finish{position:absolute;z-index:30;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;text-align:center;padding:24px;background:#0e2a25d9;backdrop-filter:blur(5px)}
.finish .final-book{font-size:clamp(92px,13vw,170px);filter:drop-shadow(0 0 33px #f9db94);animation:bookRise 1.4s ease-in-out infinite alternate}
.finish h2{font-size:clamp(27px,4vw,48px);margin:0;color:#ffe7a5}
.finish p{margin:0;font-size:clamp(15px,1.9vw,22px)}
.finish .actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.finish button,.finish a{border:2px solid #e7bf7c;background:#f5dcab;color:#4b3224;border-radius:14px;padding:11px 18px;font-size:18px;font-weight:bold;text-decoration:none;min-height:48px}
@keyframes bookRise{from{transform:scale(.95) translateY(6px)}to{transform:scale(1.03) translateY(-7px)}}
@media(max-width:800px){
.screen{padding:6px 7px 10px}.top{margin-bottom:6px;gap:3px}.top h1{font-size:17px}.top a,.top button{padding:7px 8px;font-size:12px;min-height:38px}
.stage{height:calc(100dvh - 65px);max-height:1060px;min-height:610px;border-width:3px;border-radius:12px}
.city{background-position:center center;background-size:cover}
.heading-ribbon{display:none}.progress{top:2%;right:2%;gap:1px;padding:5px}.seal{font-size:18px;width:20px}
.speech{top:7%;left:4%;width:92%;max-height:24%;padding:12px 16px;border-radius:18px}
.spirit-name{font-size:13px;margin-bottom:4px}.riddle{font-size:clamp(18px,3.5vw,25px)}
.lada{height:46%;width:34%;left:0%;bottom:22%}.book-hands{left:8%;bottom:28%;width:18%;min-width:64px}
.ghost-zone{left:49%;top:31%;width:40%;height:34%}.tray{bottom:2%;left:1%;right:1%;padding:8px 4px;min-height:15%;gap:0}.fruit{min-height:70px}.fruit .pic{font-size:clamp(31px,5.4vw,48px)}.basket{min-width:45px}.basket span:first-child{font-size:38px}.basket .count{font-size:12px}
}
@media(max-width:520px){
.top h1{font-size:14px}.stage{min-height:710px;height:calc(100dvh - 60px)}
.speech{top:8%;max-height:24%;width:94%;left:3%}.riddle{font-size:18px;line-height:1.18}
.lada{height:41%;width:39%;left:-2%;bottom:25%}.book-hands{left:10%;bottom:30%;width:21%;min-width:65px}
.ghost-zone{left:50%;top:40%;width:44%;height:28%}.tray{min-height:25%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,1fr);row-gap:0;bottom:1.5%}.fruit{width:100%;min-height:54px}.fruit .pic{font-size:clamp(30px,9vw,45px)}.basket{grid-column:4;grid-row:2;min-width:0;border-left:0;padding-left:0}.basket span:first-child{font-size:33px}
}
@media(prefers-reduced-motion:reduce){*,*::after,*::before{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* v3: crisp high-resolution scene; strong silhouettes without obstructing the riddles. */
.ghost-zone{left:64%;top:27%;width:30%;height:51%}
.ghost-zone::before{content:"";position:absolute;inset:-6%;border-radius:50%;background:radial-gradient(ellipse at 50% 49%,rgba(22,33,49,.67) 0%,rgba(25,44,48,.43) 39%,rgba(22,37,46,.14) 67%,transparent 79%);filter:blur(10px);pointer-events:none;z-index:0}
.ghost{position:relative;z-index:1;filter:drop-shadow(0 0 3px rgba(19,24,43,.96)) drop-shadow(0 4px 10px rgba(19,25,40,.92)) drop-shadow(0 13px 18px rgba(17,28,34,.8))}
@media(max-width:800px){.ghost-zone{left:51%;top:33%;width:44%;height:37%}}
@media(max-width:520px){.ghost-zone{left:52%;top:40%;width:44%;height:30%}}

/* The lady from the found book appears after all seven spirits have been caught. */
.finish{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(12px,2.8vw,35px);align-items:center;justify-items:stretch;text-align:left;overflow:auto;padding:clamp(12px,3vw,30px);background:radial-gradient(ellipse at 30% 37%,#41545b,#1a293c 55%,#0e1927 100%);backdrop-filter:none}
.finish-portrait{display:block;max-width:100%;width:100%;height:min(100%,660px);max-height:calc(100% - 4px);object-fit:cover;object-position:center 25%;border:3px solid #d8b779;border-radius:16px;box-shadow:0 9px 35px #0009,0 0 38px #ffe5b133;animation:ladyReveal .7s ease-out both}
.finish-copy{min-width:0;max-width:600px;padding:clamp(14px,3vw,38px) clamp(14px,2.5vw,32px);border:2px solid #cfb17b;border-radius:20px;background:linear-gradient(150deg,#faeac9,#d8ba8e);color:#3b2b23;box-shadow:0 8px 22px #0009}
.finish .finish-kicker{margin:0 0 15px;font:bold clamp(12px,1.5vw,16px) Georgia,serif;letter-spacing:.09em;color:#775338;text-transform:uppercase}
.finish h2{margin:0 0 15px;color:#3b2b23;font-size:clamp(24px,3.2vw,44px);line-height:1.15}
.finish .finish-line{margin:0 0 25px;color:#503929;font-size:clamp(19px,2.1vw,28px);line-height:1.32}
.finish .actions{justify-content:flex-start}
.finish button,.finish a{font-size:clamp(15px,1.5vw,18px);min-height:46px}
@keyframes ladyReveal{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:700px){
 .finish{display:flex;flex-direction:column;justify-content:center;gap:10px;overflow-y:auto;padding:10px}
 .finish-portrait{flex:0 1 auto;width:min(100%,310px);height:min(43dvh,390px);min-height:170px;object-fit:cover;object-position:center 20%}
 .finish-copy{width:100%;padding:13px 15px}
 .finish .finish-kicker{margin-bottom:7px;font-size:12px}
 .finish h2{font-size:clamp(23px,5.5vw,32px);margin-bottom:6px}
 .finish .finish-line{font-size:18px;margin-bottom:12px}
 .finish .actions{gap:8px}
 .finish button,.finish a{padding:8px 11px;font-size:15px}
}
</style>
</head>
<body>
<div class="screen">
<header class="top"><a href="ladaburg.html" aria-label="Вернуться в Ладабург">← Ладабург</a><h1>⛲ Фонтан семи духов</h1><button type="button" id="restart" aria-label="Начать заново">↻ Сначала</button></header>
<main class="stage" id="stage" aria-label="У фонтана Ладабурга появились семь злых духов">
  <div class="city" aria-hidden="true"></div><div class="water" aria-hidden="true"></div>
  <div class="heading-ribbon">ЛАДАБУРГ · ЦЕНТРАЛЬНЫЙ ФОНТАН</div>
  <div class="progress" id="progress" aria-label="Поймано 0 из 7 духов" role="status" aria-live="polite">
    <span class="seal" aria-hidden="true">✦</span><span class="seal" aria-hidden="true">✦</span><span class="seal" aria-hidden="true">✦</span><span class="seal" aria-hidden="true">✦</span><span class="seal" aria-hidden="true">✦</span><span class="seal" aria-hidden="true">✦</span><span class="seal" aria-hidden="true">✦</span>
  </div>
  <div class="speech" id="speech" role="status" aria-live="polite"><p class="spirit-name" id="spiritName"></p><p class="riddle" id="riddle"></p></div>
  <img class="lada" id="lada" src="images/lada-cutout.webp" alt="Лада стоит у фонтана" draggable="false" width="520" height="1448">
  <svg class="book-hands" id="book" viewBox="0 0 220 160" xmlns="http://www.w3.org/2000/svg" aria-label="Волшебная книга Лады" role="img"><defs><linearGradient id="cover" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#3d2336"/><stop offset="1" stop-color="#161d29"/></linearGradient><linearGradient id="page" x1="0" x2="1"><stop stop-color="#fcf4d9"/><stop offset="1" stop-color="#dfcb9c"/></linearGradient></defs><path d="M110 18 Q64 -2 7 28 L9 143 Q63 119 110 145 Z" fill="url(#cover)" stroke="#e7b96f" stroke-width="6"/><path d="M110 18 Q156 -2 214 28 L212 143 Q157 119 110 145 Z" fill="url(#cover)" stroke="#e7b96f" stroke-width="6"/><path d="M109 30 Q62 12 21 38 L22 130 Q64 110 109 132 Z" fill="url(#page)"/><path d="M111 30 Q159 12 200 38 L199 130 Q157 110 111 132 Z" fill="url(#page)"/><path d="M110 19 V146" stroke="#af7647" stroke-width="6"/><g stroke="#93704b" stroke-width="2" opacity=".55"><path d="M39 46 Q65 39 90 49 M37 63 Q62 55 92 65 M37 82 Q65 74 92 82 M39 100 Q64 93 90 101"/><path d="M130 48 Q155 40 181 47 M131 64 Q155 57 184 64 M130 81 Q156 75 183 81 M132 99 Q153 94 184 99"/></g><g fill="#a56d27"><path d="M110 54 L117 72 L136 72 L120 84 L125 102 L110 91 L95 102 L100 84 L84 72 L103 72Z"/></g></svg>

<script>
(()=>{
 'use strict';
 const ghostSources=['images/fountain-ghost-1.webp?v=3','images/fountain-ghost-2.webp?v=3','images/fountain-ghost-3.webp?v=3','images/fountain-ghost-4.webp?v=3','images/fountain-ghost-5.webp?v=3','images/fountain-ghost-6.webp?v=3','images/fountain-ghost-7.webp?v=3'];
 const rounds=[
  {id:'apple',name:'Ворчун',riddle:'Само с кулачок, красный бочок. Потрогаешь — гладко, а откусишь — сладко.'},
  {id:'banana',name:'Хитрец',riddle:'Месяц с неба свалился — и в тарелке очутился.'},
  {id:'grapes',name:'Жадина',riddle:'На шнурочке-стебелёчке сладких ягод груда.'},
  {id:'pear',name:'Вредина',riddle:'Мне нужен фрукт, в названии которого есть буква У!'},
  {id:'pineapple',name:'Колючка',riddle:'Жарким солнышком согрет, в шкурку, как в броню, одет. На макушке — хохолок!'},
  {id:'orange',name:'Командир',riddle:'Хочу фрукт на букву А! Круглый, как солнце, и оранжевый.'},
  {id:'lemon',name:'Король духов',riddle:'Мне нужен фрукт из пяти букв: начинается на Л, заканчивается на Н!'}
 ];
 const $=id=>document.getElementById(id);
 const fruits=[...document.querySelectorAll('.fruit')],seals=[...document.querySelectorAll('.seal')];
 const ghost=$('ghost'),zone=$('ghostZone'),feedback=$('feedback'),book=$('book'),finish=$('finish'),riddle=$('riddle'),spiritName=$('spiritName');
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 let index=0,locked=false,finished=false,generation=0;
 const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
 function render(){
  const round=rounds[index];
  seals.forEach((el,i)=>el.classList.toggle('active',i<index));
  $('count').textContent=index+' / 7';$('progress').setAttribute('aria-label','Поймано '+index+' из 7 духов');
  fruits.forEach(b=>{b.disabled=rounds.slice(0,index).some(r=>r.id===b.dataset.fruit);b.classList.remove('wrong')});
  if(!round)return;
  spiritName.textContent='ЗЛОЙ ДУХ · '+round.name;
  riddle.textContent='«'+round.riddle+'»';
  ghost.src=ghostSources[index];
  ghost.style.opacity='1';ghost.style.transform='';ghost.classList.remove('appearing');
  void ghost.offsetWidth;ghost.classList.add('appearing');
 }
 function showWrong(button){
  button.classList.remove('wrong');void button.offsetWidth;button.classList.add('wrong');
  feedback.classList.add('visible');
  if(!reduce&&ghost.animate){ghost.animate([{transform:'translateX(0)'},{transform:'translateX(-10px)'},{transform:'translateX(12px)'},{transform:'translateX(0)'}],{duration:350})}
  setTimeout(()=>{feedback.classList.remove('visible');button.classList.remove('wrong')},470);
 }
 async function throwFruit(button,tag){
  const start=button.getBoundingClientRect(),end=zone.getBoundingClientRect();
  const flyer=document.createElement('span');flyer.className='float-fruit';flyer.textContent=button.querySelector('.pic').textContent;
  flyer.style.left=(start.left+start.width/2-32)+'px';flyer.style.top=(start.top+start.height/2-32)+'px';
  document.body.append(flyer);
  if(reduce||!flyer.animate){flyer.remove();return}
  const dx=end.left+end.width*.51-(start.left+start.width/2),dy=end.top+end.height*.53-(start.top+start.height/2);
  try{const anim=flyer.animate([{transform:'translate(0px,0px) scale(1)',opacity:1},{transform:`translate(${dx*.52}px,${dy*.72-90}px) rotate(-25deg) scale(1.12)`,opacity:1,offset:.52},{transform:`translate(${dx}px,${dy}px) rotate(15deg) scale(.5)`,opacity:0}],{duration:680,easing:'ease-in-out',fill:'forwards'});await anim.finished.catch(()=>{})}finally{flyer.remove()}
  if(tag!==generation)return;
 }
 async function captureGhost(tag){
  if(tag!==generation)return;
  ghost.classList.remove('appearing');
  const b=book.getBoundingClientRect(),g=ghost.getBoundingClientRect();
  const dx=b.left+b.width*.5-(g.left+g.width*.5),dy=b.top+b.height*.5-(g.top+g.height*.5);
  book.classList.add('glow');
  if(!reduce&&ghost.animate){const animation=ghost.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${dx*.65}px,${dy*.6}px) scale(.6) rotate(-20deg)`,opacity:.85,offset:.58},{transform:`translate(${dx}px,${dy}px) scale(.04) rotate(50deg)`,opacity:0}],{duration:840,easing:'ease-in',fill:'forwards'});await animation.finished.catch(()=>{});animation.cancel()}else await delay(80);
  if(tag!==generation)return;
  ghost.style.opacity='0';book.classList.remove('glow');
  index++;
  if(index===rounds.length){complete();return}
  render();locked=false;
 }
 async function choose(button){
  if(locked||finished||button.disabled)return;
  if(button.dataset.fruit!==rounds[index].id){showWrong(button);return}
  locked=true;const tag=generation;
  fruits.forEach(b=>b.disabled=true);
  await throwFruit(button,tag);
  if(tag!==generation)return;
  await captureGhost(tag);
 }
 function complete(){
  finished=true;locked=true;
  seals.forEach(el=>el.classList.add('active'));$('count').textContent='7 / 7';$('progress').setAttribute('aria-label','Поймано 7 из 7 духов');
  try{if(window.TivvigRegistry?.unlockReward){window.TivvigRegistry.unlockReward('tivvig_reward_fountain_spirits_v1')}else localStorage.setItem('tivvig_reward_fountain_spirits_v1','unlocked')}catch(e){}
  setTimeout(()=>{if(finished)finish.hidden=false},reduce?50:450);
 }
 function reset(){
  generation++;index=0;locked=false;finished=false;finish.hidden=true;feedback.classList.remove('visible');book.classList.remove('glow');
  document.querySelectorAll('.float-fruit').forEach(el=>el.remove());render();
 }
 fruits.forEach(button=>button.addEventListener('click',()=>choose(button)));
 $('restart').addEventListener('click',reset);$('again').addEventListener('click',reset);
 render();
 window.__fountainTest={getState:()=>({index,locked,finished,fruitDisabled:fruits.filter(f=>f.disabled).map(f=>f.dataset.fruit)}),reset,rounds:rounds.map(r=>({id:r.id,riddle:r.riddle}))};
})();
</script>
